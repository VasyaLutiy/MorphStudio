    - name: pump
      description: >
        Package daemon in daemon/, file daemon/pump.go (the second Component of the package; it reads the unexported
        fields of daemon/daemon.go): the goroutine that moves every line of a claude process into the session log, the
        machine and the loop, and that turns the process's exit into a logged, counted event. Imports morphstudio/claude,
        morphstudio/eventlog, morphstudio/stream, morphstudio/supervisor, context, encoding/json, strings.
      language: go
      functions:
        - name: Pump
          description: The goroutine that reads the process, logs every line, feeds the machine and the loop, and executes what they return.
          behavior: >
            Declares in daemon/pump.go, over the Daemon of daemon/daemon.go (its fields d.deps, d.mu, d.projects and the proj fields machine, proc,
            state, pumps; its helpers d.execute and d.writeLine, both called with d.mu held): an init func setting daemon.go's startPump to a function
            (called by the spawn action with d.mu held) that stores a new done channel in the project's pumps map under p and starts
            `go` d.pump(ctx, project, p, l); when pump returns the goroutine closes the channel and deletes the map entry under d.mu (the map
            never grows past the live pumps); `func (d *Daemon) pump(ctx context.Context, project string, p
            claude.Process, l *eventlog.Log)`; and `func (d *Daemon) Wait(project string)`: under d.mu it takes the done channels of the project's pumps
            whose process is not the current one, releases d.mu and waits for each (immediate when none; tests call it once a newer spawn replaced the
            process or an exit was handled). pump: for every line from p.Lines(), the whole handling under d.mu (so a caller that sees the line
            in Events sees its effects too): now := Now(); l.Append("out", msg, now) where msg is the line when json.Valid, else
            json.Marshal(string(line)) (an append error ignored); ev, err := stream.Parse(line) (err → the next line); when p is not the
            project's current process, nothing more (the line stays in its own log); else loop.Event(now); macts :=
            machine.Apply(ev, now); by ev.Type: "result" with a Result → lacts := loop.Turn(*ev.Result, now, Config.Loop); "rate_limit_event" with
            Limits → lacts := loop.Limits(*ev.Limits, now, Config.Loop); then each machine action in order: "write" → d.writeLine(project, Line); "ask"
            → Post(ctx, project, "ask", Headline, Numbers); "turn" → Post(ctx, project, "idle", the loop's Phase + " turn ended: " + the first 200
            runes of Headline (or "(no text)" when Headline is empty), Numbers); "limit" → nothing; then d.execute(ctx, project, lacts) (which saves
            the State; never d.Execute, which locks); then, for a "result" event only, d.finishDone(ctx, project, p) (a phase_done left pending for
            this process runs now, after Turn has put the turn's total_cost_usd into SessionUSD: the end check, the kill, the next phase or the stop
            with the stretch that counts this turn). When Lines() closes: st := <-p.Exit(); under d.mu: first the exit goes into the process's
            own log l as its own entry, l.Append("exit", json.Marshal of {"code": st.Code, "stderr": tail}, Now()) where tail is the last 20
            lines of st.Stderr (one trailing "\n" trimmed first, then split on "\n", the last 20 kept, joined with "\n"; "" when stderr is
            empty) — a crash is never invisible: the code and the stderr are readable by GET events; then, if p is still the current process:
            when a pending done is held for p → the current process is cleared (nil) and d.finishDone(ctx, project, p) (the session ended itself
            after phase_done: the end batch runs, its kill finds no process, Exited is not called — not a crash); else the current process is
            cleared (nil) and d.execute(ctx, project, loop.Exited(st.Code, st.Stderr, Now(), Config.Loop)) (the loop decides whether that exit is
            a crash: it restarts within the per-hour cap or stops with kind "crash"); else nothing more (a process replaced by a newer spawn is
            pumped to its end and its exit is logged but changes nothing).
          steps:
            - uses: daemon
            - uses: session
            - uses: supervisor
            - uses: eventlog
            - uses: claude
            - uses: stream
            - produces: log entries
          preconditions:
            - "Daemon Core · a spawned project has a fake process reachable from the Spawn recorder · the tests emit on it"
          examples:
            - given: 'the harness: tmp := t.TempDir(); reg := registry.Open(tmp/state) with registry.Project{Name: "demo", Language: "go", RepoURL: "https://github.com/acme/demo", Dir: tmp/projects/demo, Caps: {30, 3, 5}, CreatedAt: 2026-10-08T14:00:00Z} and tmp/projects/demo/docs/MEASURE.md written with the bytes of tests/fixtures/git/measure.md; Deps{Registry: reg, Runner: &runner.Fake{Script: {"git rev-parse --abbrev-ref HEAD": {Stdout: "main\n"}, "git rev-parse HEAD": {Stdout: "aaa111\n"}, "git rev-parse origin/main": {Stdout: "aaa111\n"}, "git status --porcelain": {Stdout: ""}}}, Spawn: a fake recording each claude.Launch and returning a new claude.NewFake() kept in order, Post: a recorder of [4]string{project, kind, headline, numbers}, GitHubDo: a func returning an error, Now: a clock from 2026-10-08T15:00:00Z advancing 1 s per call, NewID: "id-1", "id-2", … (Spawn, Post, Now and NewID guarded by one mutex: the pump calls them from its goroutine), Config: Config{ClaudeBin: "/opt/claude/bin/claude", MorphBin: "/usr/local/bin/morph", ProjectsDir: tmp/projects, MCPBaseURL: "http://127.0.0.1:7181", Defaults: {25, 2, 4}, MaxParallel: 1, Loop: {MaxResumesPerHour: 3, StallMinutes: 30, StretchUSD: 30, UsageAlertPercent: 50}}}; d := Open(ctx, deps); d.PlanLoad("demo", the queue.Plan of tests/fixtures/plan/queue-3.json) → P17 running, session id-1, token id-2, one post ("demo", "start", "P17 started", "session id-1 · cap $30 · 3 h"), fp := the first fake process; then fp.Emit of the msg bytes of lines 4, 5, 6, 7 of tests/fixtures/stream/probe.jsonl (testhelp.ProbeLine); poll d.Status("demo") until CostUSD > 0 (10 ms steps, at most 2 s)'
              when: Emit
              then: 'd.Status("demo") has State "ready" (the loop runs, the machine finished its turn), Phase "P17", CostUSD 0.0021784900000000004, FiveHour 22, SevenDay 60, SessionID "967e8f4d-a2eb-4aa6-968b-b9054a1c3d7e" (the init line''s); d.Events("demo", 0, 10) has 5 entries: Seq 1 Dir "in" with Msg the json.Compact of stream.User("/morph-orchestrator P17"), Seq 2..5 Dir "out" with Msg the json.Compact of the four emitted lines; the posts after the start exactly [{"demo", "info", "P17: weekly usage 60%", "resets 2026-10-13T01:00:00Z"}, {"demo", "idle", "P17 turn ended: PONG", "success · turns 1 · $0.0022"}]; d.Usage("demo") → control.Usage{FiveHour: 22, SevenDay: 60, FiveHourResetsAt: 1791469200, SevenDayResetsAt: 1791853200, SessionCostUSD: 0.0021784900000000004, StretchCostUSD: 0.0021784900000000004, LimitsAt: not zero}, nil'
