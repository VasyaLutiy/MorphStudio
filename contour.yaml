    - name: api
      description: >
        Package api in api/: the HTTP API of morphd over control.Control — JSON in and out, the bearer token, the
        routes under /projects/{project}/…; never a listener, never the clock. Imports morphstudio/control,
        morphstudio/queue, crypto/subtle, encoding/json, errors, io, mime, net/http, strconv, strings.
      language: go
      functions:
        - name: HTTP Handlers
          description: The handlers of every route, with the JSON reading rules and the error body.
          behavior: >
            Declares in api/handlers.go: `type Handlers struct { Control control.Control }` and methods with the signature
            `func (h Handlers) X(w http.ResponseWriter, r *http.Request)`: Projects, CreateProject, AdoptProject, Status, Events, Messages,
            Pending, Answer, Interrupt, Usage, Restart, Plan, Continue, StopCheck, GithubToken; plus
            `func WriteJSON(w http.ResponseWriter, status int, v any)` (Content-Type application/json, then the status, then
            json.NewEncoder(w).Encode(v) — every body ends with "\n") and `func WriteError(w http.ResponseWriter, err error)`
            (status, code := control.Code(err); body {"error":{"code":<code>,"message":<err.Error()>}}; a 500 writes message
            "internal" instead of the error text). The project is r.PathValue("project"). Reading a body (CreateProject, AdoptProject,
            Messages, Answer, Restart, Plan, GithubToken): Content-Type parsed with mime.ParseMediaType must be application/json
            else 415 {"error":{"code":"unsupported_media_type","message":"Content-Type must be application/json"}}; the body through
            http.MaxBytesReader(w, r.Body, 1<<20), a json.Decoder with DisallowUnknownFields into the request struct and a second
            Decode returning io.EOF, else 400 {"error":{"code":"bad_json","message":"bad json"}}.
            Projects: GET → 200 {"projects":[…]} (empty as []). CreateProject: {"name","language","repo_url"} → Control.CreateProject
            → 201 the view. AdoptProject: {"name","dir","repo_url","language"} → control.Adopt(r.Context(), h.Control, name, dir, repo_url,
            language) → 201 the view (a Control without an Adopter → WriteError of control.ErrUnsupported: 500 "internal").
            Status → 200 the Status. Events: query since (int64, default 0) and max (int, default 0); a non-integer
            → 400 bad_input with message "since must be an integer" / "max must be an integer"; → 200 the Events. Messages: {"text"}
            → Control.Order → 200 the OrderResult. Pending → 200 {"question":<Question or null>}. Answer: {"option"} → 200 {"ok":true}.
            Interrupt → 200 {"ok":true}. Usage → 200 the Usage. Restart: {"force"} (an empty body allowed: force false — the
            body is read only when Content-Length is not 0) → 200 {"ok":true}. Plan: a queue.Plan → 200 the QueueView. Continue
            → 200 {"ok":true}. StopCheck → 200 {"stop":<Stop or null>}. GithubToken: {"token"} → 200 the TokenResult (the token never
            echoed). Every Control error → WriteError.
          steps:
            - uses: control
            - produces: http.Handler
          examples:
            - given: 'h := Handlers{Control: a fake Control (a struct of the test file) whose Status returns control.Status{State: "busy", Phase: "P18", Minutes: 37, CostUSD: 1.92, FiveHour: 22, SevenDay: 60, SessionID: "s-1", Queue: control.QueueView{State: "running", Approved: "7b31dfe", Index: 1, Phases: 3, Current: "P18"}, Repo: github.Access{Checked: true, Reachable: true, Push: true, CheckedAt: 2026-10-08T15:00:00Z}} for "demo" and control.ErrUnknownProject otherwise}; GET /projects/demo/status with path value project "demo" on httptest.NewRecorder'
              when: h.Status
              then: 'status 200, Content-Type exactly application/json, body exactly {"state":"busy","phase":"P18","minutes":37,"cost_usd":1.92,"five_hour":22,"seven_day":60,"session_id":"s-1","queue":{"state":"running","approved":"7b31dfe","index":1,"phases":3,"current":"P18","reason":""},"repo":{"checked":true,"reachable":true,"push":true,"reason":"","checked_at":"2026-10-08T15:00:00Z"}} + "\n"; with project "nope": status 404, body exactly {"error":{"code":"unknown_project","message":"unknown project"}} + "\n"'
            - given: 'the fake Control recording Order calls and returning {Queued: 1}; POST /projects/demo/messages, Content-Type "application/json; charset=utf-8", body {"text":"smoke checked green. Resume with P12b"}'
              when: h.Messages
              then: 'status 200, body exactly {"queued":1} + "\n"; the fake saw Order("demo", "smoke checked green. Resume with P12b"); with the fake returning {Sent: true} the body is exactly {"sent":true} + "\n"'
            - given: 'POST /projects/demo/messages with in turn Content-Type "text/plain", no Content-Type, "application/xml", each with body {"text":"x"}'
              when: h.Messages
              then: 'each status 415, body exactly {"error":{"code":"unsupported_media_type","message":"Content-Type must be application/json"}} + "\n"; the fake saw no Order'
            - given: 'POST /projects/demo/answer, Content-Type application/json, bodies in turn {"option": (cut), {"option":1,"x":2}, {"option":1} {}, the empty body, then {"option":2}'
              when: h.Answer
              then: 'four times status 400 with body exactly {"error":{"code":"bad_json","message":"bad json"}} + "\n"; then 200 {"ok":true} + "\n" and the fake saw Answer("demo", 2); with the fake returning control.ErrBadOption wrapped as "option out of range: 3 of 1..2": status 400, body {"error":{"code":"bad_option","message":"option out of range: 3 of 1..2"}} + "\n"'
            - given: 'GET /projects/demo/events?since=2&max=5; then ?since=x; then no query, with the fake returning Events{Entries: [], Last: 7} and recording the arguments'
              when: h.Events
              then: '200 and the fake saw (demo, 2, 5), body exactly {"entries":[],"last":7} + "\n"; 400 {"error":{"code":"bad_input","message":"since must be an integer"}} + "\n"; the fake saw (demo, 0, 0)'
            - given: 'GET /projects/demo/pending with the fake returning (nil, nil); then returning &control.Question{RequestID: "9f4ffa22-2676-4391-bfd9-bd7d16c3866c", Text: "Which option do you want: A or B?", Header: "A or B", Options: []string{"Option A", "Option B"}, AskedAt: 2026-10-08T13:09:08Z}'
              when: h.Pending
              then: '200 {"question":null} + "\n"; then 200 {"question":{"request_id":"9f4ffa22-2676-4391-bfd9-bd7d16c3866c","text":"Which option do you want: A or B?","header":"A or B","options":["Option A","Option B"],"asked_at":"2026-10-08T13:09:08Z"}} + "\n"'
            - given: 'POST /projects/demo/plan, application/json, body = the text of tests/fixtures/plan/queue-3.json; the fake records the plan and returns QueueView{State: "running", Approved: "7b31dfe", Index: 0, Phases: 3, Current: "P17"}'
              when: h.Plan
              then: '200, body exactly {"state":"running","approved":"7b31dfe","index":0,"phases":3,"current":"P17","reason":""} + "\n"; the recorded plan has 3 phases, Phases[1].StopAfter "smoke", Phases[1].Caps.ClaudeUSD 12'
              ref: tests/fixtures/plan/queue-3.json
            - given: 'PUT /projects/demo/github-token, application/json, body {"token":"ghp_abc"}; the fake returns control.TokenResult{Access: github.Access{Checked: true, Reachable: false, Push: false, Reason: "401 bad credentials", CheckedAt: 2026-10-08T15:00:00Z}}; then POST /projects/demo/restart with no body and Content-Length 0; then with body {"force":true}; then GET /projects with the fake returning no projects; then a fake whose Status returns errors.New("disk full")'
              when: 'h.GithubToken; h.Restart; h.Projects; h.Status'
              then: '200 {"access":{"checked":true,"reachable":false,"push":false,"reason":"401 bad credentials","checked_at":"2026-10-08T15:00:00Z"},"pushed":false} + "\n" and "ghp_abc" appears nowhere in the body, the fake saw PutGithubToken("demo", "ghp_abc"); 200 {"ok":true} with the fake seeing Restart("demo", false); then Restart("demo", true); 200 {"projects":[]} + "\n"; 500 {"error":{"code":"internal","message":"internal"}} + "\n"'
            - given: 'a := Handlers{Control: a fake of the test file implementing the 17 methods of control.Control and AdoptProject (recording its four string arguments; returning control.ProjectView{Name: "studio", Language: "go", RepoURL: "https://github.com/VasyaLutiy/MorphStudio", State: "idle", CreatedAt: 2026-10-10T18:00:00Z})}; POST /projects/adopt, Content-Type application/json, body {"name":"studio","dir":"/home/morph/MorphStudio","repo_url":"https://github.com/VasyaLutiy/MorphStudio","language":"go"}; then the same with the fake returning fmt.Errorf("%w: bootstrap: refused: not a git repository: /home/morph/nowhere", control.ErrBadInput); then returning control.ErrExists; then the body {"name":"studio","dir":"/x"} (fields missing are ""; the fake returning ErrBadInput wrapped as "bad input: bootstrap: refused: github: not a github repository url: "); then a body {"name":"studio","extra":1}; then h of example 1 (a Control without AdoptProject) with the first body'
              when: a.AdoptProject; h.AdoptProject
              then: 'status 201, body exactly {"name":"studio","language":"go","repo_url":"https://github.com/VasyaLutiy/MorphStudio","state":"idle","created_at":"2026-10-10T18:00:00Z"} + "\n" and the fake saw AdoptProject("studio", "/home/morph/MorphStudio", "https://github.com/VasyaLutiy/MorphStudio", "go"); then 400 {"error":{"code":"bad_input","message":"bad input: bootstrap: refused: not a git repository: /home/morph/nowhere"}} + "\n"; then 409 {"error":{"code":"exists","message":"project exists"}} + "\n"; then 400 with code "bad_input" and the fake saw AdoptProject("studio", "/x", "", ""); then 400 {"error":{"code":"bad_json","message":"bad json"}} + "\n" (an unknown field) and no further call; then 500 {"error":{"code":"internal","message":"internal"}} + "\n" and h''s fake saw nothing'
        - name: Router
          description: The routes on http.ServeMux, the bearer token in front of everything but /healthz, and the MCP mount.
          behavior: >
            Declares in api/router.go: `func Bearer(token string, next http.Handler) http.Handler` and
            `func NewRouter(h Handlers, token string, mcp http.Handler) http.Handler`.
            Bearer: the Authorization header must be "Bearer " + token (the scheme case-insensitive, the token compared with
            crypto/subtle.ConstantTimeCompare) else status 401, Content-Type application/json, body exactly
            {"error":{"code":"unauthorized","message":"bearer token required"}} + "\n"; an empty configured token refuses every
            request the same way. NewRouter: a new http.ServeMux with "GET /healthz" → 200 {"status":"ok"} + "\n" (no token);
            "GET /projects" → Projects; "POST /projects" → CreateProject; "POST /projects/adopt" → AdoptProject (a literal segment:
            the mux prefers it to any "/projects/{project}/…" pattern); "GET /projects/{project}/status"; "GET /projects/{project}/events";
            "POST /projects/{project}/messages"; "GET /projects/{project}/pending"; "POST /projects/{project}/answer";
            "POST /projects/{project}/interrupt"; "GET /projects/{project}/usage"; "POST /projects/{project}/restart";
            "POST /projects/{project}/plan"; "POST /projects/{project}/continue"; "GET /projects/{project}/stop";
            "PUT /projects/{project}/github-token" — each wrapped in Bearer(token, …); and when mcp is not nil "/mcp" and
            "/mcp/" → mcp unwrapped (the MCP handler checks its own tokens). A wrong method on a known path is the mux''s 405,
            an unknown path its 404 (statuses only).
          steps:
            - calls: HTTP Handlers
            - produces: http.Handler
          examples:
            - given: 'r := NewRouter(Handlers{Control: a fake Control (a struct of the test file recording each call as its method name and project) whose Status returns control.Status{State: "busy", Phase: "P18", Minutes: 37, SessionID: "s-1"} for "demo" and control.ErrUnknownProject otherwise}, "tok-1", nil); GET /healthz with no header'
              when: served on httptest.NewRecorder
              then: 'status 200, Content-Type application/json, body exactly {"status":"ok"} + "\n"'
            - given: 'r of example 1; GET /projects/demo/status with no Authorization; with "Bearer wrong"; with "Basic dG9rLTE="; with "Bearer tok-1 " (trailing space)'
              when: served
              then: 'each status 401, body exactly {"error":{"code":"unauthorized","message":"bearer token required"}} + "\n"'
            - given: 'r of example 1; GET /projects/demo/status with Authorization "Bearer tok-1"; then "bearer tok-1"'
              when: served
              then: 'each status 200 with body exactly {"state":"busy","phase":"P18","minutes":37,"cost_usd":0,"five_hour":0,"seven_day":0,"session_id":"s-1","queue":{"state":"","approved":"","index":0,"phases":0,"current":"","reason":""},"repo":{"checked":false,"reachable":false,"push":false,"reason":"","checked_at":"0001-01-01T00:00:00Z"}} + "\n" (the router fills the project path value); GET /projects/nope/status with "Bearer tok-1" → 404'
            - given: 'r := NewRouter(h, "", nil); GET /projects with Authorization "Bearer "'
              when: served
              then: 'status 401 (an empty configured token never matches)'
            - given: 'r of example 1 with Authorization "Bearer tok-1" on every request; POST /projects/demo/messages {"text":"hi"} (application/json); GET /projects/demo/pending; POST /projects/demo/interrupt; GET /projects/demo/usage; POST /projects/demo/continue; GET /projects/demo/stop; PUT /projects/demo/github-token {"token":"t"}'
              when: served
              then: 'statuses 200, 200, 200, 200, 200, 200, 200 and the fake Control saw Order, Pending, Interrupt, Usage, Continue, StopCheck, PutGithubToken for "demo" in that order'
            - given: 'r of example 1, Authorization "Bearer tok-1"'
              when: 'DELETE /projects/demo/status; POST /projects/demo/status; GET /projects/demo/messages; GET /nowhere; POST /healthz'
              then: 'statuses 405, 405, 405, 404, 405'
            - given: 'r := NewRouter(h, "tok-1", an http.Handler answering 299 with body "mcp " + r.URL.Path); GET /mcp; POST /mcp/demo; POST /mcp/demo/session, each with no Authorization'
              when: served
              then: 'each status 299 with bodies "mcp /mcp", "mcp /mcp/demo", "mcp /mcp/demo/session" — the MCP mount is not behind Bearer; with mcp nil the same requests give 404'
            - given: 'r := NewRouter(Handlers{Control: a fake of the test file implementing the 17 methods of control.Control and AdoptProject (recording the call with its arguments, returning control.ProjectView{Name: "studio", Language: "go", RepoURL: "https://github.com/VasyaLutiy/MorphStudio", State: "idle", CreatedAt: 2026-10-10T18:00:00Z})}, "tok-1", nil); POST /projects/adopt (application/json, body {"name":"studio","dir":"/home/morph/MorphStudio","repo_url":"https://github.com/VasyaLutiy/MorphStudio","language":"go"}) with Authorization "Bearer tok-1"; then the same without Authorization; then GET /projects/adopt with "Bearer tok-1"'
              when: served
              then: 'status 201 with body exactly {"name":"studio","language":"go","repo_url":"https://github.com/VasyaLutiy/MorphStudio","state":"idle","created_at":"2026-10-10T18:00:00Z"} + "\n" and the fake saw AdoptProject("studio", "/home/morph/MorphStudio", "https://github.com/VasyaLutiy/MorphStudio", "go") (not CreateProject); then 401 with the unauthorized body; then 405'
    - name: mcpserver
      description: >
        Package mcpserver in mcpserver/: the remote MCP server of morphd on the official Go SDK — the user-level
        server (registry tools), the per-project PM server and the per-session server for the VPS session, each bound
        to its project by the URL and guarded by its token. Tests drive the servers over the SDK's in-memory
        transports and the HTTP mount with httptest.NewRecorder. Imports the SDK's mcp package
        (github.com/modelcontextprotocol/go-sdk/mcp), morphstudio/control, morphstudio/queue, context, crypto/subtle,
        encoding/json, errors, fmt, net/http, slices, strings.
      language: go
      uses:
        - github.com/modelcontextprotocol/go-sdk
      functions:
        - name: PM Tools
          description: The user-level and per-project MCP servers whose tools call the Control.
          behavior: >
            Declares in mcpserver/pm.go: `const ServerName = "morphd"`, `const ServerVersion = "0.1.0"`,
            `func UserServer(c control.Control) *mcp.Server` and `func PMServer(c control.Control, project string) *mcp.Server`,
            both mcp.NewServer(&mcp.Implementation{Name: ServerName, Version: ServerVersion}, nil) with tools added by mcp.AddTool
            with typed inputs (struct fields with json and jsonschema tags; a tool without input takes an empty struct) and
            the output type `any`. Every tool returns the json.Marshal of its view as one mcp.TextContent (and nothing
            structured: StructuredContent stays nil, so the text keeps the view's field order); a Control error → a result
            with IsError true and one TextContent "<code>: <err.Error()>" where code is the second value of control.Code
            (never a protocol error, so the model sees it). UserServer tools: projects_list (no input) → {"projects":[…]}
            (a nil list as []); project_create {name, language, repo_url} → Control.CreateProject(ctx, …) → the
            ProjectView; project_adopt {name, dir, repo_url, language} → control.Adopt(ctx, c, name, dir, repo_url, language)
            → the ProjectView (a Control without an Adopter → IsError true "internal: adopt not supported").
            PMServer tools, none with a project argument (the project is PMServer's): status → Status; order
            {text} → OrderResult; pending → {"question": Question or null}; answer {option int} → {"ok":true}; interrupt →
            {"ok":true}; usage → Usage; restart {force bool} → {"ok":true}; plan_load {approved string, phases []{id,
            stop_after, caps{claude_usd, hours, executor_usd}}} → Control.PlanLoad(project, the queue.Plan of exactly the
            values given, no default filled) → QueueView; continue → {"ok":true}; stop_check → {"stop": Stop or null};
            events {since int64, limit int} → ev, err := Control.Events(project, since, limit) with limit 0 replaced by 50
            before the call → control.Views(ev, 200) → the EventsView ({"events":[…],"last":N}: the compact view, never the
            raw entries).
            Required input fields (json tag without omitempty): name, language, repo_url, dir, text, option, approved, phases and
            a phase's id; optional (omitempty): force (absent = false), since and limit (absent = 0), a phase's stop_after and
            caps, and each of claude_usd, hours, executor_usd (absent = 0). Tool names are exactly these, tool descriptions one
            sentence each. `func ToolNames(s *mcp.Server) []string` is not needed: tests list tools through a client session.
          steps:
            - uses: control
            - produces: mcp.Server
          examples:
            - given: 'c := a fake Control (a struct of the test file implementing the 17 methods of control.Control with their exact signatures, every type of package control written qualified, e.g. m control.Milestone, with configurable results and a recorded call list); s := PMServer(c, "demo"); ct, st := mcp.NewInMemoryTransports(); s.Connect(ctx, st, nil); cs := mcp.NewClient(&mcp.Implementation{Name: "t", Version: "0"}, nil).Connect(ctx, ct, nil)'
              when: 'cs.ListTools(ctx, nil)'
              then: 'the tool names, sorted, exactly ["answer", "continue", "events", "interrupt", "order", "pending", "plan_load", "restart", "status", "stop_check", "usage"]'
            - given: 'the session of example 1, the fake''s Status returning control.Status{State: "busy", Phase: "P18", Minutes: 37, CostUSD: 1.92, FiveHour: 22, SevenDay: 60, SessionID: "s-1", Queue: control.QueueView{State: "running", Approved: "7b31dfe", Index: 1, Phases: 3, Current: "P18"}, Repo: github.Access{Checked: true, Reachable: true, Push: true, CheckedAt: 2026-10-08T15:00:00Z}}; cs.CallTool(ctx, &mcp.CallToolParams{Name: "status"})'
              when: CallTool
              then: 'IsError false; StructuredContent nil; Content has one *mcp.TextContent whose Text is exactly {"state":"busy","phase":"P18","minutes":37,"cost_usd":1.92,"five_hour":22,"seven_day":60,"session_id":"s-1","queue":{"state":"running","approved":"7b31dfe","index":1,"phases":3,"current":"P18","reason":""},"repo":{"checked":true,"reachable":true,"push":true,"reason":"","checked_at":"2026-10-08T15:00:00Z"}}; the fake saw Status("demo")'
            - given: 'the session of example 1; CallTool "order" with Arguments {"text": "smoke checked green. Resume with P12b"} (the fake answers session.OrderResult{Queued: 1}); then "answer" with {"option": 1}; then "plan_load" with Arguments = the object of tests/fixtures/plan/queue-3.json decoded into map[string]any (the fake''s PlanLoad returning control.QueueView{State: "queued", Approved: "7b31dfe", Index: 0, Phases: 3, Current: "P17"})'
              when: CallTool
              then: 'Text exactly {"queued":1}; the fake saw Order("demo", "smoke checked green. Resume with P12b"); then Text exactly {"ok":true} and Answer("demo", 1); then Text exactly {"state":"queued","approved":"7b31dfe","index":0,"phases":3,"current":"P17","reason":""} and the fake''s recorded plan equals queue.Plan{Approved: "7b31dfe", Phases: []queue.Phase{{ID: "P17", StopAfter: "none"}, {ID: "P18", StopAfter: "smoke", Caps: queue.Caps{ClaudeUSD: 12}}, {ID: "P19", StopAfter: "none"}}} (P17 has no caps in the file: the optional fields pass the schema)'
              ref: tests/fixtures/plan/queue-3.json
            - given: 's := PMServer(c, "beta") connected as in example 1, the fake returning control.ErrNoQuestion from Answer; CallTool "answer" {"option": 1}; then "status" on the fake returning errors.New("disk full")'
              when: CallTool
              then: 'IsError true, one TextContent "no_question: no pending question" and the fake saw Answer("beta", 1); then IsError true, "internal: disk full" and Status("beta")'
            - given: 'the session of example 1; CallTool "pending" with the fake returning nil; "stop_check" with nil; "interrupt"; "continue"; "restart" {"force": true}; "usage" with the fake returning control.Usage{FiveHour: 22, SevenDay: 60, FiveHourResetsAt: 1791469200, SevenDayResetsAt: 1791853200, SessionCostUSD: 0.0064, StretchCostUSD: 5.2609, LimitsAt: 2026-10-08T13:09:03Z}'
              when: CallTool
              then: 'Texts exactly {"question":null}; {"stop":null}; {"ok":true}; {"ok":true}; {"ok":true}; {"five_hour":22,"seven_day":60,"five_hour_resets_at":1791469200,"seven_day_resets_at":1791853200,"session_cost_usd":0.0064,"stretch_cost_usd":5.2609,"limits_at":"2026-10-08T13:09:03Z"}; the fake saw, in order, Pending("demo"), StopCheck("demo"), Interrupt("demo"), Continue("demo"), Restart("demo", true), Usage("demo")'
            - given: 'u := UserServer(c) connected the same way, the fake''s Projects returning []control.ProjectView{{Name: "alpha", Language: "ts", RepoURL: "https://github.com/o/alpha", State: "idle", CreatedAt: 2026-10-07T09:00:00Z}} and its CreateProject returning ProjectView{Name: "demo", Language: "go", RepoURL: "https://github.com/o/demo", State: "idle", CreatedAt: 2026-10-08T15:00:00Z}; ListTools; CallTool "projects_list"; CallTool "project_create" {"name": "demo", "language": "go", "repo_url": "https://github.com/o/demo"}'
              when: 'ListTools; CallTool'
              then: 'names exactly ["project_adopt", "project_create", "projects_list"]; Text exactly {"projects":[{"name":"alpha","language":"ts","repo_url":"https://github.com/o/alpha","state":"idle","created_at":"2026-10-07T09:00:00Z"}]}; Text exactly {"name":"demo","language":"go","repo_url":"https://github.com/o/demo","state":"idle","created_at":"2026-10-08T15:00:00Z"} and the whole recorded call list is, in order, Projects() then CreateProject("demo", "go", "https://github.com/o/demo") (projects_list was called first)'
            - given: 'the session of example 1; CallTool "answer" with Arguments {"option": "one"} (a string); then "answer" with {"option": 2}'
              when: CallTool
              then: 'an error from CallTool or a result with IsError true — the SDK validates the input against the schema — and the fake saw no Answer; then IsError false, Text exactly {"ok":true} and the fake saw only Answer("demo", 2)'
            - given: 'the session of example 1; ent(n) := eventlog.Entry{Seq: n, Dir: the dir of line n of tests/fixtures/stream/probe.jsonl, Msg: its msg bytes} (testhelp.ProbeLine); the fake''s Events returning control.Events{Entries: []eventlog.Entry{ent(3), ent(5), ent(7)}, Last: 7} and recording its arguments; CallTool "events" with Arguments {} ; then "events" with {"since": 7, "limit": 10} on the fake returning control.Events{Entries: []eventlog.Entry{}, Last: 7}; then "events" with {"since": 2} on the fake returning errors.New("disk full")'
              when: CallTool
              then: 'IsError false, StructuredContent nil, Text exactly {"events":[{"seq":3,"dir":"in","type":"user","text":"Reply with exactly one word: PONG"},{"seq":5,"dir":"out","type":"assistant","text":"PONG"},{"seq":7,"dir":"out","type":"result","subtype":"success","text":"PONG","cost_usd":0.0021784900000000004,"terminal_reason":"completed"}],"last":7} and the fake saw Events("demo", 0, 50) (limit absent → 50); then Text exactly {"events":[],"last":7} and Events("demo", 7, 10); then IsError true "internal: disk full" and Events("demo", 2, 50)'
              ref: tests/fixtures/stream/probe.jsonl
            - given: 'u := UserServer(c) connected as in example 6, the fake also implementing AdoptProject (recording its four string arguments; returning control.ProjectView{Name: "studio", Language: "go", RepoURL: "https://github.com/VasyaLutiy/MorphStudio", State: "idle", CreatedAt: 2026-10-10T18:00:00Z}); CallTool "project_adopt" {"name": "studio", "dir": "/home/morph/MorphStudio", "repo_url": "https://github.com/VasyaLutiy/MorphStudio", "language": "go"}; then the same on the fake returning fmt.Errorf("%w: bootstrap: refused: not a git repository: /home/morph/nowhere", control.ErrBadInput); then returning control.ErrExists; then "project_adopt" with {"name": "studio"} (dir, repo_url, language missing); then on u2 := UserServer(p) with p a second fake type of the test file implementing only the 17 methods of control.Control, the first Arguments'
              when: CallTool
              then: 'Text exactly {"name":"studio","language":"go","repo_url":"https://github.com/VasyaLutiy/MorphStudio","state":"idle","created_at":"2026-10-10T18:00:00Z"} and the fake saw AdoptProject("studio", "/home/morph/MorphStudio", "https://github.com/VasyaLutiy/MorphStudio", "go") (no CreateProject); then IsError true "bad_input: bad input: bootstrap: refused: not a git repository: /home/morph/nowhere"; then IsError true "exists: project exists"; then an error from CallTool or a result with IsError true (the schema requires the four fields) and the fake saw no further AdoptProject; then IsError true "internal: adopt not supported" and p saw nothing'
        - name: Session Tools
          description: The per-session MCP server the VPS session reports through — phase_done, wait_operator, milestone.
          behavior: >
            Declares in mcpserver/session.go: `func SessionServer(c control.Control, project, token string) *mcp.Server`, built as
            the servers of mcpserver/pm.go (the same name, version, output type `any` and text results), with three tools
            that pass project and token to the Control: phase_done {phase, next} → Control.PhaseDone → {"ok":true};
            wait_operator {kind, reason, issue_url} → Control.WaitOperator → {"ok":true}; milestone {kind, headline,
            numbers} → Control.Milestone → {"ok":true}. Required input fields: phase, kind, reason, headline; optional
            (omitempty, absent = ""): next (the last phase has none), issue_url, numbers. Errors as in PM Tools (IsError
            true, "<code>: <err.Error()>" with the code of control.Code); kind of wait_operator must be one of "smoke",
            "gate", "emergency", "no-next" else the result IsError true with text "bad_input: kind must be one of smoke,
            gate, emergency, no-next" and the Control not called; kind of milestone must be a key of telegram.Icons — the
            server does not import telegram: the list is
            `var MilestoneKinds = []string{"start", "gate", "run", "fail", "merge", "smoke", "stop", "debt", "end", "info", "watchdog", "idle", "ask"}`
            and a kind outside it → IsError true "bad_input: unknown milestone kind \"<kind>\"" (the kind quoted as by
            %q) and the Control not called.
          steps:
            - calls: PM Tools
            - uses: control
            - produces: mcp.Server
          examples:
            - given: 'c := a fake Control (a struct of the test file implementing the 17 methods of control.Control, recording each call with its arguments and returning configurable errors); s := SessionServer(c, "demo", "id-2"); ct, st := mcp.NewInMemoryTransports(); s.Connect(ctx, st, nil); cs := mcp.NewClient(&mcp.Implementation{Name: "t", Version: "0"}, nil).Connect(ctx, ct, nil)'
              when: 'cs.ListTools(ctx, nil)'
              then: 'names sorted exactly ["milestone", "phase_done", "wait_operator"]'
            - given: 'the session of example 1; CallTool "phase_done" {"phase": "P17", "next": "P18"}; then {"phase": "P19"} (next omitted: the last phase)'
              when: CallTool
              then: 'Text {"ok":true}, IsError false; the fake saw PhaseDone("demo", "id-2", "P17", "P18"); then Text {"ok":true} and PhaseDone("demo", "id-2", "P19", "")'
            - given: 's := SessionServer(c, "beta", "id-9") connected as in example 1, the fake returning control.ErrBadToken; CallTool "phase_done" {"phase": "P17", "next": "P18"}; then the fake returning fmt.Errorf("%w: phase_done \"P16\" while running \"P17\"", supervisor.ErrPhaseMismatch) — any non-sentinel error'
              when: CallTool
              then: 'IsError true "bad_session_token: session token mismatch" and the fake saw PhaseDone("beta", "id-9", "P17", "P18"); then IsError true "internal: phase mismatch: phase_done \"P16\" while running \"P17\""'
            - given: 'the session of example 1; CallTool "wait_operator" {"kind": "smoke", "reason": "P17 smoke: curl status", "issue_url": ""}; then {"kind": "pause", "reason": "x"}'
              when: CallTool
              then: '{"ok":true} and WaitOperator("demo", "id-2", "smoke", "P17 smoke: curl status", ""); then IsError true "bad_input: kind must be one of smoke, gate, emergency, no-next" and the fake not called'
            - given: 'the session of example 1; CallTool "milestone" {"kind": "gate", "headline": "P17 gate passed", "numbers": "10 cards · $0.12"}; then {"kind": "party", "headline": "h", "numbers": ""}'
              when: CallTool
              then: '{"ok":true} and Milestone("demo", "id-2", control.Milestone{Kind: "gate", Headline: "P17 gate passed", Numbers: "10 cards · $0.12"}); then IsError true "bad_input: unknown milestone kind \"party\"" and the fake not called'
            - given: 'the session of example 1; CallTool "milestone" {"kind": "info", "headline": "h"} (numbers omitted)'
              when: CallTool
              then: '{"ok":true} and Milestone("demo", "id-2", control.Milestone{Kind: "info", Headline: "h", Numbers: ""})'
        - name: MCP Mount
          description: The HTTP mount of the three MCP endpoints with their tokens, over the SDK's streamable HTTP handler.
          behavior: >
            Declares in mcpserver/mount.go: `type Tokens struct { API string; Session func(project string) (string, bool) }` and
            `func Handler(c control.Control, known func(project string) bool, t Tokens) http.Handler`. One http.ServeMux:
            "POST /mcp" → UserServer; "POST /mcp/{project}" → PMServer(c, project); "POST /mcp/{project}/session" →
            SessionServer(c, project, the session token); each served by mcp.NewStreamableHTTPHandler(getServer,
            &mcp.StreamableHTTPOptions{Stateless: true, JSONResponse: true}) where getServer builds the server for the
            request''s project. Before the SDK sees a request: the bearer token (the header's first 7 bytes equal "Bearer "
            ignoring case, the rest compared whole with subtle.ConstantTimeCompare, no trim) must equal t.API for /mcp and
            /mcp/{project}, and the project''s session token (t.Session; false → 401) for /mcp/{project}/session; an empty
            expected token refuses (ConstantTimeCompare of two empty slices is 1); a mismatch → 401 with Content-Type
            application/json and body exactly {"error":{"code":"unauthorized","message":"bearer token required"}} + "\n";
            then, the token accepted, an unknown project (!known) → 404 with Content-Type application/json and body exactly
            {"error":{"code":"unknown_project","message":"unknown project"}} + "\n" (the token is checked before the
            project). Both bodies written by json.NewEncoder. GET and DELETE on these paths → the mux''s 405. A JSON-RPC
            request is a POST with Content-Type application/json and Accept "application/json, text/event-stream"; the
            stateless server answers application/json.
          steps:
            - calls: PM Tools
            - calls: Session Tools
            - produces: http.Handler
          preconditions:
            - "PM Tools · a stateless POST needs Accept application/json, text/event-stream · else the SDK answers 400"
          examples:
            - given: 'fake := a fake Control (a struct of the test file implementing the 17 methods of control.Control, recording calls) whose Status returns control.Status{State: "busy", Phase: "P18", Minutes: 37, CostUSD: 1.92, FiveHour: 22, SevenDay: 60, SessionID: "s-1", Queue: control.QueueView{State: "running", Approved: "7b31dfe", Index: 1, Phases: 3, Current: "P18"}, Repo: github.Access{Checked: true, Reachable: true, Push: true, CheckedAt: 2026-10-08T15:00:00Z}}; h := Handler(fake, known = func(p string) bool { return p == "demo" }, Tokens{API: "tok-1", Session: a func returning ("id-2", true) for "demo" and ("", false) otherwise}); POST /mcp/demo with Authorization "Bearer tok-1", Content-Type application/json, Accept "application/json, text/event-stream", body {"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}'
              when: served on httptest.NewRecorder
              then: 'status 200, Content-Type begins application/json; the body decodes to a JSON-RPC response with id 1 whose result.tools names, sorted, are ["answer", "continue", "events", "interrupt", "order", "pending", "plan_load", "restart", "status", "stop_check", "usage"]'
            - given: 'h of example 1; POST /mcp/demo with the same headers and body {"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"status","arguments":{}}}'
              when: served
              then: 'status 200; result.content[0].type "text" and its text exactly {"state":"busy","phase":"P18","minutes":37,"cost_usd":1.92,"five_hour":22,"seven_day":60,"session_id":"s-1","queue":{"state":"running","approved":"7b31dfe","index":1,"phases":3,"current":"P18","reason":""},"repo":{"checked":true,"reachable":true,"push":true,"reason":"","checked_at":"2026-10-08T15:00:00Z"}}; result.isError absent or false; the fake saw Status("demo")'
            - given: 'h of example 1; POST /mcp/demo/session with Authorization "Bearer id-2" and the tools/call body for "milestone" with arguments {"kind":"gate","headline":"P17 gate passed","numbers":"10 cards · $0.12"}'
              when: served
              then: 'status 200; result.content[0].text exactly {"ok":true}; the fake saw Milestone("demo", "id-2", control.Milestone{Kind: "gate", Headline: "P17 gate passed", Numbers: "10 cards · $0.12"})'
            - given: 'h of example 1; the tools/list body in turn: POST /mcp/demo with no Authorization; with "Bearer wrong"; POST /mcp/demo/session with "Bearer tok-1" (the API token, not the session''s); POST /mcp/other/session (no session token known) with "Bearer id-2"'
              when: served
              then: 'each status 401, Content-Type application/json, body exactly {"error":{"code":"unauthorized","message":"bearer token required"}} + "\n"; the fake saw nothing'
            - given: 'h of example 1; POST /mcp/nope with "Bearer tok-1" and the tools/list body; then POST /mcp/nope with no Authorization'
              when: served
              then: 'status 404, Content-Type application/json, body exactly {"error":{"code":"unknown_project","message":"unknown project"}} + "\n"; then status 401 with the unauthorized body (the token is checked first)'
            - given: 'h of example 1; POST /mcp with "Bearer tok-1" and the tools/list body'
              when: served
              then: 'status 200; result.tools names sorted ["project_adopt", "project_create", "projects_list"]'
            - given: 'h of example 1; GET /mcp/demo with "Bearer tok-1"; DELETE /mcp'
              when: served
              then: 'statuses 405, 405'
    - name: cmd
      description: >
        Package main in cmd/morphd/: the configuration from the environment and .env, and the wiring of the daemon,
        the router and the MCP mount into one listener on 127.0.0.1. Imports every package of the module, bufio,
        context, crypto/rand, encoding/hex, flag, fmt, log, net/http, os, path/filepath, strconv, strings, time.
      language: go
      functions:
        - name: Config And Main
          description: The configuration keys with their defaults, the .env parser, and main.
          behavior: >
            Declares in cmd/morphd/config.go: `type Config struct { Token string; Port int; StateDir string; ProjectsDir string; ClaudeBin string;
            MorphBin string; TGToken string; TGChatID string; Model string; ExtraArgs []string; Defaults queue.Caps; StretchUSD float64;
            MaxParallel int; ResumesPerHour int; StallMinutes int; UsageAlertPercent int; DoneWait int }`, `func ParseDotenv(text string) map[string]string`,
            `func Load(getenv func(string) string, dotenv map[string]string) (Config, error)` and `func UUIDv4(b [16]byte) string`.
            UUIDv4 (pure): the RFC 4122 version 4 form of 16 bytes — byte 6 becomes 0x40 | (b[6] & 0x0f) (the version nibble), byte 8 becomes
            0x80 | (b[8] & 0x3f) (the variant bits), every other byte as given — written as lower-case hex in the groups 8-4-4-4-12 joined by "-"
            (36 characters). The claude CLI refuses any other session id ("Invalid session ID. Must be a valid UUID."), so every id morphd mints
            has this form: cmd/morphd/main.go declares `func newID() string` = UUIDv4 of 16 bytes from crypto/rand.Read (a read error panics:
            the daemon cannot run without ids) and passes it as Deps.NewID — the session id, the session token and the interrupt request id
            ("int-" + id) all come from it.
            ParseDotenv: lines trimmed; empty lines and lines beginning "#" skipped; "export " prefix removed; the first "="
            splits key and value; the value trimmed and, when wrapped in matching single or double quotes, unquoted; a line
            without "=" skipped. Load reads each key as getenv(key), falling back to dotenv[key], then the default:
            MORPHD_TOKEN (required: "" → error "config: MORPHD_TOKEN is required"); MORPHD_PORT 7080; MORPHD_STATE_DIR
            getenv("HOME") + "/.local/state/morphd"; MORPHD_PROJECTS_DIR getenv("HOME") + "/projects"; MORPHD_CLAUDE_BIN "claude";
            MORPHD_MORPH_BIN "morph"; TG_BOT_TOKEN ""; TG_CHAT_ID ""; MORPHD_MODEL ""; MORPHD_CLAUDE_EXTRA_ARGS "" split on spaces
            (strings.Fields; no field → nil); MORPHD_CLAUDE_USD 30; MORPHD_HOURS 3; MORPHD_EXECUTOR_USD 5; MORPHD_STRETCH_USD 30; MORPHD_MAX_PARALLEL 1;
            MORPHD_RESUMES_PER_HOUR 3; MORPHD_STALL_MINUTES 30; MORPHD_USAGE_ALERT 50; MORPHD_DONE_WAIT 30 (seconds the daemon waits
            after a phase_done for the turn's result before it ends the session anyway; 0 → at once). A number that does not parse → error
            "config: <KEY>: not a number: <value>". cmd/morphd/main.go: main reads .env from the working directory when present
            (ParseDotenv), Load(os.Getenv, …), opens the registry at StateDir, builds daemon.Deps with runner.OS{}, a Spawn of
            claude.Start(ctx, l.Bin, claude.Args(l), l.Dir, claude.Env(l)),
            telegram.Client{TGToken, TGChatID, http.DefaultClient.Do}.Post, http.DefaultClient.Do, time.Now, NewID: newID (a
            version 4 UUID, above), MCPBaseURL "http://127.0.0.1:<port>", daemon.Config.DoneWait = time.Duration(DoneWait) * time.Second;
            `func Build(d control.Control, known func(string) bool, session func(string) (string, bool), token string) http.Handler`
            = api.NewRouter(api.Handlers{Control: d}, token, mcpserver.Handler(d, known, mcpserver.Tokens{API: token, Session: session}));
            a ticker calls daemon.Tick every 30 s; http.ListenAndServe("127.0.0.1:" + port, handler); a Load error prints it to
            stderr and exits 2. Nothing but the listener address and the port is printed at start ("morphd listening on
            127.0.0.1:7080"); the token is never printed.
          steps:
            - uses: daemon
            - uses: api
            - uses: mcpserver
            - uses: queue
            - produces: Config
          examples:
            - given: 'the text "# comment\n\nMORPHD_TOKEN=abc\nexport TG_BOT_TOKEN=\"123:ABC\"\nTG_CHAT_ID=''-100''\nBAD LINE\nMORPHD_PORT = 7181\n"'
              when: ParseDotenv
              then: 'exactly map[string]string{"MORPHD_TOKEN": "abc", "TG_BOT_TOKEN": "123:ABC", "TG_CHAT_ID": "-100", "MORPHD_PORT": "7181"}'
            - given: 'getenv := a func over map{"HOME": "/home/morph"} (everything else ""); dotenv := map{"MORPHD_TOKEN": "abc"}'
              when: Load
              then: 'Config{Token: "abc", Port: 7080, StateDir: "/home/morph/.local/state/morphd", ProjectsDir: "/home/morph/projects", ClaudeBin: "claude", MorphBin: "morph", TGToken: "", TGChatID: "", Model: "", ExtraArgs: nil, Defaults: {30, 3, 5}, StretchUSD: 30, MaxParallel: 1, ResumesPerHour: 3, StallMinutes: 30, UsageAlertPercent: 50, DoneWait: 30}, nil'
            - given: 'getenv over map{"HOME": "/h", "MORPHD_TOKEN": "env-tok", "MORPHD_PORT": "7181", "MORPHD_CLAUDE_EXTRA_ARGS": "--effort high", "MORPHD_CLAUDE_USD": "12.5", "MORPHD_MAX_PARALLEL": "2", "MORPHD_DONE_WAIT": "45"}; dotenv map{"MORPHD_TOKEN": "file-tok", "MORPHD_HOURS": "1", "MORPHD_DONE_WAIT": "0"}'
              when: Load
              then: 'Token "env-tok" (the environment wins), Port 7181, ExtraArgs ["--effort", "high"], Defaults {12.5, 1, 5}, MaxParallel 2, DoneWait 45; with MORPHD_DONE_WAIT absent from getenv the dotenv''s "0" gives DoneWait 0 (an explicit 0 is kept, not the default)'
            - given: 'getenv with no MORPHD_TOKEN and an empty dotenv; then MORPHD_TOKEN "x" and MORPHD_PORT "80a"; then MORPHD_STALL_MINUTES "soon"; then MORPHD_DONE_WAIT "1m"'
              when: Load
              then: 'errors "config: MORPHD_TOKEN is required"; "config: MORPHD_PORT: not a number: 80a"; "config: MORPHD_STALL_MINUTES: not a number: soon"; "config: MORPHD_DONE_WAIT: not a number: 1m"'
            - given: 'f := a fake Control (a struct of the test file implementing the 17 methods of control.Control) whose Status returns control.Status{State: "busy", Phase: "P18", Minutes: 37, CostUSD: 1.92, FiveHour: 22, SevenDay: 60, SessionID: "s-1", Queue: control.QueueView{State: "running", Approved: "7b31dfe", Index: 1, Phases: 3, Current: "P18"}, Repo: github.Access{Checked: true, Reachable: true, Push: true, CheckedAt: 2026-10-08T15:00:00Z}}, nil for "demo" and control.ErrUnknownProject otherwise; h := Build(f, func(p string) bool { return p == "demo" }, func(p string) (string, bool) { return "s", p == "demo" }, "tok-7"); requests by httptest.NewRequest (a body with Content-Type application/json and Accept "application/json, text/event-stream")'
              when: 'GET /healthz; GET /projects/demo/status with Authorization "Bearer tok-7"; POST /mcp/demo with "Bearer tok-7" and the body `{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}`; GET /projects/demo/status without Authorization — each served by h.ServeHTTP on httptest.NewRecorder'
              then: '200 with the body exactly `{"status":"ok"}` + "\n"; 200 with the body exactly `{"state":"busy","phase":"P18","minutes":37,"cost_usd":1.92,"five_hour":22,"seven_day":60,"session_id":"s-1","queue":{"state":"running","approved":"7b31dfe","index":1,"phases":3,"current":"P18","reason":""},"repo":{"checked":true,"reachable":true,"push":true,"reason":"","checked_at":"2026-10-08T15:00:00Z"}}` + "\n"; 200 with result.tools (the body decoded by encoding/json) holding 11 tools, "status" and "events" among their names; 401'
            - given: 'b := [16]byte{0x96, 0x7e, 0x8f, 0x4d, 0xa2, 0xeb, 0x0a, 0xa6, 0x16, 0x8b, 0xb9, 0x05, 0x4a, 0x1c, 0x3d, 0x7e}; then the zero [16]byte; then [16]byte{0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff, 0xff}; then [16]byte{0x00, 0x11, 0x22, 0x33, 0x44, 0x55, 0x66, 0x77, 0x88, 0x99, 0xaa, 0xbb, 0xcc, 0xdd, 0xee, 0xff}'
              when: UUIDv4
              then: 'exactly "967e8f4d-a2eb-4aa6-968b-b9054a1c3d7e" (byte 6 0x0a → 4a, byte 8 0x16 → 96: the probe''s own session id); "00000000-0000-4000-8000-000000000000"; "ffffffff-ffff-4fff-bfff-ffffffffffff"; "00112233-4455-4677-8899-aabbccddeeff" — each 36 characters, lower-case'
            - given: 'a := newID(); b := newID()'
              when: newID
              then: 'each matches ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ (regexp.MustCompile), len 36; a != b; neither contains an upper-case letter'
Guardrail:
  - name: Injected Clock And Ids
    description: >
      No package but cmd/morphd reads the clock or a random source: time comes in as a `now` argument or an injected
      Now func() time.Time, ids from an injected NewID func() string; time.Now, math/rand and crypto/rand appear only in
      cmd/morphd. Timers are the daemon's Tick, driven by main's ticker.
  - name: No Network In Tests
    description: >
      Tests never open a listener or dial: HTTP is tested with httptest.NewRecorder and httptest.NewRequest, Telegram and
      GitHub through an injected Do, the MCP server over in-memory transports; a test writes files only under
      t.TempDir(); no test runs claude or reaches github.com or api.telegram.org.
  - name: No Shell Outside Runner
    description: >
      os/exec is imported only by package runner (git, morph) and package claude (the claude process); every other package
      runs commands through runner.Runner and tests script them with runner.Fake.
  - name: Secrets Never Logged
    description: >
      The API token, the session tokens, the GitHub token and the Telegram token never appear in a response body, a log
      line, a milestone, an error text or the argv of a spawned process; secrets live in files of mode 0600 under the
      state directory; the git credentials reach git through a credential store file, never through a URL or an argument.
Requirement:
  - name: Claude Behind An Interface
    description: >
      The claude CLI is reached only through claude.Process (stdin lines in, stdout lines out, an exit status); the
      daemon's tests use claude.Fake fed with lines from tests/fixtures/stream/probe.jsonl, never a real claude.
  - name: Bearer Token On Every Route
    description: >
      Every HTTP route but GET /healthz and the MCP endpoints requires Authorization: Bearer <MORPHD_TOKEN>; /mcp and
      /mcp/{project} require the same token; /mcp/{project}/session requires that project's current session token.
      morphd listens on 127.0.0.1 only; TLS and the public name are Caddy's.
  - name: The Session Reports Only Itself
    description: >
      A VPS session can call phase_done, wait_operator and milestone only through its own endpoint
      /mcp/{project}/session with the token morphd minted for that spawn; the token changes on every spawn, so a past
      session or another project cannot report.
