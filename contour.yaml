version: 1
System:
  name: morphd
  description: >
    morphd is the Go daemon on a user's VPS that drives the claude CLI session of a Morph-built project in place of
    the PM's ssh + tmux flow: it launches claude in stream-json mode, writes orders and answers to its stdin, reads
    every event from its stdout into a log, keeps the phase queue the PM loaded, checks git at the start and the end of
    every phase, posts milestones to Telegram and serves the PM an HTTP API with a bearer token and a remote MCP server
    over the same control surface. Module path "morphstudio", Go 1.25, the standard library plus the one module named
    under dependencies (vendored). One directory per package at the module root; package cmd/morphd is the entry point.
    A time written as 2026-10-08T13:09:01Z in an example is time.Date(2026, 10, 8, 13, 9, 1, 0, time.UTC). Tests compare
    with Equal of morphstudio/internal/testhelp; a probe line is read with testhelp.ProbeLine (the line's `dir` and the
    raw bytes of its `msg`). The claude process, the shell, Telegram and GitHub are behind interfaces and tests use the
    fakes declared next to them; no test opens a listener, dials, or runs claude.
  requirements:
    - Claude Behind An Interface
    - Bearer Token On Every Route
    - The Session Reports Only Itself
  guardrails:
    - Injected Clock And Ids
    - No Network In Tests
    - No Shell Outside Runner
    - Secrets Never Logged
  dependencies:
    - name: github.com/modelcontextprotocol/go-sdk
      version: "v1.8.0"
      language: go
      doc: docs/deps/go-sdk.md
  groups:
    - name: stream
      description: >
        Package stream in stream/: the claude stream-json wire format, pure. Parses one output line into a typed Event
        and builds the input lines the daemon writes. Imports encoding/json, bytes, strings, fmt and errors only; no
        I/O, no clock.
      language: go
      dataObjects:
        - name: Event
          description: One parsed output line of claude.
          schema: "type Event struct { Type, Subtype, SessionID, RequestID, Tool, Text string; Question *Question; Result *Result; Limits *Limits; Input json.RawMessage; Raw json.RawMessage }"
      functions:
        - name: Parse Event
          description: One output line of the claude stream decoded into the Event the rest of morphd reads.
          behavior: >
            Declares in stream/parse.go, exactly, one field per line:
            `type Question struct { Text string `json:"text"`; Header string `json:"header"`; Options []string `json:"options"`;
            MultiSelect bool `json:"multi_select"`; ToolUseID string `json:"tool_use_id"` }`;
            `type Result struct { Subtype string `json:"subtype"`; IsError bool `json:"is_error"`; NumTurns int `json:"num_turns"`;
            TotalCostUSD float64 `json:"total_cost_usd"`; TerminalReason string `json:"terminal_reason"`; DurationMS int64 `json:"duration_ms"`;
            Errors []string `json:"errors"` }`;
            `type Window struct { Utilization float64 `json:"utilization"`; ResetsAt int64 `json:"resets_at"` }`;
            `type Limits struct { FiveHour Window `json:"five_hour"`; SevenDay Window `json:"seven_day"` }`;
            `type Event struct { Type string `json:"type"`; Subtype string `json:"subtype"`; SessionID string `json:"session_id"`;
            RequestID string `json:"request_id"`; Tool string `json:"tool"`; Text string `json:"text"`; Question *Question `json:"question,omitempty"`;
            Result *Result `json:"result,omitempty"`; Limits *Limits `json:"limits,omitempty"`; Input json.RawMessage `json:"input,omitempty"`;
            Raw json.RawMessage `json:"-"` }` and `func Parse(line []byte) (Event, error)`.
            Parse trims white space; an empty line → error "stream: empty line"; invalid JSON → an error whose text begins
            "stream: bad json"; valid JSON that is not an object → "stream: not an object"; an object without a string "type"
            → "stream: no type". Otherwise Raw = the trimmed line, Type = "type", SessionID = the top-level "session_id" when
            present, and by Type: "system" → Subtype = "subtype"; "assistant" → Text = the "text" of every content part of
            message.content with part type "text", joined with "\n" (thinking and tool_use parts contribute nothing);
            "result" → Subtype = "subtype", Text = the "result" string when present, Result filled from subtype, is_error,
            num_turns, total_cost_usd, terminal_reason, duration_ms and errors (absent errors → nil); "rate_limit_event" →
            Limits from rate_limit_info.unifiedWindows.five_hour / seven_day (utilization, resetsAt), a missing window
            leaves its Window zero; "control_request" → RequestID = "request_id", Subtype = request.subtype, and when the
            subtype is "can_use_tool": Tool = request.tool_name, Input = the raw bytes of request.input, and when Tool is
            "AskUserQuestion" and input.questions has at least one element: Question from the first element (question,
            header, the label of every option, multiSelect) with ToolUseID = request.tool_use_id; "control_response" →
            RequestID = response.request_id, Subtype = response.subtype. Any other Type passes through with only Type,
            SessionID and Raw set. Unknown keys are ignored everywhere.
          steps:
            - produces: Event
          examples:
            - given: 'the msg bytes of line 4 of tests/fixtures/stream/probe.jsonl (dir out, a system init); then line 16 (a control_response to int-1)'
              when: Parse
              then: 'Event{Type: "system", Subtype: "init", SessionID: "967e8f4d-a2eb-4aa6-968b-b9054a1c3d7e"}, Question, Result, Limits nil, Text "", error nil; then Event{Type: "control_response", Subtype: "success", RequestID: "int-1"} with SessionID ""'
              ref: tests/fixtures/stream/probe.jsonl
            - given: 'line 5 (assistant text PONG); line 12 (assistant with one thinking part); line 13 (assistant with one tool_use part)'
              when: Parse
              then: 'Text "PONG", Type "assistant", SessionID "967e8f4d-a2eb-4aa6-968b-b9054a1c3d7e"; then Text ""; then Text "" — only text parts count; all three error nil'
              ref: tests/fixtures/stream/probe.jsonl
            - given: 'line 6 (rate_limit_event)'
              when: Parse
              then: 'Type "rate_limit_event", Limits &Limits{FiveHour: Window{Utilization: 0.22, ResetsAt: 1791469200}, SevenDay: Window{Utilization: 0.6, ResetsAt: 1791853200}}, Result nil'
              ref: tests/fixtures/stream/probe.jsonl
            - given: 'line 7 (the result of the PONG turn)'
              when: Parse
              then: 'Type "result", Subtype "success", Text "PONG", Result &Result{Subtype: "success", IsError: false, NumTurns: 1, TotalCostUSD: 0.0021784900000000004, TerminalReason: "completed", DurationMS: 958, Errors: nil}, Limits nil'
              ref: tests/fixtures/stream/probe.jsonl
            - given: 'line 19 (the result after the interrupt)'
              when: Parse
              then: 'Result &Result{Subtype: "error_during_execution", IsError: true, NumTurns: 3, TotalCostUSD: 0.0028906000000000005, TerminalReason: "aborted_streaming", DurationMS: 3032, Errors: []string{"[ede_diagnostic] result_type=user last_content_type=n/a stop_reason=tool_use"}}, Text ""'
              ref: tests/fixtures/stream/probe.jsonl
            - given: 'line 27 (control_request can_use_tool for AskUserQuestion)'
              when: Parse
              then: 'Type "control_request", Subtype "can_use_tool", RequestID "9f4ffa22-2676-4391-bfd9-bd7d16c3866c", Tool "AskUserQuestion", Question &Question{Text: "Which option do you want: A or B?", Header: "A or B", Options: []string{"Option A", "Option B"}, MultiSelect: false, ToolUseID: "toolu_01FUdZWoHspVQKBCdwkjgj1R"}, and Input decodes (json.Unmarshal into map[string]any) to the same value as the line''s request.input'
              ref: tests/fixtures/stream/probe.jsonl
            - given: 'the literal line {"type":"control_request","request_id":"r-7","request":{"subtype":"can_use_tool","tool_name":"Bash","input":{"command":"ls"},"tool_use_id":"toolu_x"}}'
              when: Parse
              then: 'RequestID "r-7", Tool "Bash", Question nil, Input exactly the bytes {"command":"ls"}, SessionID ""'
            - given: 'in turn the lines "" , "  \n", "[1,2]", "{\"a\":1}", "{\"type\":\"result\"" (cut), "{\"type\":7}"'
              when: Parse
              then: 'errors with texts "stream: empty line", "stream: empty line", "stream: not an object", "stream: no type", one beginning "stream: bad json", "stream: no type"; every Event zero'
        - name: Encode Lines
          description: The input lines morphd writes to claude, each one JSON object ending with a newline.
          behavior: >
            Declares in stream/encode.go: `func Initialize(requestID string) []byte`, `func Interrupt(requestID string) []byte`,
            `func User(text string) []byte`, `func Allow(requestID string, input json.RawMessage) ([]byte, error)` and
            `func Answer(requestID string, input json.RawMessage, question, label string) ([]byte, error)`. Every line is
            the json.Marshal of a struct whose fields are declared in the order written below (encoding/json's HTML
            escaping stays on, so < > & become \u003c \u003e \u0026) followed by exactly one "\n".
            Initialize: {"type":"control_request","request_id":<id>,"request":{"subtype":"initialize"}}.
            Interrupt: the same with subtype "interrupt".
            User: {"type":"user","message":{"role":"user","content":<text>},"parent_tool_use_id":null}.
            Allow: {"type":"control_response","response":{"subtype":"success","request_id":<id>,"response":{"behavior":"allow","updatedInput":<input>}}}
            where input is embedded as json.RawMessage (so it is compacted); an input that is not valid JSON → (nil, an error
            whose text begins "stream: bad input").
            Answer: input must decode (json.Unmarshal) into map[string]any, else (nil, "stream: input is not an object");
            the map gets the key "answers" = map[string]string{question: label} (replacing any existing "answers") and is
            embedded as updatedInput by json.Marshal (so object keys come out sorted at every level, as encoding/json
            writes maps); the rest as Allow.
          steps:
            - produces: json line
          examples:
            - given: 'requestID "init-1"; then "init-2"'
              when: Initialize
              then: 'exactly {"type":"control_request","request_id":"init-1","request":{"subtype":"initialize"}} + "\n"; then the same with "init-2"'
            - given: 'requestID "int-1"; then "int-9"'
              when: Interrupt
              then: 'exactly {"type":"control_request","request_id":"int-1","request":{"subtype":"interrupt"}} + "\n"; then with "int-9"'
            - given: 'text "Reply with exactly one word: PONG"'
              when: User
              then: 'exactly {"type":"user","message":{"role":"user","content":"Reply with exactly one word: PONG"},"parent_tool_use_id":null} + "\n", which decodes equal (map[string]any) to the msg of line 3 of tests/fixtures/stream/probe.jsonl'
              ref: tests/fixtures/stream/probe.jsonl
            - given: 'text "a <b> & \"c\"\nd" (a Go string with a real newline)'
              when: User
              then: 'exactly {"type":"user","message":{"role":"user","content":"a \u003cb\u003e \u0026 \"c\"\nd"},"parent_tool_use_id":null} + "\n" (the <, >, & and \n are six-character and two-character escapes in the bytes; in a Go test the want is a raw string literal, since an interpreted Go string would turn the six-character escapes back into < > &)'
            - given: 'requestID "r-7", input {"command": "ls"} (with the space)'
              when: Allow
              then: 'exactly {"type":"control_response","response":{"subtype":"success","request_id":"r-7","response":{"behavior":"allow","updatedInput":{"command":"ls"}}}} + "\n", error nil'
            - given: 'requestID "r-1", input {"questions":[{"question":"Q?","options":[{"label":"Yes"},{"label":"No"}]}]}, question "Q?", label "Yes"'
              when: Answer
              then: 'exactly {"type":"control_response","response":{"subtype":"success","request_id":"r-1","response":{"behavior":"allow","updatedInput":{"answers":{"Q?":"Yes"},"questions":[{"options":[{"label":"Yes"},{"label":"No"}],"question":"Q?"}]}}}} + "\n", error nil'
            - given: 'requestID "9f4ffa22-2676-4391-bfd9-bd7d16c3866c", input = request.input of line 27 of tests/fixtures/stream/probe.jsonl, question "Which option do you want: A or B?", label "Option B"'
              when: Answer
              then: 'error nil; the line decodes (map[string]any) equal to the msg of line 28 (the probe''s own answer, dir in)'
              ref: tests/fixtures/stream/probe.jsonl
            - given: 'Answer with input [1]; Allow with input {"a": (cut)'
              when: called
              then: '(nil, error "stream: input is not an object"); (nil, an error beginning "stream: bad input")'
    - name: session
      description: >
        Package session in session/: the state of one live claude session as a pure machine: state, the order queue, the
        pending question, cost and limits. Every event goes through Apply, every command returns the lines to write and
        the milestones to post; the daemon executes them. Imports morphstudio/stream, encoding/json, errors, fmt,
        strings and time; the clock is the `now` argument.
      language: go
      dataObjects:
        - name: Action
          description: What the daemon must do after an event or a command.
          schema: "type Action struct { Kind string; Line []byte; Headline string; Numbers string }  // Kind: write | ask | turn | limit"
      functions:
        - name: Session Machine
          description: The session state and its transition on every parsed event.
          behavior: >
            Declares in session/machine.go, exactly:
            `var ErrNoQuestion = errors.New("no pending question")`, `var ErrBadOption = errors.New("option out of range")`,
            `var ErrNotBusy = errors.New("session is not busy")`;
            `type Pending struct { RequestID string `json:"request_id"`; Question stream.Question `json:"question"`; Input json.RawMessage `json:"input"`; AskedAt time.Time `json:"asked_at"` }`;
            `type Action struct { Kind string; Line []byte; Headline string; Numbers string }`;
            `type Machine struct { State string `json:"state"`; SessionID string `json:"session_id"`; Turns int `json:"turns"`;
            CostUSD float64 `json:"cost_usd"`; Limits *stream.Limits `json:"limits,omitempty"`; LimitsAt time.Time `json:"limits_at"`;
            Queue []string `json:"queue"`; Pending *Pending `json:"pending,omitempty"`; LastResult *stream.Result `json:"last_result,omitempty"`;
            TurnStartedAt time.Time `json:"turn_started_at"`; LastEventAt time.Time `json:"last_event_at"`; Allowed int `json:"allowed"` }`;
            `func New() *Machine` (State "ready", Queue a non-nil empty slice) and `func (m *Machine) Apply(ev stream.Event, now time.Time) []Action`.
            State is one of "ready" (no turn in flight), "busy" (a turn in flight), "question" (a turn in flight and a
            question pending). Apply sets LastEventAt = now on every event, then by ev.Type:
            "system" with Subtype "init" → SessionID = ev.SessionID;
            "rate_limit_event" → Limits = ev.Limits, LimitsAt = now, one Action{Kind: "limit"};
            "control_request" with Subtype "can_use_tool": Tool "AskUserQuestion" and ev.Question != nil → Pending =
            {ev.RequestID, *ev.Question, ev.Input, now}, State "question", one Action{Kind: "ask", Headline: the question text,
            Numbers: the options numbered from 1 and joined with " · " ("1 Option A · 2 Option B")}; any other tool → one
            Action{Kind: "write", Line: stream.Allow(ev.RequestID, ev.Input)} and Allowed++ (the state unchanged; an Input
            that is absent or not valid JSON is sent as {}, so the line is never nil and claude never waits on it);
            "result" → Turns++, CostUSD = ev.Result.TotalCostUSD (it is cumulative: replaced, never added), LastResult =
            ev.Result, Pending = nil, State "ready", one Action{Kind: "turn", Headline: ev.Text, Numbers: fmt.Sprintf("%s · turns %d · $%.4f",
            Result.Subtype, Result.NumTurns, Result.TotalCostUSD)}; then, when Queue is not empty, the first text is removed
            from Queue and sent: Action{Kind: "write", Line: stream.User(text)}, State "busy", TurnStartedAt = now.
            Every other event changes nothing but LastEventAt and returns nil. Apply never returns an empty non-nil slice.
          steps:
            - uses: stream
            - produces: Action
          examples:
            - given: 'm := New(); the out lines 4, 5, 6, 7 of tests/fixtures/stream/probe.jsonl parsed with stream.Parse and applied in order at now = 2026-10-08T13:09:03Z, 13:09:03Z, 13:09:03Z, 13:09:04Z'
              when: Apply
              then: 'after 4: SessionID "967e8f4d-a2eb-4aa6-968b-b9054a1c3d7e", no actions; after 5: no actions; after 6: Limits.FiveHour {0.22, 1791469200}, LimitsAt 13:09:03Z, exactly one action Kind "limit"; after 7: State "ready", Turns 1, CostUSD 0.0021784900000000004, LastResult.Subtype "success", exactly one action {Kind "turn", Headline "PONG", Numbers "success · turns 1 · $0.0022"}; LastEventAt 13:09:04Z'
              ref: tests/fixtures/stream/probe.jsonl
            - given: 'a machine that applied line 7 (CostUSD 0.0021784900000000004) then applies line 31'
              when: Apply
              then: 'CostUSD 0.005775230000000001 (replaced, not 0.00795…), Turns 2, Numbers of the action "success · turns 2 · $0.0058"'
              ref: tests/fixtures/stream/probe.jsonl
            - given: 'm busy (State "busy"); line 27 applied at 2026-10-08T13:09:08Z'
              when: Apply
              then: 'State "question", Pending.RequestID "9f4ffa22-2676-4391-bfd9-bd7d16c3866c", Pending.Question.Options ["Option A", "Option B"], Pending.AskedAt 13:09:08Z, exactly one action {Kind "ask", Headline "Which option do you want: A or B?", Numbers "1 Option A · 2 Option B"}'
              ref: tests/fixtures/stream/probe.jsonl
            - given: 'm busy; stream.Parse of the literal line {"type":"control_request","request_id":"r-7","request":{"subtype":"can_use_tool","tool_name":"Bash","input":{"command":"ls"},"tool_use_id":"toolu_x"}} (Parse Event example 7); then the literal line {"type":"control_request","request_id":"r-8","request":{"subtype":"can_use_tool","tool_name":"Read"}} (no input)'
              when: Apply
              then: 'State still "busy", Pending nil, Allowed 1, exactly one action {Kind "write", Line exactly {"type":"control_response","response":{"subtype":"success","request_id":"r-7","response":{"behavior":"allow","updatedInput":{"command":"ls"}}}} + "\n"}; then Allowed 2 and exactly one action {Kind "write", Line exactly {"type":"control_response","response":{"subtype":"success","request_id":"r-8","response":{"behavior":"allow","updatedInput":{}}}} + "\n"}'
            - given: 'm busy with Queue ["second", "third"]; line 7 applied at 2026-10-08T13:10:00Z'
              when: Apply
              then: 'two actions in order: {Kind "turn", Headline "PONG", …} then {Kind "write", Line = stream.User("second")}; State "busy", TurnStartedAt 13:10:00Z, Queue ["third"]; a second result → turn + write User("third"), Queue empty; a third result → one action (turn only), State "ready"'
              ref: tests/fixtures/stream/probe.jsonl
            - given: 'm in State "question" with a Pending; line 19 (the aborted result) applied'
              when: Apply
              then: 'State "ready", Pending nil, LastResult.TerminalReason "aborted_streaming", action {Kind "turn", Headline "", Numbers "error_during_execution · turns 3 · $0.0029"}'
              ref: tests/fixtures/stream/probe.jsonl
            - given: 'm := New(); lines 12, 13, 14, 16 (thinking, tool_use, a user tool_result, a control_response) applied at 2026-10-08T13:09:05Z'
              when: Apply
              then: 'each returns nil; State "ready", Turns 0, LastEventAt 13:09:05Z; New().Queue is []string{} (non-nil, empty) and json.Marshal(New()) contains "queue":[] and no "pending" key'
              ref: tests/fixtures/stream/probe.jsonl
        - name: Order Queue
          description: The three commands of the PM on a machine — order, answer, interrupt — and what each writes.
          behavior: >
            Declares in session/orders.go: `type OrderResult struct { Sent bool `json:"sent,omitempty"`; Queued int `json:"queued,omitempty"` }`,
            `func (m *Machine) Order(text string, now time.Time) (OrderResult, []Action)`,
            `func (m *Machine) Answer(option int, now time.Time) ([]Action, error)` and
            `func (m *Machine) Interrupt(requestID string) ([]Action, error)`, over the types of session/machine.go.
            Order: text is trimmed with strings.TrimSpace; an empty text → (OrderResult{}, nil) and nothing changes; State
            "ready" → one Action{Kind: "write", Line: stream.User(text)}, State "busy", TurnStartedAt = now, result
            {Sent: true}; State "busy" or "question" → text appended to Queue, no actions, result {Queued: len(Queue)}.
            Answer: Pending nil → (nil, ErrNoQuestion); option < 1 or option > len(Pending.Question.Options) → (nil,
            fmt.Errorf("%w: %d of 1..%d", ErrBadOption, option, len(options))) (errors.Is ErrBadOption); else one
            Action{Kind: "write", Line: stream.Answer(Pending.RequestID, Pending.Input, Pending.Question.Text, Options[option-1])},
            Pending = nil, State "busy".
            Interrupt: State "ready" → (nil, ErrNotBusy); else one Action{Kind: "write", Line: stream.Interrupt(requestID)},
            the state unchanged (the result that follows makes it ready).
          steps:
            - calls: Session Machine
            - uses: stream
            - produces: OrderResult
          examples:
            - given: 'm := New(); Order("smoke checked green. Resume with P12b", 2026-10-08T14:00:00Z)'
              when: Order
              then: 'OrderResult{Sent: true, Queued: 0} whose json.Marshal is exactly {"sent":true}; one action {Kind "write", Line = stream.User("smoke checked green. Resume with P12b")}; State "busy", TurnStartedAt 14:00:00Z, Queue empty'
            - given: 'the busy machine of example 1; Order("second", 14:00:05Z); Order("  third  ", 14:00:06Z)'
              when: Order
              then: '{Queued: 1} (json exactly {"queued":1}) with no actions; then {Queued: 2}, Queue ["second", "third"] (trimmed); TurnStartedAt still 14:00:00Z'
            - given: 'm := New(); Order("   ", now); Order("", now)'
              when: Order
              then: 'each OrderResult{} (json exactly {}) and nil actions; State "ready"'
            - given: 'a machine in State "question" with Pending = the question of line 27 of tests/fixtures/stream/probe.jsonl (RequestID "9f4ffa22-2676-4391-bfd9-bd7d16c3866c", Input = request.input)'
              when: 'Answer(2, 2026-10-08T13:09:08Z)'
              then: 'error nil; one action {Kind "write"} whose Line decodes equal to the msg of line 28; Pending nil; State "busy"'
              ref: tests/fixtures/stream/probe.jsonl
            - given: 'the machine of example 4 before the answer'
              when: 'Answer(0, now); Answer(3, now); then after Answer(1, now) succeeded, Answer(1, now) again'
              then: 'errors.Is ErrBadOption with text "option out of range: 0 of 1..2"; "option out of range: 3 of 1..2"; then ErrNoQuestion; the pending question is unchanged by the two failures'
            - given: 'm := New() (ready); then the busy machine of example 1'
              when: 'Interrupt("int-1")'
              then: '(nil, ErrNotBusy); then one action {Kind "write", Line exactly {"type":"control_request","request_id":"int-1","request":{"subtype":"interrupt"}} + "\n"}, State still "busy"'
            - given: 'a machine in State "question"'
              when: 'Interrupt("int-2")'
              then: 'one write action with request_id "int-2"; State "question" and Pending kept (the aborted result clears them)'
    - name: eventlog
      description: >
        Package eventlog in eventlog/: the append-only JSONL log of one session (every line in and out, numbered) with
        an in-memory tail the API serves by sequence number. Imports os, bufio, bytes, io, encoding/json, errors, fmt,
        path/filepath, strconv, sync and time; the clock is the `now` argument.
      language: go
      functions:
        - name: Event Log
          description: Open or continue a session log file, append numbered entries, read entries after a sequence number.
          behavior: >
            Declares in eventlog/log.go: `type Entry struct { Seq int64 `json:"seq"`; T float64 `json:"t"`; Dir string `json:"dir"`; Msg json.RawMessage `json:"msg"` }`,
            `type Log struct` (unexported fields), `func Open(path string) (*Log, error)`,
            `func (l *Log) Append(dir string, msg json.RawMessage, now time.Time) (Entry, error)`,
            `func (l *Log) Since(after int64, max int) []Entry`, `func (l *Log) Last() int64` and `func (l *Log) Path() string`.
            Open creates the parent directories (0o755) and the file when missing (0o644) and reads every existing line,
            of any length (a tool result line runs past bufio.Scanner's 64 KiB default: read with bufio.Reader.ReadBytes or
            a Scanner given a larger Buffer): each must decode into an Entry, else (nil, an error whose text begins "eventlog: read " + path + " line <n>: ");
            Last becomes the Seq of the last line (0 for an empty file); the last 2000 entries are kept in memory. A path
            that cannot be opened → (nil, an error beginning "eventlog: open "). Append compacts msg (json.Compact; invalid
            → an error beginning "eventlog: bad msg"), builds Entry{Seq: Last()+1, T: now.UnixMilli() as a float divided by
            1000, Dir: dir, Msg: compacted}, writes its json.Marshal plus "\n" to the file (synchronously, under a mutex)
            and keeps it in memory, dropping the oldest beyond 2000. Since returns the kept entries with Seq > after in
            order, at most max (max <= 0 means 200), as a new non-nil slice (empty when none). Entries are copies.
          steps:
            - produces: Entry
          examples:
            - given: 'path := filepath.Join(t.TempDir(), "demo", "sessions", "s1.jsonl") (no such directories)'
              when: 'Open(path); Last(); Since(0, 10); Path()'
              then: 'a non-nil *Log, error nil; the file exists and is empty; Last 0; Since []Entry{} (non-nil, length 0); Path() == path'
            - given: 'the log of example 1'
              when: 'Append("in", []byte(`{"type":"user"}`), 2026-10-08T13:09:01.189Z)'
              then: 'Entry{Seq: 1, T: 1791464941.189, Dir: "in", Msg: {"type":"user"}}, error nil; the file content is exactly {"seq":1,"t":1791464941.189,"dir":"in","msg":{"type":"user"}} + "\n"; Last 1'
            - given: 'the log after example 2'
              when: 'Append("out", []byte(`{"a": 1, "b": [1, 2]}`), 2026-10-08T13:09:02Z); then Append("out", []byte(`{"c":3}`), 13:09:03Z)'
              then: 'Seq 2 with Msg exactly {"a":1,"b":[1,2]} and T 1791464942; Seq 3; the file has 3 lines, the second exactly {"seq":2,"t":1791464942,"dir":"out","msg":{"a":1,"b":[1,2]}}'
            - given: 'the log after example 3 (seq 1..3)'
              when: 'Since(1, 0); Since(0, 2); Since(3, 10); Since(5, 10)'
              then: 'entries 2, 3; entries 1, 2; []Entry{}; []Entry{}'
            - given: 'the file written by example 3, opened again with Open(path)'
              when: 'Last(); Since(0, 10); then Append("in", []byte(`{}`), 2026-10-08T13:09:04Z)'
              then: 'Last 3; the three entries equal to those of example 3 (Seq, T, Dir, Msg); the new entry has Seq 4 and the file 4 lines'
            - given: 'a file holding the line {"seq":1,"t":1,"dir":"in","msg":{}} followed by the line not json'
              when: Open
              then: '(nil, an error beginning "eventlog: read " + path + " line 2: ")'
            - given: 'path := filepath.Join(testhelp.WriteFile(t, "f", "x"), "s.jsonl") (the parent is a regular file)'
              when: Open
              then: '(nil, an error beginning "eventlog: open ")'
            - given: 'a fresh log with 2500 appends of {"i":<n>} (n = 1..2500) at 2026-10-08T13:00:00Z'
              when: 'Since(0, 0); Since(2498, 0); Last()'
              then: '200 entries with Seq 501..700 (the memory keeps the last 2000, the default max is 200); entries 2499, 2500; Last 2500; the file has 2500 lines'
            - given: 'the log of example 1'
              when: 'Append("in", []byte(`{"a":`), now)'
              then: 'Entry{} and an error beginning "eventlog: bad msg"; Last still 0; the file still empty'
            - given: 'the log of example 1; Append("out", []byte(`{"s":"` + strings.Repeat("a", 100000) + `"}`), 2026-10-08T13:09:05Z) (one line of 100 052 bytes in the file, the newline included); then Open(path) again'
              when: 'Last(); Since(0, 10)'
              then: 'Last 1; exactly one entry, Seq 1, Dir "out", Msg exactly the 100 008 bytes appended (a line over 64 KiB reads whole, no "token too long" error)'
    - name: telegram
      description: >
        Package telegram in telegram/: the milestone message format and the Bot API call. The HTTP call goes through
        an injected Do function; tests give a fake. Imports net/http, net/url, io, strings, fmt, context, errors; no
        clock.
      language: go
      functions:
        - name: Milestone Post
          description: Format a milestone line with its icon and project prefix and post it with sendMessage.
          behavior: >
            Declares in telegram/post.go: `var Icons = map[string]string{"start": "🚀", "gate": "🚦", "run": "🏁", "fail": "❌",
            "merge": "🔀", "smoke": "🧪", "stop": "🛑", "debt": "💸", "end": "🎉", "info": "💬", "watchdog": "🐕", "idle": "💤", "ask": "🔔"}`,
            `type Status struct { Sent bool `json:"sent"`; Skipped bool `json:"skipped"`; HTTPStatus int `json:"http_status"` }`,
            `type Client struct { Token string; ChatID string; Do func(*http.Request) (*http.Response, error) }`,
            `func Escape(s string) string` (& → &amp;, < → &lt;, > → &gt;, in that order of precedence so an & is escaped once),
            `func Text(project, kind, headline, numbers string) string` and
            `func (c Client) Post(ctx context.Context, project, kind, headline, numbers string) (Status, error)`.
            Text = "[" + project + "] " + icon + " <b>" + Escape(headline cut to its first 300 runes) + "</b>", then, when
            numbers is not empty, "\n" + Escape(numbers cut to 3500 runes); an unknown kind uses "💬".
            Post: Token or ChatID empty → (Status{Skipped: true}, nil) and Do is not called. Else one POST to
            "https://api.telegram.org/bot" + Token + "/sendMessage" with Content-Type application/x-www-form-urlencoded and
            the body url.Values{"chat_id", "text", "parse_mode": "HTML", "disable_web_page_preview": "true"}.Encode() (keys
            sorted, as url.Values does); the response body is read and closed; status 200 → (Status{Sent: true, HTTPStatus: 200},
            nil); another status → (Status{HTTPStatus: n}, error "telegram: status <n>: " + the first 200 bytes of the body);
            Do returning an error → (Status{}, error "telegram: post failed: " + err.Error() with every occurrence of Token
            replaced by "***"). The token never appears in a returned error.
          steps:
            - produces: Status
          examples:
            - given: 'project "demo", kind "start", headline "P18 started", numbers "$2.10 · 3 min"'
              when: Text
              then: 'exactly "[demo] 🚀 <b>P18 started</b>\n$2.10 · 3 min"'
            - given: 'project "x", kind "ask", headline "a <b> & c", numbers ""; then kind "nope", headline "h", numbers "n"'
              when: Text
              then: '"[x] 🔔 <b>a &lt;b&gt; &amp; c</b>" (no trailing newline); then "[x] 💬 <b>h</b>\nn"'
            - given: 'headline of 301 × "é", numbers of 3501 × "ж"'
              when: Text
              then: 'the headline part holds exactly 300 × "é", the numbers part exactly 3500 × "ж" (runes, not bytes)'
            - given: 'c := Client{Token: "123:ABC", ChatID: "-100", Do: a fake that records the request and answers 200 with body {"ok":true}}; Post(ctx, "demo", "start", "P18 started", "$2.10 · 3 min")'
              when: Post
              then: 'Status{Sent: true, HTTPStatus: 200}, nil; the recorded request: method POST, URL exactly https://api.telegram.org/bot123:ABC/sendMessage, Content-Type application/x-www-form-urlencoded, body exactly chat_id=-100&disable_web_page_preview=true&parse_mode=HTML&text=%5Bdemo%5D+%F0%9F%9A%80+%3Cb%3EP18+started%3C%2Fb%3E%0A%242.10+%C2%B7+3+min'
            - given: 'c := Client{Token: "9:Z", ChatID: "42", Do: the recorder}; Post(ctx, "x", "ask", "a <b> & c", "")'
              when: Post
              then: 'URL https://api.telegram.org/bot9:Z/sendMessage, body exactly chat_id=42&disable_web_page_preview=true&parse_mode=HTML&text=%5Bx%5D+%F0%9F%94%94+%3Cb%3Ea+%26lt%3Bb%26gt%3B+%26amp%3B+c%3C%2Fb%3E'
            - given: 'Client{Token: "", ChatID: "42", Do: a fake that fails the test if called}; then Client{Token: "t", ChatID: ""}'
              when: Post
              then: 'each (Status{Skipped: true}, nil); Do never called'
            - given: 'a Do answering 403 with body {"ok":false,"description":"Forbidden: bot was blocked"}'
              when: Post
              then: 'Status{HTTPStatus: 403}, error text exactly "telegram: status 403: {\"ok\":false,\"description\":\"Forbidden: bot was blocked\"}"'
            - given: 'Client{Token: "123:ABC", ChatID: "1", Do: a fake returning errors.New("Post \"https://api.telegram.org/bot123:ABC/sendMessage\": dial tcp: refused")}'
              when: Post
              then: 'Status{}, error text exactly "telegram: post failed: Post \"https://api.telegram.org/bot***/sendMessage\": dial tcp: refused"'
    - name: runner
      description: >
        Package runner in runner/: the only package that runs a shell command (git, morph). The Runner interface, the
        os/exec implementation and the Fake every other package's tests script. Imports os/exec, bytes, context,
        errors, fmt, os, strings, sync, time (time only for Cmd.WaitDelay; never time.Now).
      language: go
      functions:
        - name: Exec Runner
          description: The command interface, its os/exec implementation and the scripted fake.
          behavior: >
            Declares in runner/runner.go: `type Result struct { Stdout string; Stderr string; Code int }`,
            `type Runner interface { Run(ctx context.Context, dir string, env []string, name string, args ...string) (Result, error) }`,
            `type OS struct{}`, `type Call struct { Dir string; Name string; Args []string }` and
            `type Fake struct { Calls []Call; Script map[string]Result; Errors map[string]string; Default Result }` (plus an
            unexported mutex). `func Key(name string, args ...string) string` = name and the args joined with single spaces.
            OS.Run: exec.CommandContext(ctx, name, args...) with Dir = dir, WaitDelay = 500 * time.Millisecond (a killed `sh -c` leaves its child holding the output pipes; without WaitDelay Run waits for that child) and Env = os.Environ() followed by env (nil env
            adds nothing); stdout and stderr captured whole; a non-zero exit is NOT an error: (Result{out, err, code}, nil);
            the command cannot start (not found, bad dir) → (Result{Code: -1}, an error beginning "runner: "); ctx done
            before exit → the process is killed and (Result{Code: -1}, ctx.Err()).
            Fake.Run appends Call{dir, name, args} and returns: Errors[Key] present → (Result{Code: -1}, errors.New(that text));
            Script[Key] present → it; else Default; always nil error otherwise.
          steps:
            - produces: Result
          examples:
            - given: 'OS{}.Run(ctx, t.TempDir(), nil, "sh", "-c", "printf hi; printf err >&2; exit 3")'
              when: Run
              then: 'Result{Stdout: "hi", Stderr: "err", Code: 3}, error nil'
            - given: 'dir := t.TempDir() holding one file f.txt; OS{}.Run(ctx, dir, nil, "sh", "-c", "ls")'
              when: Run
              then: 'Stdout "f.txt\n", Code 0'
            - given: 'OS{}.Run(ctx, t.TempDir(), []string{"MORPH_X=7"}, "sh", "-c", "echo $MORPH_X$HOME")'
              when: Run
              then: 'Stdout = "7" + os.Getenv("HOME") + "\n" (the parent environment is kept, the given entries appended)'
            - given: 'OS{}.Run(ctx, t.TempDir(), nil, "/nonexistent/bin/x"); then OS{}.Run(ctx, "/nonexistent/dir", nil, "sh", "-c", "true")'
              when: Run
              then: 'each Result.Code -1 and an error beginning "runner: "'
            - given: 'ctx with a 200 ms timeout; OS{}.Run(ctx, t.TempDir(), nil, "sh", "-c", "sleep 5")'
              when: Run
              then: 'returns within 2 s with Code -1 and errors.Is(err, context.DeadlineExceeded)'
            - given: 'f := &Fake{Script: map[string]Result{"git rev-parse HEAD": {Stdout: "abc\n"}}, Errors: map[string]string{"git fetch -q origin": "runner: fake offline"}, Default: Result{Stdout: "default\n", Code: 4}}'
              when: 'f.Run(ctx, "/p", nil, "git", "rev-parse", "HEAD"); f.Run(ctx, "/p", nil, "git", "fetch", "-q", "origin"); f.Run(ctx, "/q", nil, "git", "status")'
              then: '{Stdout "abc\n", Code 0}, nil; {Code -1} and error text "runner: fake offline"; {Stdout "default\n", Code 4} (the Default), nil; f.Calls == []Call{{"/p", "git", ["rev-parse", "HEAD"]}, {"/p", "git", ["fetch", "-q", "origin"]}, {"/q", "git", ["status"]}}'
            - given: 'Key("git", "rev-parse", "HEAD"); Key("morph")'
              when: Key
              then: '"git rev-parse HEAD"; "morph"'
    - name: queue
      description: >
        Package queue in queue/: the phase queue the PM loads from the approved plan, pure. Imports encoding/json,
        errors, fmt, strings.
      language: go
      dataObjects:
        - name: Plan
          description: What plan_load carries.
          schema: "type Plan struct { Approved string `json:\"approved\"`; Phases []Phase `json:\"phases\"` }"
      functions:
        - name: Phase Queue
          description: Load a plan with defaults, walk it phase by phase, stop and continue by the plan's marks.
          behavior: >
            Declares in queue/queue.go, exactly:
            `type Caps struct { ClaudeUSD float64 `json:"claude_usd"`; Hours float64 `json:"hours"`; ExecutorUSD float64 `json:"executor_usd"` }`;
            `type Phase struct { ID string `json:"id"`; StopAfter string `json:"stop_after"`; Caps Caps `json:"caps"` }`;
            `type Plan struct { Approved string `json:"approved"`; Phases []Phase `json:"phases"` }`;
            `type Outcome struct { Next string `json:"next"`; Stop string `json:"stop"` }`;
            `type Queue struct { Approved string `json:"approved"`; Phases []Phase `json:"phases"`; Index int `json:"index"`; State string `json:"state"`; Reason string `json:"reason"` }`;
            `func Load(p Plan, defaults Caps) (Queue, error)`, `func (q *Queue) Current() (Phase, bool)`, `func (q *Queue) Start() (Phase, error)`,
            `func (q *Queue) Done(phase, next string) (Outcome, error)`, `func (q *Queue) Stop(reason string)`, `func (q *Queue) Continue() (Phase, error)`.
            State is one of "empty", "queued", "running", "stopped", "done"; a zero Queue has State "" and Current false.
            Load: Approved trimmed must be non-empty → "queue: approved hash required"; no phases → "queue: no phases";
            each ID trimmed non-empty → "queue: phase <i>: empty id" (i from 0); repeated → "queue: duplicate phase \"<id>\"";
            StopAfter "" becomes "none", else must be "none", "smoke" or "operator" → "queue: phase \"<id>\": stop_after \"<v>\"";
            each zero Caps field is filled from defaults. The result has State "queued", Index 0. Current: the phase at
            Index when State is "queued", "running" or "stopped" and Index < len(Phases). Start: "queued" → State
            "running", returns Current; else error "queue: cannot start in state \"<s>\"". Done: State must be "running"
            and phase == Current().ID else error "queue: phase_done for \"<phase>\" but running \"<id>\"" (an empty
            running id when none); next must equal the ID of the phase after Index, or "" when there is none, else
            "queue: next \"<next>\", plan says \"<id>\"" (plan says "" when none); then Index++ and: no phase left →
            State "done", Outcome{Stop: "end"}; the finished phase's StopAfter "none" → State "queued", Outcome{Next: that id};
            "smoke" or "operator" → State "stopped", Reason = StopAfter, Outcome{Next: that id, Stop: StopAfter}. Stop:
            State "running" or "queued" → "stopped" with Reason (Index unchanged); otherwise nothing. Continue: "stopped" →
            State "queued", Reason "", returns Current (error "queue: nothing to continue (state \"<s>\")" when Current is
            false or the state differs).
          steps:
            - produces: Plan
          examples:
            - given: 'the Plan decoded from tests/fixtures/plan/queue-3.json (3 phases: P17 none, P18 smoke with caps {claude_usd 12}, P19 none); defaults Caps{30, 3, 5}'
              when: Load
              then: 'error nil; State "queued", Index 0, Approved "7b31dfe"; Phases[0] {ID "P17", StopAfter "none", Caps {30, 3, 5}}; Phases[1] {ID "P18", StopAfter "smoke", Caps {12, 3, 5}}; Phases[2].StopAfter "none"; Current() = P17, true'
              ref: tests/fixtures/plan/queue-3.json
            - given: 'Plan{Approved: " "}; Plan{Approved: "h", Phases: nil}; Plan{Approved: "h", Phases: [{ID " "}]}; Plan{Approved: "h", Phases: [{ID "P1"}, {ID "P1"}]}; Plan{Approved: "h", Phases: [{ID "P1", StopAfter: "pause"}]}'
              when: Load
              then: 'errors "queue: approved hash required"; "queue: no phases"; "queue: phase 0: empty id"; "queue: duplicate phase \"P1\""; "queue: phase \"P1\": stop_after \"pause\""'
            - given: 'the queue of example 1'
              when: 'Start(); Start() again; Done("P17", "P18")'
              then: 'P17, nil; error "queue: cannot start in state \"running\""; Outcome{Next: "P18"}, nil, State "queued", Index 1, Current() P18'
              ref: tests/fixtures/plan/queue-3.json
            - given: 'the queue after example 3 (queued at P18); Start()'
              when: 'Done("P17", "P19"); Done("P18", "P17"); Done("P18", "P19")'
              then: 'error "queue: phase_done for \"P17\" but running \"P18\""; error "queue: next \"P17\", plan says \"P19\""; Outcome{Next: "P19", Stop: "smoke"}, State "stopped", Reason "smoke", Index 2'
              ref: tests/fixtures/plan/queue-3.json
            - given: 'the stopped queue after example 4'
              when: 'Done("P19", ""); Continue(); Start(); Done("P19", "")'
              then: 'error "queue: phase_done for \"P19\" but running \"\""; P19, nil with State "queued" and Reason ""; P19, nil; Outcome{Stop: "end"}, State "done", Index 3, Current() false'
              ref: tests/fixtures/plan/queue-3.json
            - given: 'a running queue at P17; Stop("not pushed")'
              when: 'Stop, then Continue(), then Done("P17", "P18") without Start'
              then: 'State "stopped", Reason "not pushed", Index 0; Continue → P17 and State "queued"; Done → error "queue: phase_done for \"P17\" but running \"\""'
            - given: 'a done queue; a zero Queue{}'
              when: 'Continue(); Stop("x"); Current()'
              then: 'error "queue: nothing to continue (state \"done\")"; the done queue unchanged; the zero queue: Current false, Continue error "queue: nothing to continue (state \"\")"'
            - given: 'Plan{Approved: "abc", Phases: [{ID "P1", StopAfter: "operator", Caps: {Hours: 1}}]}, defaults {20, 2, 4}'
              when: 'Load; Start; Done("P1", "")'
              then: 'Caps {20, 1, 4}; Outcome{Stop: "end"} (no next phase wins over stop_after), State "done"'
    - name: claude
      description: >
        Package claude in claude/: the launch of the claude CLI process. The argument list and the MCP config file are
        pure; the process adapter wraps os/exec with line-delimited stdin/stdout and an exit channel, and declares the
        Fake the daemon's tests use. Imports os/exec, bufio, context, encoding/json, errors, fmt, io, os,
        path/filepath, strconv, sync, syscall.
      language: go
      functions:
        - name: Launch Args
          description: The argv of a claude session and the MCP config file it is given.
          behavior: >
            Declares in claude/args.go: `type Launch struct { Bin string; Dir string; SessionID string; Resume bool; BudgetUSD float64;
            Model string; MCPConfigPath string; Extra []string }`, `func Args(l Launch) []string`, `func Env(l Launch) []string`,
            `func MCPConfigJSON(url, token string) []byte` and `func WriteMCPConfig(dir, project, url, token string) (string, error)`.
            Env returns the environment entries added to the child process, always exactly
            []string{"CLAUDE_CODE_DISABLE_AUTO_MEMORY=1"} whatever the Launch holds (auto-memory is off in every phase session;
            it is not a configuration).
            Args returns, in this order: "-p", "--input-format", "stream-json", "--output-format", "stream-json", "--verbose",
            "--include-hook-events", "--permission-prompt-tool", "stdio", "--dangerously-skip-permissions", then "--resume",
            SessionID when Resume else "--session-id", SessionID; then "--max-budget-usd", strconv.FormatFloat(BudgetUSD, 'f', -1, 64)
            only when BudgetUSD > 0; then "--model", Model only when Model != ""; then "--mcp-config", MCPConfigPath only when
            it is not ""; then every Extra verbatim. Bin and Dir are not in the argv.
            MCPConfigJSON is the json.Marshal of {"mcpServers":{"morphd":{"type":"http","url":<url>,"headers":{"Authorization":"Bearer " + token}}}}
            (struct fields in that order) followed by "\n". WriteMCPConfig writes it to filepath.Join(dir, project + "-mcp.json")
            with mode 0o600 (dir created 0o700 when missing) and returns that path; a write error → ("", an error beginning
            "claude: mcp config: ").
          steps:
            - produces: argv
          examples:
            - given: 'Launch{Bin: "claude", Dir: "/home/morph/projects/demo", SessionID: "11111111-2222-3333-4444-555555555555", BudgetUSD: 30, MCPConfigPath: "/tmp/demo-mcp.json"}'
              when: Args
              then: 'exactly ["-p", "--input-format", "stream-json", "--output-format", "stream-json", "--verbose", "--include-hook-events", "--permission-prompt-tool", "stdio", "--dangerously-skip-permissions", "--session-id", "11111111-2222-3333-4444-555555555555", "--max-budget-usd", "30", "--mcp-config", "/tmp/demo-mcp.json"]'
            - given: 'Launch{SessionID: "s-2", Resume: true, BudgetUSD: 12.5, Model: "opus", MCPConfigPath: "/x/p-mcp.json", Extra: []string{"--effort", "high"}}'
              when: Args
              then: 'the first ten entries as in example 1, then "--resume", "s-2", "--max-budget-usd", "12.5", "--model", "opus", "--mcp-config", "/x/p-mcp.json", "--effort", "high"'
            - given: 'Launch{SessionID: "s-3"} (no budget, no model, no config, no extra)'
              when: Args
              then: 'exactly the first ten entries then "--session-id", "s-3" — 12 entries'
            - given: 'the Launch of example 1; then Launch{} (every field zero); then the Launch of example 2 with Extra []string{"--effort", "high"}'
              when: Env
              then: 'each exactly []string{"CLAUDE_CODE_DISABLE_AUTO_MEMORY=1"} — one entry, never more, never affected by Extra'
            - given: 'url "http://127.0.0.1:7080/mcp/demo/session", token "tok-1"'
              when: MCPConfigJSON
              then: 'exactly {"mcpServers":{"morphd":{"type":"http","url":"http://127.0.0.1:7080/mcp/demo/session","headers":{"Authorization":"Bearer tok-1"}}}} + "\n"'
            - given: 'dir := filepath.Join(t.TempDir(), "mcp") (missing), project "demo", url "http://127.0.0.1:7181/mcp/demo/session", token "tok-2"'
              when: WriteMCPConfig
              then: 'path == filepath.Join(dir, "demo-mcp.json"), error nil; the file holds MCPConfigJSON(url, token); its mode & 0o777 is 0o600; the directory mode & 0o777 is 0o700'
            - given: 'dir := testhelp.WriteFile(t, "f", "x") (a regular file as dir)'
              when: WriteMCPConfig
              then: '("", an error beginning "claude: mcp config: ")'
        - name: Process
          description: A running claude process with line-delimited stdin and stdout, its exit status, and the Fake.
          behavior: >
            Declares in claude/process.go: `type ExitStatus struct { Code int; Stderr string }`,
            `type Process interface { Write(line []byte) error; Lines() <-chan []byte; Exit() <-chan ExitStatus; Stop() error; Kill() error; PID() int }`,
            `var ErrExited = errors.New("claude: process exited")`,
            `func Start(ctx context.Context, bin string, args []string, dir string, env []string) (Process, error)` and the
            fake: `type Fake struct` (unexported fields), `func NewFake() *Fake`, `func (f *Fake) Emit(line []byte)`,
            `func (f *Fake) Written() [][]byte`, `func (f *Fake) Finish(code int)`, `func (f *Fake) Killed() bool`, and *Fake
            implements Process (PID 4242).
            Start runs exec.CommandContext(ctx, bin, args...) with Dir = dir, Env = os.Environ() + env, a stdin pipe, a stdout
            pipe read by a goroutine with a bufio.Scanner whose buffer allows lines up to 16 MiB, each line (without the
            newline, empty lines skipped) sent on Lines(); stderr collected (the last 4096 bytes kept). A start failure →
            (nil, an error beginning "claude: start "). When the process exits: Lines() is closed, then one ExitStatus{Code:
            the exit code, or -1 when killed by a signal, Stderr: the kept bytes} is sent on Exit() (a buffered channel of 1)
            and Exit() closed. Write appends nothing (the caller gives the newline) and writes under a mutex; after the exit
            it returns ErrExited. Stop closes stdin (the CLI exits on EOF). Kill sends SIGKILL. PID is the OS pid.
            Fake: Emit delivers a line on Lines(); Written returns a copy of every Write in order; Finish(code) closes Lines()
            and delivers ExitStatus{Code: code}; Write after Finish → ErrExited; Kill sets Killed and, if not finished,
            Finish(-1); Stop finishes with 0 if not finished.
          steps:
            - produces: ExitStatus
          examples:
            - given: 'bin := a script written under t.TempDir() with mode 0o755: "#!/bin/sh\necho ''{\"type\":\"system\",\"subtype\":\"init\"}''\ncat\nexit 4\n"; p, err := Start(ctx, bin, nil, t.TempDir(), nil)'
              when: 'first <-p.Lines(); p.Write([]byte("{\"type\":\"user\"}\n")); next <-p.Lines(); p.Stop(); <-p.Exit()'
              then: 'err nil; first line exactly {"type":"system","subtype":"init"}; the next line exactly {"type":"user"}; ExitStatus{Code: 4, Stderr: ""}; Lines() closed; p.PID() > 0'
            - given: 'the script "#!/bin/sh\necho oops >&2\nexit 2\n"'
              when: 'Start, then <-p.Exit()'
              then: 'ExitStatus{Code: 2, Stderr: "oops\n"}; a Write after it → ErrExited'
            - given: 'the script "#!/bin/sh\nsleep 30\n"'
              when: 'Start; p.Kill(); <-p.Exit() within 2 s'
              then: 'ExitStatus.Code -1'
            - given: 'Start(ctx, "/nonexistent/claude", nil, t.TempDir(), nil); Start(ctx, "sh", nil, "/nonexistent/dir", nil)'
              when: Start
              then: 'each (nil, an error beginning "claude: start ")'
            - given: 'the script "#!/bin/sh\nhead -c 70000 /dev/zero | tr ''\\0'' x; echo\necho short\n"'
              when: 'Start; the two lines from Lines()'
              then: 'the first line has length 70000 (longer than bufio''s 64 KiB default), the second is "short"'
            - given: 'f := NewFake(); f.Emit([]byte(`{"type":"x"}`)); f.Write([]byte("a\n")); f.Write([]byte("b\n")); f.Finish(0)'
              when: 'read Lines() to the close; Written(); <-f.Exit(); f.Write([]byte("c\n")); f.Killed()'
              then: 'one line {"type":"x"} then closed; Written [][]byte{"a\n", "b\n"}; ExitStatus{Code: 0}; ErrExited; false'
            - given: 'f := NewFake(); f.Kill()'
              when: '<-f.Exit(); Killed(); PID()'
              then: 'ExitStatus{Code: -1}; true; 4242'
    - name: github
      description: >
        Package github in github/: the repository URL forms, the clone URL with a token and the reachability check
        through an injected Do. Imports net/http, net/url, encoding/json, io, strings, fmt, context, time.
      language: go
      functions:
        - name: Repo Access
          description: Parse a GitHub repository URL, build the credential forms and check that a token reaches the repo with push access.
          behavior: >
            Declares in github/access.go: `type Access struct { Checked bool `json:"checked"`; Reachable bool `json:"reachable"`; Push bool `json:"push"`;
            Reason string `json:"reason"`; CheckedAt time.Time `json:"checked_at"` }`, `func Parse(repoURL string) (owner, repo string, err error)`,
            `func CredentialLine(token string) string`, and `func Check(ctx context.Context, do func(*http.Request) (*http.Response, error), token, repoURL string, now time.Time) Access`.
            Parse accepts "https://github.com/<owner>/<repo>", the same with a ".git" suffix or a trailing "/", and
            "git@github.com:<owner>/<repo>.git"; owner and repo are non-empty and hold no "/"; anything else → ("", "",
            error "github: not a github repository url: " + repoURL). CredentialLine = "https://x-access-token:" + token + "@github.com\n".
            Check: token "" → Access{Checked: true, Reason: "no token", CheckedAt: now}; Parse fails → {Checked: true, Reason:
            that error's text, CheckedAt: now}; else GET https://api.github.com/repos/<owner>/<repo> with headers Authorization
            "Bearer " + token, Accept "application/vnd.github+json", User-Agent "morphd"; the body is read and closed; by status:
            200 → Reachable true, Push = permissions.push of the JSON body (false when absent), Reason ""; 401 → Reason "401 bad
            credentials"; 403 → "403 forbidden"; 404 → "404 not found or no access"; any other → "<status> unexpected"; Do
            error → Reason "network: " + err.Error() with the token replaced by "***". Checked is always true, CheckedAt = now.
          steps:
            - produces: Access
          examples:
            - given: '"https://github.com/VasyaLutiy/MorphStudio"; "https://github.com/VasyaLutiy/MorphStudio.git"; "https://github.com/o/r/"; "git@github.com:o/r.git"'
              when: Parse
              then: '("VasyaLutiy", "MorphStudio", nil); the same; ("o", "r", nil); ("o", "r", nil)'
            - given: '"https://gitlab.com/o/r"; "https://github.com/o"; "github.com/o/r"; ""'
              when: Parse
              then: 'each error "github: not a github repository url: " + the input'
            - given: 'token "ghp_abc"'
              when: CredentialLine
              then: 'exactly "https://x-access-token:ghp_abc@github.com\n"'
            - given: 'do := a recorder answering 200 with body {"full_name":"o/r","permissions":{"admin":false,"push":true,"pull":true}}; Check(ctx, do, "ghp_abc", "https://github.com/o/r", 2026-10-08T15:00:00Z)'
              when: Check
              then: 'Access{Checked: true, Reachable: true, Push: true, Reason: "", CheckedAt: 15:00:00Z}; the request: GET https://api.github.com/repos/o/r, Authorization "Bearer ghp_abc", Accept "application/vnd.github+json", User-Agent "morphd"'
            - given: 'do answering 200 with body {"permissions":{"push":false}}; then {"full_name":"o/r"} (no permissions)'
              when: Check
              then: 'Reachable true, Push false (both)'
            - given: 'do answering 401; 403; 404; 500 (any body)'
              when: Check
              then: 'Reachable false, Push false, Reasons "401 bad credentials", "403 forbidden", "404 not found or no access", "500 unexpected"'
            - given: 'Check(ctx, do, "", "https://github.com/o/r", now); Check(ctx, do, "t", "https://gitlab.com/o/r", now)'
              when: Check
              then: '{Checked true, Reason "no token"} and do not called; {Checked true, Reason "github: not a github repository url: https://gitlab.com/o/r"} and do not called'
            - given: 'do returning errors.New("Get \"https://api.github.com/repos/o/r\": dial tcp: refused ghp_abc")'
              when: 'Check(ctx, do, "ghp_abc", "https://github.com/o/r", now)'
              then: 'Reason exactly "network: Get \"https://api.github.com/repos/o/r\": dial tcp: refused ***"'
    - name: bootstrap
      description: >
        Package bootstrap in bootstrap/: project_create — a new project folder from `morph init`, its git repository,
        the first push to the user's empty GitHub repository. Every command goes through runner.Runner. Imports
        morphstudio/runner, morphstudio/github, context, fmt, os, path/filepath, regexp, strings.
      language: go
      functions:
        - name: Project Create
          description: Validate the request, run the create sequence through the runner, report every step; push once the token is there.
          behavior: >
            Declares in bootstrap/create.go: `type Spec struct { Name string; Language string; RepoURL string; ProjectsDir string;
            CredentialsFile string; MorphBin string }`, `type Report struct { Dir string `json:"dir"`; Steps []string `json:"steps"` }`,
            `func Create(ctx context.Context, r runner.Runner, s Spec) (Report, error)` and
            `func FirstPush(ctx context.Context, r runner.Runner, dir string) (bool, error)`.
            FirstPush (called when the GitHub token arrives): in dir, env []string{"GIT_TERMINAL_PROMPT=0"}: git rev-parse
            --verify -q origin/main → Code 0 → (false, nil) (already pushed); else git push -q -u origin main → Code 0 →
            (true, nil); a non-zero Code → (false, "bootstrap: push failed (exit <code>): " + trimmed Stderr); a Run error →
            (false, "bootstrap: push: " + err.Error()).
            Create has eight steps (the push is FirstPush's).
            Checks first, in this order: Name matches ^[a-z0-9][a-z0-9-]{0,39}$ else "bootstrap: bad project name \"<name>\"";
            Language is "typescript", "python" or "go" else "bootstrap: unknown language \"<l>\""; github.Parse(RepoURL) ok
            else its error; MorphBin not "" else "bootstrap: morph binary not configured"; dir := filepath.Join(ProjectsDir, Name)
            must not exist (os.Stat) else "bootstrap: directory exists: <dir>". Then the commands, each through r.Run with
            env []string{"GIT_TERMINAL_PROMPT=0"}, in this order and with exactly these arguments:
            1. in ProjectsDir: <MorphBin> init --root <dir> --name <Name> --language <Language>, and for Language "go" two
               more arguments --module <Name> (the Go template's module path); morph init refuses a non-empty target, a
               .git entry too, which is why git init comes after it
            2. in dir: git init -q -b main
            3. in dir: git config credential.helper "store --file=<CredentialsFile>" (one argument holding the space)
            4. in dir: git config user.name morphd
            5. in dir: git config user.email morphd@localhost
            6. in dir: git remote add origin <RepoURL>
            7. in dir: git add -A
            8. in dir: git commit -q -m "morph init: <Name> (<Language>)"
            Report.Steps gets runner.Key(name, args...) of every command run. A Run error → (the report so far, "bootstrap:
            step <n>: " + err.Error()); a non-zero Code → (the report so far, "bootstrap: step <n> failed (exit <code>): " +
            strings.TrimSpace(Stderr)). Success → (Report{Dir: dir, Steps: the eight keys}, nil). The token is never an
            argument: the credentials file carries it.
          steps:
            - uses: runner
            - uses: github
            - produces: Report
          examples:
            - given: 'f := &runner.Fake{} (every call Code 0); Create(ctx, f, Spec{Name: "demo", Language: "go", RepoURL: "https://github.com/o/demo", ProjectsDir: t.TempDir(), CredentialsFile: "/st/demo/git-credentials", MorphBin: "/usr/local/bin/morph"})'
              when: Create
              then: 'error nil; Report.Dir == filepath.Join(ProjectsDir, "demo"); Steps exactly ["/usr/local/bin/morph init --root <dir> --name demo --language go --module demo", "git init -q -b main", "git config credential.helper store --file=/st/demo/git-credentials", "git config user.name morphd", "git config user.email morphd@localhost", "git remote add origin https://github.com/o/demo", "git add -A", "git commit -q -m morph init: demo (go)"]; f.Calls[0].Dir == ProjectsDir and f.Calls[1..7].Dir == dir; f.Calls[2].Args == ["config", "credential.helper", "store --file=/st/demo/git-credentials"]'
            - given: 'Spec{Name: "Demo"}; Name "demo", Language "rust"; Language "go", RepoURL "https://gitlab.com/o/r"; RepoURL ok, MorphBin ""'
              when: Create
              then: 'errors "bootstrap: bad project name \"Demo\""; "bootstrap: unknown language \"rust\""; "github: not a github repository url: https://gitlab.com/o/r"; "bootstrap: morph binary not configured"; the fake runner has no Calls'
            - given: 'ProjectsDir holding an existing directory demo; a valid Spec with Name "demo"'
              when: Create
              then: 'error "bootstrap: directory exists: " + dir; no Calls'
            - given: 'f := &runner.Fake{Script: {"git commit -q -m morph init: demo (go)": {Code: 1, Stderr: "nothing to commit\n"}}}'
              when: 'Create with a valid Spec (ProjectsDir a fresh t.TempDir(), MorphBin "morph", Name "demo", Language "go")'
              then: 'error "bootstrap: step 8 failed (exit 1): nothing to commit"; Report.Steps has 8 entries; Report.Dir == dir'
            - given: 'f := &runner.Fake{Script: {"git rev-parse --verify -q origin/main": {Code: 1}, "git push -q -u origin main": {Code: 0}}}; FirstPush(ctx, f, "/p/demo"); then with "git rev-parse --verify -q origin/main": {Stdout: "aaa111\n", Code: 0}; then with the push scripted {Code: 1, Stderr: "error: failed to push some refs\n"}'
              when: FirstPush
              then: '(true, nil) with f.Calls keys ["git rev-parse --verify -q origin/main", "git push -q -u origin main"], both Dir "/p/demo" and env ["GIT_TERMINAL_PROMPT=0"]; then (false, nil) with one call; then (false, error "bootstrap: push failed (exit 1): error: failed to push some refs")'
            - given: 'f := &runner.Fake{Errors: {"morph init --root <dir> --name demo --language python": "runner: exec: \"morph\": executable file not found"}} (the key built with the real dir; no --module for python)'
              when: 'Create with Language "python", MorphBin "morph"'
              then: 'error "bootstrap: step 1: runner: exec: \"morph\": executable file not found"; Steps has 1 entry; no git call made'
            - given: 'Name "a-1-b" with Language "typescript" and the runner of example 1'
              when: Create
              then: 'nil; Steps[0] == "morph init --root <dir> --name a-1-b --language typescript" (no --module outside go); Steps[7] == "git commit -q -m morph init: a-1-b (typescript)"; every Run call had env exactly []string{"GIT_TERMINAL_PROMPT=0"}'
    - name: registry
      description: >
        Package registry in registry/: the project registry file, the per-project state file and the secret files
        (GitHub token, git credentials, session token) with their modes. Imports morphstudio/queue, os, encoding/json,
        errors, fmt, path/filepath, regexp, sort, sync, time.
      language: go
      functions:
        - name: Project Registry
          description: The registry of projects in one JSON file, rewritten whole and atomically, and a JSON state blob per project.
          behavior: >
            Declares in registry/registry.go: `var ErrNotFound = errors.New("project not found")`, `var ErrExists = errors.New("project exists")`,
            `var ErrBadName = errors.New("bad project name")`, `var ErrNoState = errors.New("no state")`,
            `type Project struct { Name string `json:"name"`; Language string `json:"language"`; RepoURL string `json:"repo_url"`; Dir string `json:"dir"`;
            Caps queue.Caps `json:"caps"`; CreatedAt time.Time `json:"created_at"` }`, `type Registry struct` (unexported fields),
            `func Open(base string) (*Registry, error)`, `func (r *Registry) Base() string`, `func (r *Registry) Add(p Project) error`,
            `func (r *Registry) Get(name string) (Project, error)`, `func (r *Registry) List() []Project`,
            `func (r *Registry) SaveState(name string, v any) error` and `func (r *Registry) LoadState(name string, v any) error`.
            Open creates base (0o700) when missing and reads base/projects.json: missing → empty; not a JSON array of
            Project → (nil, an error beginning "registry: read "). Add: Name must match ^[a-z0-9][a-z0-9-]{0,39}$ else
            ErrBadName; a stored name → ErrExists; else stored and the whole list written as a JSON array sorted by Name
            (json.MarshalIndent with two spaces, an empty list as []) to a temporary file in base then renamed onto
            projects.json. Get → the project or (Project{}, ErrNotFound). List → a new slice sorted by Name (empty non-nil).
            SaveState writes json.MarshalIndent(v) to base/<name>/state.json (the directory created 0o700; unknown name →
            ErrNotFound) by temporary file and rename; LoadState unmarshals it into v, missing file → ErrNoState, unknown
            name → ErrNotFound. Every error of the file system is returned as is (never one of the sentinels). Values are
            copies.
          steps:
            - produces: Project
          examples:
            - given: 'base := filepath.Join(t.TempDir(), "state") (missing)'
              when: 'Open(base); List(); Get("demo"); Base()'
              then: 'a non-nil *Registry, nil; the directory exists; []Project{} (non-nil, empty); (Project{}, ErrNotFound); base'
            - given: 'the registry of example 1; Add({Name "zeta", Language "go", RepoURL "https://github.com/o/zeta", Dir "/p/zeta", Caps {30, 3, 5}, CreatedAt 2026-10-08T15:00:00Z}); Add({Name "alpha", Language "python", …, CreatedAt 2026-10-08T15:01:00Z})'
              when: 'Add twice, then List, then decode base/projects.json'
              then: 'both nil; List names in order "alpha", "zeta"; the file decodes (json.Unmarshal into []Project) to exactly List(); the directory base holds only projects.json'
            - given: 'the registry after example 2'
              when: 'Add({Name "alpha"}); Add({Name "Alpha"}); Add({Name "-x"}); Add({Name 41 × "a"})'
              then: 'ErrExists; ErrBadName; ErrBadName; ErrBadName; List still 2'
            - given: 'the file written by example 2, Open(base) again'
              when: 'List; Get("zeta")'
              then: 'equal field by field to the first registry''s List (times round-trip through JSON); Get returns the zeta project'
            - given: 'the registry after example 2; type S struct{ N int `json:"n"` }'
              when: 'SaveState("alpha", S{7}); LoadState("alpha", &out); LoadState("zeta", &out2); SaveState("nope", S{1}); LoadState("nope", &out3)'
              then: 'nil; nil and out == S{7}; ErrNoState; ErrNotFound; ErrNotFound; base/alpha/state.json exists with mode & 0o777 == 0o600 and base/alpha mode & 0o777 == 0o700'
            - given: 'base/projects.json holding the text {not json'
              when: Open
              then: '(nil, an error beginning "registry: read ")'
            - given: 'the registry of example 1'
              when: 'p := List(); append to p; g, _ := Get("alpha") after Add; g.Name = "changed"; Get("alpha")'
              then: 'the registry is unchanged by writes to returned values'
        - name: Secret Files
          description: Secrets stored per project as files of mode 0600 that are never returned by the API.
          behavior: >
            Declares in registry/secrets.go, over the Registry of registry/registry.go:
            `var ErrNoSecret = errors.New("no secret")`, `var ErrEmptySecret = errors.New("empty secret")`,
            `var SecretKinds = []string{"github-token", "git-credentials", "session-token"}`,
            `func (r *Registry) SecretPath(name, kind string) string` = filepath.Join(base, name, kind),
            `func (r *Registry) PutSecret(name, kind, value string) error`, `func (r *Registry) HasSecret(name, kind string) bool`,
            `func (r *Registry) ReadSecret(name, kind string) (string, error)` and `func (r *Registry) DeleteSecret(name, kind string) error`.
            PutSecret: unknown project → ErrNotFound; kind not in SecretKinds → fmt.Errorf("registry: unknown secret kind %q", kind);
            value "" → ErrEmptySecret; else the project directory is created (0o700) and value is written by a temporary
            file (0o600) in that directory renamed onto SecretPath; the written file has mode 0o600 even when it existed
            with another mode. HasSecret: the file exists. ReadSecret: the content verbatim; missing → ("", ErrNoSecret);
            unknown project → ErrNotFound. DeleteSecret removes the file; missing → nil.
          steps:
            - calls: Project Registry
            - produces: secret file
          examples:
            - given: 'a registry with project "demo" (Add); PutSecret("demo", "github-token", "ghp_abc")'
              when: 'PutSecret; HasSecret; ReadSecret; os.Stat(SecretPath("demo", "github-token"))'
              then: 'nil; true; ("ghp_abc", nil); mode & 0o777 == 0o600; the directory base/demo mode & 0o777 == 0o700; the directory holds only github-token'
            - given: 'the registry of example 1'
              when: 'PutSecret("demo", "git-credentials", "https://x-access-token:ghp_abc@github.com\n"); ReadSecret of it'
              then: 'nil; exactly "https://x-access-token:ghp_abc@github.com\n" (the newline kept)'
            - given: 'the registry of example 1'
              when: 'PutSecret("nope", "github-token", "x"); PutSecret("demo", "password", "x"); PutSecret("demo", "session-token", "")'
              then: 'ErrNotFound; error text "registry: unknown secret kind \"password\""; ErrEmptySecret; the directory base/demo still holds only github-token'
            - given: 'the registry of example 1; os.Chmod(SecretPath("demo", "github-token"), 0o644); PutSecret("demo", "github-token", "ghp_new")'
              when: 'PutSecret then Stat and ReadSecret'
              then: 'mode & 0o777 == 0o600 again; "ghp_new"'
            - given: 'the registry of example 1'
              when: 'HasSecret("demo", "session-token"); ReadSecret("demo", "session-token"); ReadSecret("nope", "github-token"); DeleteSecret("demo", "session-token")'
              then: 'false; ("", ErrNoSecret); ("", ErrNotFound); nil'
            - given: 'the registry of example 1 after PutSecret("demo", "session-token", "tok-9")'
              when: 'DeleteSecret("demo", "session-token"); HasSecret'
              then: 'nil; false'
    - name: gitrules
      description: >
        Package gitrules in gitrules/: the git rules of a phase — what morphd checks before it starts a session and
        before it accepts phase_done — over runner.Runner, so the tests script git's answers. morphd itself never
        commits, merges or pushes. Imports morphstudio/runner, context, fmt, os, path/filepath, strings.
      language: go
      functions:
        - name: Phase Start Check
          description: fetch, then decide fresh, resume, pull or diverged from main and origin/main.
          behavior: >
            Declares in gitrules/start.go: `type Start struct { Mode string `json:"mode"`; Branch string `json:"branch"`; Local string `json:"local"`;
            Remote string `json:"remote"`; Reason string `json:"reason"` }` and `func StartCheck(ctx context.Context, r runner.Runner, dir string) Start`.
            Mode is one of "fresh", "resume", "diverged", "error". Commands run in dir with env nil, in this order, each
            through r.Run; a Run error or a non-zero Code of the commands marked (!) → Mode "error", Reason "<key> failed: "
            + strings.TrimSpace(Stderr) (or the error text):
            1 (!) git fetch -q origin; 2 (!) git rev-parse --abbrev-ref HEAD → Branch (trimmed); 3 (!) git rev-parse HEAD → Local;
            4 (!) git rev-parse origin/main → Remote; 5 (!) git status --porcelain → the dirty paths (non-empty lines).
            Then: Branch != "main" → Mode "resume", Reason "on branch <branch>"; dirty paths → "resume", "dirty tree (<n> paths)";
            Local == Remote → "fresh", Reason ""; else 6 git merge-base --is-ancestor origin/main HEAD: Code 0 → "resume",
            "local ahead of origin/main"; else 7 git merge-base --is-ancestor HEAD origin/main: Code 0 → 8 (!) git pull -q
            --ff-only → "fresh", Reason "pulled to <remote>", Local = Remote; Code of 7 not 0 → "diverged", Reason "local
            <local> and origin/main <remote> diverged". No command after the first failure.
          steps:
            - uses: runner
            - produces: Start
          examples:
            - given: 'f := &runner.Fake{Script: {"git rev-parse --abbrev-ref HEAD": {Stdout: "main\n"}, "git rev-parse HEAD": {Stdout: "aaa111\n"}, "git rev-parse origin/main": {Stdout: "aaa111\n"}, "git status --porcelain": {Stdout: ""}}}'
              when: 'StartCheck(ctx, f, "/p")'
              then: 'Start{Mode: "fresh", Branch: "main", Local: "aaa111", Remote: "aaa111", Reason: ""}; f.Calls keys in order "git fetch -q origin", "git rev-parse --abbrev-ref HEAD", "git rev-parse HEAD", "git rev-parse origin/main", "git status --porcelain" (5 calls, every Dir "/p")'
            - given: 'the scripts of example 1 but HEAD "bbb222" and "git merge-base --is-ancestor origin/main HEAD": {Code: 0}'
              when: StartCheck
              then: 'Mode "resume", Reason "local ahead of origin/main", Local "bbb222", Remote "aaa111"; 6 calls'
            - given: 'HEAD "aaa111", origin/main "ccc333", "git merge-base --is-ancestor origin/main HEAD": {Code: 1}, "git merge-base --is-ancestor HEAD origin/main": {Code: 0}, "git pull -q --ff-only": {Code: 0}'
              when: StartCheck
              then: 'Mode "fresh", Reason "pulled to ccc333", Local "ccc333", Remote "ccc333"; 8 calls, the last key "git pull -q --ff-only"'
            - given: 'as example 3 but both merge-base calls Code 1'
              when: StartCheck
              then: 'Mode "diverged", Reason "local aaa111 and origin/main ccc333 diverged"; 7 calls'
            - given: 'the scripts of example 1 but "git status --porcelain": {Stdout: " M docs/TASK_P18.md\n?? decks/p18/\n"}'
              when: StartCheck
              then: 'Mode "resume", Reason "dirty tree (2 paths)"; 5 calls'
            - given: 'the scripts of example 1 but "git rev-parse --abbrev-ref HEAD": {Stdout: "morph/20261008-083312\n"}'
              when: StartCheck
              then: 'Mode "resume", Reason "on branch morph/20261008-083312", Branch "morph/20261008-083312"; 5 calls (the status is still read)'
            - given: '&runner.Fake{Script: {"git fetch -q origin": {Code: 128, Stderr: "fatal: unable to access ''https://github.com/o/r/'': Could not resolve host\n"}}}'
              when: StartCheck
              then: 'Mode "error", Reason "git fetch -q origin failed: fatal: unable to access ''https://github.com/o/r/'': Could not resolve host"; 1 call'
            - given: '&runner.Fake{Errors: {"git fetch -q origin": "runner: exec: \"git\": executable file not found"}}'
              when: StartCheck
              then: 'Mode "error", Reason "git fetch -q origin failed: runner: exec: \"git\": executable file not found"'
        - name: Phase End Check
          description: After phase_done — main pushed, tree clean, no run branch left unmerged, the MEASURE row present.
          behavior: >
            Declares in gitrules/end.go: `type End struct { OK bool `json:"ok"`; Local string `json:"local"`; Remote string `json:"remote"`; Problems []string `json:"problems"` }`
            and `func EndCheck(ctx context.Context, r runner.Runner, dir, phase string) End`. Commands in dir, env nil, in this
            order; a Run error or non-zero Code → one problem "<key> failed: <trimmed stderr or error text>" and the check
            stops there (OK false):
            1 git fetch -q origin; 2 git rev-parse --abbrev-ref HEAD; 3 git rev-parse HEAD → Local; 4 git rev-parse origin/main
            → Remote; 5 git status --porcelain; 6 git branch --list morph/* --no-merged main.
            Problems, in this order, each only when it holds: "on branch <b>, not main"; "not pushed: HEAD <local>, origin/main
            <remote>" when they differ; "dirty tree (<n> paths)"; "unmerged run branch <name>" for every non-empty line of 6
            (trimmed of spaces and a leading "* "), in order; then docs/MEASURE.md read with os.ReadFile from dir: missing →
            "docs/MEASURE.md missing"; else a row is a line beginning with "|" whose first cell (between the first two "|",
            trimmed) equals phase or begins with phase + " "; none → "no MEASURE row for <phase>". OK = no problems;
            Problems is a non-nil empty slice when none.
          steps:
            - uses: runner
            - produces: End
          examples:
            - given: 'dir := t.TempDir() with docs/MEASURE.md copied from tests/fixtures/git/measure.md (rows "| P16 primer-go |…" and "| P17 debt |…"); f := the fake of Phase Start Check example 1 plus "git branch --list morph/* --no-merged main": {Stdout: ""}'
              when: 'EndCheck(ctx, f, dir, "P17")'
              then: 'End{OK: true, Local: "aaa111", Remote: "aaa111", Problems: []string{}}; 6 calls with keys in the order of the behaviour; the fake''s Calls[5].Args == ["branch", "--list", "morph/*", "--no-merged", "main"]'
              ref: tests/fixtures/git/measure.md
            - given: 'as example 1 but HEAD "bbb222"'
              when: EndCheck
              then: 'OK false, Problems exactly ["not pushed: HEAD bbb222, origin/main aaa111"]'
              ref: tests/fixtures/git/measure.md
            - given: 'as example 1 but phase "P18"'
              when: EndCheck
              then: 'OK false, Problems ["no MEASURE row for P18"]'
              ref: tests/fixtures/git/measure.md
            - given: 'as example 1 but with HEAD "bbb222", status " M a.go\n", the branch list "  morph/20261008-141116\n* morph/20261008-152814\n", and no docs/MEASURE.md in dir'
              when: EndCheck
              then: 'Problems exactly ["not pushed: HEAD bbb222, origin/main aaa111", "dirty tree (1 paths)", "unmerged run branch morph/20261008-141116", "unmerged run branch morph/20261008-152814", "docs/MEASURE.md missing"]'
            - given: 'as example 1 but the branch "morph/x" (abbrev-ref)'
              when: EndCheck
              then: 'Problems begins with "on branch morph/x, not main"; OK false'
              ref: tests/fixtures/git/measure.md
            - given: '&runner.Fake{Script: {"git fetch -q origin": {Code: 1, Stderr: "fatal: not a git repository\n"}}}'
              when: EndCheck
              then: 'OK false, Problems exactly ["git fetch -q origin failed: fatal: not a git repository"], Local "" ; 1 call'
            - given: 'a MEASURE.md whose rows are "| P17 | …" (the id alone in the cell) and "| P170 debt | …"; phase "P17"; the fake of example 1'
              when: EndCheck
              then: 'OK true (the exact cell matches; "P170 debt" would not match "P17" alone — checked with phase "P17" against a file holding only the P170 row: Problems ["no MEASURE row for P17"])'
    - name: control
      description: >
        Package control in control/: the one control surface the HTTP API and the MCP server both call — the views
        the PM sees, the Control interface and its error codes. Pure. Imports morphstudio/queue, morphstudio/github,
        morphstudio/eventlog, morphstudio/session, encoding/json, errors, net/http, time.
      language: go
      dataObjects:
        - name: Status
          description: The answer of `status`.
          schema: "type Status struct { State, Phase string; Minutes int; CostUSD float64; FiveHour, SevenDay int; SessionID string; Queue QueueView; Repo github.Access; Stop *Stop }"
      functions:
        - name: Control Contract
          description: The views, the Control interface and the mapping of errors to HTTP status and code.
          behavior: >
            Declares in control/control.go, exactly, one field per line:
            `type QueueView struct { State string `json:"state"`; Approved string `json:"approved"`; Index int `json:"index"`; Phases int `json:"phases"`; Current string `json:"current"`; Reason string `json:"reason"` }`;
            `type Stop struct { Kind string `json:"kind"`; Phase string `json:"phase"`; Reason string `json:"reason"`; IssueURL string `json:"issue_url,omitempty"`; At time.Time `json:"at"` }`;
            `type Status struct { State string `json:"state"`; Phase string `json:"phase"`; Minutes int `json:"minutes"`; CostUSD float64 `json:"cost_usd"`;
            FiveHour int `json:"five_hour"`; SevenDay int `json:"seven_day"`; SessionID string `json:"session_id"`; Queue QueueView `json:"queue"`;
            Repo github.Access `json:"repo"`; Stop *Stop `json:"stop,omitempty"` }`;
            `type Question struct { RequestID string `json:"request_id"`; Text string `json:"text"`; Header string `json:"header"`; Options []string `json:"options"`; AskedAt time.Time `json:"asked_at"` }`;
            `type Usage struct { FiveHour int `json:"five_hour"`; SevenDay int `json:"seven_day"`; FiveHourResetsAt int64 `json:"five_hour_resets_at"`; SevenDayResetsAt int64 `json:"seven_day_resets_at"`;
            SessionCostUSD float64 `json:"session_cost_usd"`; StretchCostUSD float64 `json:"stretch_cost_usd"`; LimitsAt time.Time `json:"limits_at"` }`;
            `type Events struct { Entries []eventlog.Entry `json:"entries"`; Last int64 `json:"last"` }`;
            `type ProjectView struct { Name string `json:"name"`; Language string `json:"language"`; RepoURL string `json:"repo_url"`; State string `json:"state"`; CreatedAt time.Time `json:"created_at"` }`;
            `type Milestone struct { Kind string `json:"kind"`; Headline string `json:"headline"`; Numbers string `json:"numbers"` }`;
            `type TokenResult struct { Access github.Access `json:"access"`; Pushed bool `json:"pushed"`; PushError string `json:"push_error,omitempty"` }`;
            `type Control interface { Projects() []ProjectView; CreateProject(ctx context.Context, name, language, repoURL string) (ProjectView, error);
            Status(project string) (Status, error); Events(project string, since int64, max int) (Events, error);
            Order(project, text string) (session.OrderResult, error); Pending(project string) (*Question, error); Answer(project string, option int) error;
            Interrupt(project string) error; Usage(project string) (Usage, error); Restart(project string, force bool) error;
            PlanLoad(project string, plan queue.Plan) (QueueView, error); Continue(project string) error; StopCheck(project string) (*Stop, error);
            PutGithubToken(ctx context.Context, project, token string) (TokenResult, error); PhaseDone(project, sessionToken, phase, next string) error;
            WaitOperator(project, sessionToken, kind, reason, issueURL string) error; Milestone(project, sessionToken string, m Milestone) error }`;
            the errors `ErrUnknownProject` ("unknown project"), `ErrNoSession` ("no session running"), `ErrBusy` ("session is busy"),
            `ErrNotWaiting` ("not waiting"), `ErrBadToken` ("session token mismatch"), `ErrBadInput` ("bad input"), `ErrExists`
            ("project exists") as errors.New of the texts, and `ErrNoQuestion = session.ErrNoQuestion`, `ErrBadOption = session.ErrBadOption`,
            `ErrNotBusy = session.ErrNotBusy`; `func Percent(utilization float64) int` = int(utilization*100 + 0.5) clamped to 0..100;
            and `func Code(err error) (int, string)`: nil → (200, ""); errors.Is in this order: ErrUnknownProject → (404, "unknown_project"),
            ErrBadInput → (400, "bad_input"), ErrBadOption → (400, "bad_option"), ErrBadToken → (401, "bad_session_token"),
            ErrExists → (409, "exists"), ErrNoSession → (409, "no_session"), ErrBusy → (409, "busy"), ErrNoQuestion → (409, "no_question"),
            ErrNotBusy → (409, "not_busy"), ErrNotWaiting → (409, "not_waiting"); anything else → (500, "internal").
          steps:
            - uses: queue
            - uses: github
            - uses: eventlog
            - uses: session
            - produces: Status
          examples:
            - given: 'Status{State: "busy", Phase: "P18", Minutes: 37, CostUSD: 1.92, FiveHour: 22, SevenDay: 60, SessionID: "s-1", Queue: QueueView{State: "running", Approved: "7b31dfe", Index: 1, Phases: 3, Current: "P18"}, Repo: github.Access{Checked: true, Reachable: true, Push: true, CheckedAt: 2026-10-08T15:00:00Z}}'
              when: json.Marshal
              then: 'exactly {"state":"busy","phase":"P18","minutes":37,"cost_usd":1.92,"five_hour":22,"seven_day":60,"session_id":"s-1","queue":{"state":"running","approved":"7b31dfe","index":1,"phases":3,"current":"P18","reason":""},"repo":{"checked":true,"reachable":true,"push":true,"reason":"","checked_at":"2026-10-08T15:00:00Z"}} (no "stop" key)'
            - given: 'Status{State: "waiting", Stop: &Stop{Kind: "not_pushed", Phase: "P17", Reason: "not pushed: HEAD bbb222, origin/main aaa111", At: 2026-10-08T16:00:00Z}}'
              when: json.Marshal
              then: 'the output ends with ,"stop":{"kind":"not_pushed","phase":"P17","reason":"not pushed: HEAD bbb222, origin/main aaa111","at":"2026-10-08T16:00:00Z"}} and holds no "issue_url"'
            - given: 'Question{RequestID: "9f4ffa22-2676-4391-bfd9-bd7d16c3866c", Text: "Which option do you want: A or B?", Header: "A or B", Options: []string{"Option A", "Option B"}, AskedAt: 2026-10-08T13:09:08Z}'
              when: json.Marshal
              then: 'exactly {"request_id":"9f4ffa22-2676-4391-bfd9-bd7d16c3866c","text":"Which option do you want: A or B?","header":"A or B","options":["Option A","Option B"],"asked_at":"2026-10-08T13:09:08Z"}'
            - given: 'Percent(0.22); Percent(0.6); Percent(0.005); Percent(1.3); Percent(-0.1); Percent(0.995)'
              when: Percent
              then: '22; 60; 1; 100; 0; 100'
            - given: 'Code(nil); Code(ErrUnknownProject); Code(fmt.Errorf("wrap: %w", ErrBadOption)); Code(ErrBadToken); Code(ErrExists); Code(ErrNoSession); Code(ErrBusy); Code(ErrNoQuestion); Code(ErrNotBusy); Code(ErrNotWaiting); Code(ErrBadInput); Code(errors.New("disk full"))'
              when: Code
              then: '(200, ""); (404, "unknown_project"); (400, "bad_option"); (401, "bad_session_token"); (409, "exists"); (409, "no_session"); (409, "busy"); (409, "no_question"); (409, "not_busy"); (409, "not_waiting"); (400, "bad_input"); (500, "internal")'
            - given: 'ErrNoQuestion; ErrBadOption; ErrNotBusy'
              when: compared
              then: 'ErrNoQuestion == session.ErrNoQuestion, ErrBadOption == session.ErrBadOption, ErrNotBusy == session.ErrNotBusy (the same variables); var _ Control = (*nilControl)(nil) is not required — the interface has exactly 17 methods'
            - given: 'Usage{FiveHour: 22, SevenDay: 60, FiveHourResetsAt: 1791469200, SevenDayResetsAt: 1791853200, SessionCostUSD: 0.0064, StretchCostUSD: 5.2609, LimitsAt: 2026-10-08T13:09:03Z}'
              when: json.Marshal
              then: 'exactly {"five_hour":22,"seven_day":60,"five_hour_resets_at":1791469200,"seven_day_resets_at":1791853200,"session_cost_usd":0.0064,"stretch_cost_usd":5.2609,"limits_at":"2026-10-08T13:09:03Z"}'
    - name: supervisor
      description: >
        Package supervisor in supervisor/: the phase loop of one project as a pure machine — begin a phase, react to
        the git checks, phase_done, wait_operator, the PM's continue and restart, and the runtime guard (exit, limits,
        stall, caps). Every method returns the actions the daemon executes. Imports morphstudio/queue,
        morphstudio/gitrules, morphstudio/control, morphstudio/stream, errors, fmt, time.
      language: go
      dataObjects:
        - name: Loop Action
          description: What the daemon must do after a loop input.
          schema: "type Action struct { Kind string; Phase string; SessionID string; Resume bool; BudgetUSD float64; Line string; Milestone control.Milestone }  // Kind: start_check | spawn | first_line | end_check | kill | post | write"
      functions:
        - name: Phase Loop
          description: The state of one project's phase loop and the transitions the PM and the session drive.
          behavior: >
            Declares in supervisor/loop.go, exactly:
            `type Action struct { Kind string; Phase string; SessionID string; Resume bool; BudgetUSD float64; Line string; Milestone control.Milestone }`;
            `type Loop struct { Project string `json:"project"`; Queue queue.Queue `json:"queue"`; State string `json:"state"`; Phase string `json:"phase"`;
            SessionID string `json:"session_id"`; PhaseStartedAt time.Time `json:"phase_started_at"`; Resumes []time.Time `json:"resumes"`;
            Stop *control.Stop `json:"stop,omitempty"`; PausedUntil time.Time `json:"paused_until"`; StretchUSD float64 `json:"stretch_usd"`;
            SessionUSD float64 `json:"session_usd"`; LastEventAt time.Time `json:"last_event_at"`; Nudged bool `json:"nudged"`; Alerted bool `json:"alerted"` }`;
            `type Config struct { MaxResumesPerHour int; StallMinutes int; StretchUSD float64; UsageAlertPercent int }`;
            `var ErrPhaseMismatch = errors.New("phase mismatch")`;
            `func New(project string, q queue.Queue) *Loop` (State "idle"); `func (l *Loop) Begin(now time.Time) ([]Action, error)`;
            `func (l *Loop) StartChecked(s gitrules.Start, newID func() string, now time.Time) []Action`;
            `func (l *Loop) PhaseDone(phase, next string) ([]Action, error)`; `func (l *Loop) EndChecked(e gitrules.End, now time.Time) []Action`;
            `func (l *Loop) WaitOperator(kind, reason, issueURL string, now time.Time) []Action`;
            `func (l *Loop) Continue(now time.Time) ([]Action, error)`; `func (l *Loop) Restart(now time.Time) ([]Action, error)`.
            State is one of "idle", "starting", "running", "paused", "waiting". A post action is Action{Kind: "post", Milestone: {kind, headline, numbers}}.
            Begin: State must be "idle" or "waiting" and Queue.Start() must succeed (its error is returned, nothing changes);
            then Phase = that id, State "starting", Stop nil, Nudged false, Alerted false, SessionUSD 0, actions
            [{Kind "start_check", Phase}].
            StartChecked (State "starting"; any other state → nil): Mode "fresh" → SessionID = newID(), Resumes nil,
            PhaseStartedAt = now, LastEventAt = now, State "running", actions [{Kind "spawn", Phase, SessionID, Resume false,
            BudgetUSD = the current phase''s Caps.ClaudeUSD}, {Kind "first_line", Line "/morph-orchestrator " + Phase},
            {post start "<phase> started" numbers "session <id> · cap $<ClaudeUSD 'f' -1> · <Hours 'f' -1> h"}] (a Reason
            "pulled to …" appends " · " + Reason to the numbers); Mode "resume" → SessionID kept when non-empty else newID(),
            State "running", PhaseStartedAt = now, LastEventAt = now, actions [{spawn Resume true …}, {post start "<phase> resumed"
            numbers "session <id> · " + Reason}] (no first_line); Mode "diverged" or "error" → State "waiting", Stop =
            {Kind "git", Phase, Reason, At now}, Queue.Stop(Reason), actions [{post stop "<phase> not started: git" numbers Reason}].
            PhaseDone: State "running" or "paused" and phase == Phase → actions [{Kind "end_check", Phase}] (nothing else
            changes); otherwise (nil, fmt.Errorf("%w: phase_done %q while %s %q", ErrPhaseMismatch, phase, State, Phase)).
            EndChecked (State "running" or "paused"; else nil): e.OK → StretchUSD += SessionUSD; out, err := Queue.Done(Phase,
            next) where next is the id after the current one in Queue.Phases (or "") — err is impossible here and ignored;
            actions start with [{Kind "kill"}]; then by out: Next and no Stop → the loop begins that phase at once: Phase =
            out.Next, State "starting", SessionID "", actions += [{Kind "start_check", Phase: out.Next}] (Queue.Start()
            called); Stop "smoke" or "operator" → State "waiting", Stop {Kind out.Stop, Phase: the finished phase, Reason
            "stop after " + out.Stop, At now}, actions += [{post stop "<phase> done: stop after <kind>" numbers "next <out.Next> · waiting for continue"}];
            Stop "end" → State "waiting", Stop {Kind "end", Phase, Reason "plan complete"}, actions += [{post end "<phase> done: plan complete" numbers "stretch $<StretchUSD 'f' 4>"}].
            e not OK → State "waiting", Stop {Kind "not_pushed", Phase, Reason: e.Problems joined with "; ", At now}, Queue.Stop(Reason),
            no kill, actions [{post stop "<phase> not pushed" numbers Reason}].
            WaitOperator: State "running" or "paused" → State "waiting", Stop {Kind: kind, Phase, Reason, IssueURL, At now},
            Queue.Stop(kind), actions [{post stop "<phase>: wait_operator <kind>" numbers = reason, then " · " + issueURL when non-empty}]; other states → nil.
            Continue: State must be "waiting" else (nil, control.ErrNotWaiting); Stop.Kind "not_pushed" → actions [{end_check Phase}]
            with State "running" and Stop nil; otherwise Queue.Continue() (its error returned as is) then the Begin transition
            (Queue.Start, Phase = its id, State "starting", Stop nil, …, actions [{start_check}]); the session id is drawn in
            StartChecked, so neither Begin nor Continue takes an id source.
            Restart: State "running" or "paused" → actions [{Kind "kill"}, {Kind "start_check", Phase}], State "starting",
            SessionID "", Resumes nil; "idle", "starting" or "waiting" → (nil, control.ErrNoSession).
          steps:
            - uses: queue
            - uses: gitrules
            - uses: control
            - produces: Loop Action
          examples:
            - given: 'q := the queue of Phase Queue example 1 (tests/fixtures/plan/queue-3.json, defaults {30, 3, 5}); l := New("demo", q); ids := a func returning "id-1", "id-2", … in turn'
              when: 'l.Begin(2026-10-08T15:00:00Z)'
              then: 'actions exactly [{Kind "start_check", Phase "P17"}], nil; State "starting", Phase "P17", Queue.State "running"; a second Begin → error text "queue: cannot start in state \"running\"" and no change'
              ref: tests/fixtures/plan/queue-3.json
            - given: 'the loop after example 1; StartChecked(gitrules.Start{Mode: "fresh", Local: "aaa111", Remote: "aaa111"}, ids, 15:00:01Z)'
              when: StartChecked
              then: 'exactly [{Kind "spawn", Phase "P17", SessionID "id-1", Resume false, BudgetUSD 30}, {Kind "first_line", Line "/morph-orchestrator P17"}, {Kind "post", Milestone {start, "P17 started", "session id-1 · cap $30 · 3 h"}}]; State "running", SessionID "id-1", PhaseStartedAt 15:00:01Z'
            - given: 'a loop in State "starting" for P18 with SessionID "" ; StartChecked(Start{Mode: "resume", Reason: "local ahead of origin/main"}, ids returning "id-7", now)'
              when: StartChecked
              then: 'exactly [{spawn P18 "id-7" Resume true BudgetUSD 12}, {post start "P18 resumed" "session id-7 · local ahead of origin/main"}] — no first_line; with SessionID "id-3" kept from before, the spawn carries "id-3"'
            - given: 'a loop in State "starting" for P17; StartChecked(Start{Mode: "diverged", Reason: "local aaa111 and origin/main ccc333 diverged"}, ids, 2026-10-08T15:02:00Z)'
              when: StartChecked
              then: '[{post stop "P17 not started: git" "local aaa111 and origin/main ccc333 diverged"}]; State "waiting", Stop {Kind "git", Phase "P17", Reason as given, At 15:02:00Z}, Queue.State "stopped"'
            - given: 'the running loop of example 2 (P17, session id-1); PhaseDone("P17", "P18"); then EndChecked(End{OK: true, Local: "ddd", Remote: "ddd", Problems: []}, 15:40:00Z)'
              when: 'PhaseDone then EndChecked'
              then: 'PhaseDone → [{Kind "end_check", Phase "P17"}], nil; EndChecked → exactly [{Kind "kill"}, {Kind "start_check", Phase "P18"}]; State "starting", Phase "P18", SessionID "", Queue.Index 1, Queue.State "running"'
            - given: 'the running loop of example 2; PhaseDone("P16", "P17"); then a loop in State "waiting" with PhaseDone("P17", "P18")'
              when: PhaseDone
              then: 'errors.Is ErrPhaseMismatch with text "phase mismatch: phase_done \"P16\" while running \"P17\""; then text "phase mismatch: phase_done \"P17\" while waiting \"P17\""'
            - given: 'the running loop of example 2 with SessionUSD 1.92; EndChecked(End{OK: false, Problems: ["not pushed: HEAD bbb222, origin/main aaa111"]}, 2026-10-08T16:00:00Z)'
              when: EndChecked
              then: 'exactly [{post stop "P17 not pushed" "not pushed: HEAD bbb222, origin/main aaa111"}] (no kill); State "waiting", Stop {Kind "not_pushed", Phase "P17", Reason "not pushed: HEAD bbb222, origin/main aaa111", At 16:00:00Z}, StretchUSD 0, Queue.State "stopped"; then Continue(16:05:00Z) → [{end_check P17}], State "running", Stop nil'
            - given: 'a running loop at P18 (Index 1 of the fixture queue, SessionUSD 0.5, StretchUSD 1.0); EndChecked(OK true) at 17:00:00Z; then Continue(17:30:00Z); then a running loop at P19 with EndChecked(OK true)'
              when: 'EndChecked; Continue; EndChecked'
              then: '[{kill}, {post stop "P18 done: stop after smoke" "next P19 · waiting for continue"}], State "waiting", Stop.Kind "smoke", StretchUSD 1.5; Continue → [{start_check P19}], State "starting", Phase "P19", nil; the P19 end → [{kill}, {post end "P19 done: plan complete" "stretch $1.5000"}], State "waiting", Stop.Kind "end", Queue.State "done"; a Continue then → error text "queue: nothing to continue (state \"done\")"'
            - given: 'the running loop of example 2; WaitOperator("gate", "forecast $1.4 over the cap", "", 15:10:00Z); then on a fresh running loop WaitOperator("emergency", "card x red after fix", "https://github.com/o/r/issues/12", now); then Restart on the waiting loop; then Restart on a running loop'
              when: 'WaitOperator; Restart'
              then: '[{post stop "P17: wait_operator gate" "forecast $1.4 over the cap"}], State "waiting", Stop {gate, P17, "forecast $1.4 over the cap", IssueURL ""}; then numbers "card x red after fix · https://github.com/o/r/issues/12" and Stop.IssueURL set; Restart → (nil, control.ErrNoSession); on the running loop → [{kill}, {start_check P17}], State "starting", SessionID ""'
        - name: Runtime Guard
          description: What the loop does on its own between the session's reports — exits, limits, stalls and caps.
          behavior: >
            Declares in supervisor/guard.go, over the Loop of supervisor/loop.go:
            `func (l *Loop) Exited(code int, now time.Time, cfg Config) []Action`, `func (l *Loop) Turn(r stream.Result, now time.Time, cfg Config) []Action`,
            `func (l *Loop) Limits(lim stream.Limits, now time.Time, cfg Config) []Action`, `func (l *Loop) Event(now time.Time)` and
            `func (l *Loop) Tick(now time.Time, cfg Config) []Action`.
            Event: LastEventAt = now (every line from the process).
            Exited: State "running" or "paused" → the resumes within the last hour (Resumes with now - t < 1 h) counted:
            fewer than cfg.MaxResumesPerHour → Resumes += now, State "starting", actions [{post watchdog "<phase>: session exited
            (code <code>), resuming" numbers "resume <n> of <max> this hour"}, {Kind "start_check", Phase}]; else State "waiting",
            Stop {Kind "crash", Phase, Reason "exited <n> times within an hour (last code <code>)", At now}, Queue.Stop("crash"),
            actions [{post stop "<phase>: session keeps exiting" numbers Reason}]. State "starting" (the process died before
            the check came back) → the same rule. Other states → nil.
            Turn: SessionUSD = r.TotalCostUSD; when StretchUSD + SessionUSD >= cfg.StretchUSD and cfg.StretchUSD > 0 and State is
            "running" or "paused" → State "waiting", Stop {Kind "cap", Phase, Reason fmt "stretch cap $%.2f reached ($%.4f)"
            with cfg.StretchUSD and the sum, At now}, Queue.Stop("cap"), actions [{Kind "kill"}, {post stop "<phase>: stretch cap"
            numbers Reason}]; else nil.
            Limits: when State is "running" and a window has Utilization >= 1 → State "paused", PausedUntil = the ResetsAt of the
            exhausted window (the later one when both) as time.Unix(…, 0).UTC(), actions [{post watchdog "<phase>: usage limit,
            paused" numbers "until <PausedUntil RFC3339>"}]; else when cfg.UsageAlertPercent > 0, !Alerted and SevenDay.Utilization*100
            >= cfg.UsageAlertPercent → Alerted = true, actions [{post info "<phase>: weekly usage <control.Percent(SevenDay)>%" numbers
            "resets <SevenDay.ResetsAt as RFC3339 UTC>"}]; else nil.
            Tick: State "paused" and !now.Before(PausedUntil) → State "running", LastEventAt = now, actions [{Kind "write", Line
            "Continue by docs/AUTONOMY.md from where you stopped; the usage window has reset."}, {post watchdog "<phase>: resumed after
            the limit" numbers ""}]; State "running" and the current phase''s Caps.Hours > 0 and now - PhaseStartedAt >= Hours hours →
            State "waiting", Stop {Kind "cap", Phase, Reason fmt "wall clock cap %s h reached" with Hours 'f' -1, At now}, Queue.Stop("cap"),
            actions [{kill}, {post stop "<phase>: wall clock cap" numbers Reason}]; State "running" and cfg.StallMinutes > 0 and !Nudged
            and now - LastEventAt >= StallMinutes minutes → Nudged = true, actions [{post watchdog "<phase>: no events for <StallMinutes> min"
            numbers "one nudge sent"}, {Kind "write", Line "Nothing has happened for <StallMinutes> minutes. Check the state of your agents and the run branch, then continue by docs/AUTONOMY.md; post the current state first."}];
            otherwise nil. The write Line carries no trailing newline (the daemon wraps it with stream.User).
          steps:
            - calls: Phase Loop
            - uses: stream
            - produces: Loop Action
          examples:
            - given: 'cfg := Config{MaxResumesPerHour: 3, StallMinutes: 30, StretchUSD: 30, UsageAlertPercent: 50}; the running loop of Phase Loop example 2 (P17, id-1, started 2026-10-08T15:00:01Z); Exited(4, 15:20:00Z, cfg)'
              when: Exited
              then: 'exactly [{post watchdog "P17: session exited (code 4), resuming" "resume 1 of 3 this hour"}, {Kind "start_check", Phase "P17"}]; State "starting", Resumes [15:20:00Z], SessionID still "id-1"'
            - given: 'the loop after example 1 brought back to running by StartChecked(resume) at 15:20:05Z, then Exited at 15:30:00Z and 15:40:00Z (each followed by a resume), then Exited(1, 15:50:00Z, cfg)'
              when: Exited
              then: 'the fourth exit within the hour → [{post stop "P17: session keeps exiting" "exited 3 times within an hour (last code 1)"}]; State "waiting", Stop.Kind "crash", Queue.State "stopped"; with the fourth exit at 16:25:00Z instead (the 15:20 resume older than an hour) → a resume, "resume 3 of 3 this hour"'
            - given: 'a running loop (StretchUSD 28, SessionUSD 0); Turn(stream.Result{TotalCostUSD: 1.5}, now, cfg); then Turn(stream.Result{TotalCostUSD: 2.25}, 2026-10-08T16:00:00Z, cfg)'
              when: Turn
              then: 'nil and SessionUSD 1.5; then [{kill}, {post stop "P17: stretch cap" "stretch cap $30.00 reached ($30.2500)"}], State "waiting", Stop.Kind "cap"; with cfg.StretchUSD 0 the second call returns nil'
            - given: 'a running loop; Limits(stream.Limits{FiveHour: {0.22, 1791469200}, SevenDay: {0.6, 1791853200}}, now, cfg)'
              when: Limits
              then: '[{post info "P17: weekly usage 60%" "resets 2026-10-13T01:00:00Z"}], Alerted true; a second identical call → nil; with cfg.UsageAlertPercent 0 → nil and Alerted false'
            - given: 'a running loop; Limits(stream.Limits{FiveHour: {1, 1791469200}, SevenDay: {0.6, 1791853200}}, 2026-10-08T13:09:03Z, cfg)'
              when: Limits
              then: '[{post watchdog "P17: usage limit, paused" "until 2026-10-08T14:20:00Z"}], State "paused", PausedUntil 2026-10-08T14:20:00Z; with both windows at 1 → PausedUntil 2026-10-13T01:00:00Z'
            - given: 'the paused loop of example 5; Tick(14:19:59Z, cfg); Tick(14:20:00Z, cfg)'
              when: Tick
              then: 'nil; then [{Kind "write", Line "Continue by docs/AUTONOMY.md from where you stopped; the usage window has reset."}, {post watchdog "P17: resumed after the limit" ""}], State "running", LastEventAt 14:20:00Z'
            - given: 'a running loop with PhaseStartedAt 15:00:01Z and LastEventAt 15:00:01Z (phase P17, Caps.Hours 3); Tick(15:29:00Z, cfg); Tick(15:31:00Z, cfg); Tick(16:10:00Z, cfg); Event(16:20:00Z); Tick(18:00:01Z, cfg)'
              when: 'Tick and Event'
              then: 'nil; then [{post watchdog "P17: no events for 30 min" "one nudge sent"}, {Kind "write", Line "Nothing has happened for 30 minutes. Check the state of your agents and the run branch, then continue by docs/AUTONOMY.md; post the current state first."}] and Nudged true; then nil (one nudge only); Event sets LastEventAt; the last Tick → [{kill}, {post stop "P17: wall clock cap" "wall clock cap 3 h reached"}], State "waiting", Stop.Kind "cap"'
            - given: 'a loop in State "waiting"; Exited(0, now, cfg); Tick(now, cfg); Turn(Result{TotalCostUSD: 99}, now, cfg); a loop in State "idle": Limits with FiveHour 1'
              when: called
              then: 'each nil; the waiting loop''s State stays "waiting" and the idle one "idle"'
    - name: daemon
      description: >
        Package daemon in daemon/: the running morphd — the projects with their loops, machines, logs and processes,
        the implementation of control.Control, and the pump that moves lines between the process and the machine.
        All I/O goes through the injected dependencies. Imports every package of the module but api, mcpserver and
        cmd/morphd, plus context, encoding/json, errors, fmt, os, path/filepath, strings, sync, time.
      language: go
      functions:
        - name: Daemon Core
          description: The daemon over its dependencies, implementing control.Control and executing loop actions.
          behavior: >
            Declares in daemon/daemon.go:
            `type Deps struct { Registry *registry.Registry; Runner runner.Runner; Spawn func(ctx context.Context, l claude.Launch) (claude.Process, error);
            Post func(ctx context.Context, project, kind, headline, numbers string) (telegram.Status, error); GitHubDo func(*http.Request) (*http.Response, error);
            Now func() time.Time; NewID func() string; Config Config }`;
            `type Config struct { ClaudeBin string; MorphBin string; ProjectsDir string; MCPBaseURL string; Model string; ExtraArgs []string; Defaults queue.Caps;
            MaxParallel int; Loop supervisor.Config }`; `type State struct { Loop supervisor.Loop `json:"loop"`; Repo github.Access `json:"repo"` }`;
            `type Daemon struct` (unexported fields) and `func Open(ctx context.Context, d Deps) (*Daemon, error)`; *Daemon implements control.Control;
            `func (d *Daemon) Execute(ctx context.Context, project string, acts []supervisor.Action)` and `func (d *Daemon) Tick(ctx context.Context)`.
            Open loads every registry project: its State (LoadState; ErrNoState → a zero State with a New loop) and its
            Repo; a loop found "running", "starting" or "paused" gets Exited(-2, now) at once (the daemon restarted under
            it) and the actions are executed. Projects(): one view per registry project sorted by name, State = the loop''s
            State. CreateProject: the name must not exist (ErrExists), then bootstrap.Create through Runner with ProjectsDir,
            CredentialsFile = registry.SecretPath(name, "git-credentials") (not yet existing: the first push waits for the
            token), MorphBin; its error returned as is; success → registry.Add({name, language, repoURL, dir, Defaults, now})
            and the view. Status: unknown → ErrUnknownProject; else {State: the loop''s State ("busy"/"ready"/
            "question" replace "running" by the machine''s state when a process is alive), Phase, Minutes: int(now - PhaseStartedAt
            in minutes) when running/paused else 0, CostUSD: the machine''s CostUSD, FiveHour/SevenDay: control.Percent of the
            machine''s Limits (0 when none), SessionID, Queue view, Repo, Stop}. Events → the log''s Since(since, max) and
            Last (no log yet → empty, Last 0). Order → ErrNoSession when no process; else machine.Order and the actions
            executed (write → the line goes to the process and to the log as "in"). Pending → the machine''s Pending as a
            Question or nil. Answer → machine.Answer. Interrupt → machine.Interrupt("int-" + NewID()). Usage → from the machine''s
            Limits and costs plus StretchUSD. Restart(force): a process alive and the machine not "ready" and !force → ErrBusy;
            else loop.Restart and execute. PlanLoad: the loop State "idle" or "waiting" else ErrBusy; queue.Load(plan, the
            project''s Caps) (its error wrapped as ErrBadInput: fmt.Errorf("%w: %v", …)); the loop replaced by New(project, q);
            then, when fewer than MaxParallel projects are running/starting/paused, Begin and execute; the queue view returned.
            Continue → loop.Continue and execute. StopCheck → the loop''s Stop (nil when none). PutGithubToken: unknown →
            ErrUnknownProject; empty → ErrBadInput; PutSecret github-token and git-credentials (github.CredentialLine); Repo =
            github.Check(GitHubDo, token, repoURL, now), saved; then, only when Repo.Push is true, bootstrap.FirstPush(Runner,
            dir) → TokenResult{Access: Repo, Pushed, PushError: the push error''s text when any}; returned. PhaseDone/WaitOperator/Milestone: the project''s
            current session token (secret "session-token") must equal sessionToken else ErrBadToken; then loop.PhaseDone (its
            error returned) / loop.WaitOperator / Post(kind, headline, numbers), each executed.
            Execute, per action: "start_check" → gitrules.StartCheck(Runner, dir) then loop.StartChecked(newID, now) and execute those;
            "spawn" → session token = NewID() saved as secret "session-token", the MCP config written to registry base/<project>/mcp.json
            (claude.WriteMCPConfig(base/<project>, "morphd", MCPBaseURL + "/mcp/" + project + "/session", token)), the log opened at
            base/<project>/sessions/<SessionID>.jsonl, a New machine, Spawn(claude.Launch{ClaudeBin, dir, SessionID, Resume, BudgetUSD,
            Model, path, ExtraArgs}) and the pump started; a Spawn error → loop.Exited(-3, now) executed; "first_line" → the machine''s
            Order(Line) executed; "end_check" → gitrules.EndCheck then loop.EndChecked executed; "kill" → process.Kill (nil process
            ignored); "post" → Post(project, kind, headline, numbers) (its error ignored); "write" → machine.Order(Line) executed.
            After every executed batch the State is saved (SaveState). Every method takes the project''s mutex. Tick: for
            every project loop.Tick(now, cfg) executed; then, while fewer than MaxParallel projects are running, starting or
            paused, the project with the oldest queued loop (State "idle", Queue.State "queued") is begun (Begin and execute),
            in registry name order on equal age.
          steps:
            - uses: supervisor
            - uses: session
            - uses: gitrules
            - uses: registry
            - uses: claude
            - uses: eventlog
            - uses: bootstrap
            - uses: github
            - uses: telegram
            - uses: control
            - produces: Status
          preconditions:
            - "Project Registry · Open creates base · the tests pass filepath.Join(t.TempDir(), \"state\")"
            - "Phase Start Check · the fake runner must script rev-parse HEAD, rev-parse origin/main, rev-parse --abbrev-ref HEAD, status --porcelain · else Mode error"
            - "Phase End Check · docs/MEASURE.md must exist in the project dir with the phase row · else not OK"
            - "Launch Args · the spawn argv is Args(l) · tests compare l, not the argv"
          examples:
            - given: 'deps := Deps{Registry: registry.Open(<tmp>/state) with project "demo" (Dir <tmp>/projects/demo, Caps {30, 3, 5}), Runner: &runner.Fake{} scripted as Phase Start Check example 1 (fresh), Spawn: a fake recording claude.Launch and returning claude.NewFake(), Post: a recorder, GitHubDo: nil, Now: a clock starting 2026-10-08T15:00:00Z advancing 1 s per call, NewID: "id-1", "id-2", …, Config{ClaudeBin: "claude", ProjectsDir: <tmp>/projects, MCPBaseURL: "http://127.0.0.1:7080", Defaults {30, 3, 5}, MaxParallel: 1, Loop {3, 30, 30, 50}}}; d := Open(ctx, deps)'
              when: 'd.Projects(); d.Status("demo"); d.Status("nope"); d.StopCheck("demo")'
              then: '[{Name "demo", Language "go", State "idle", …}]; Status{State: "idle", Phase: "", Minutes: 0, Queue.State ""} with Repo.Checked false; (Status{}, ErrUnknownProject); (nil, nil)'
            - given: 'd of example 1; plan := the Plan of tests/fixtures/plan/queue-3.json'
              when: 'd.PlanLoad("demo", plan)'
              then: 'QueueView{State: "running", Approved: "7b31dfe", Index: 0, Phases: 3, Current: "P17"}, nil; the fake Spawn was called once with Launch{Bin: "claude", Dir: <tmp>/projects/demo, SessionID: "id-1", Resume: false, BudgetUSD: 30, MCPConfigPath: <state>/demo/mcp.json}; that file holds claude.MCPConfigJSON("http://127.0.0.1:7080/mcp/demo/session", "id-2"); the secret session-token reads "id-2"; the fake process Written() == [stream.User("/morph-orchestrator P17")]; the recorder got one post ("demo", "start", "P17 started", "session id-1 · cap $30 · 3 h"); Status → State "busy", Phase "P17", SessionID "id-1"; the file <state>/demo/sessions/id-1.jsonl has 1 line (dir in)'
              ref: tests/fixtures/plan/queue-3.json
            - given: 'd after example 2 (P17 running, the turn in flight)'
              when: 'd.Order("demo", "smoke checked green"); d.Pending("demo"); d.Answer("demo", 1); d.Interrupt("demo"); d.Events("demo", 0, 10)'
              then: '{Queued: 1}, nil (the first line is in flight); (nil, nil); ErrNoQuestion; nil and Written()[1] == stream.Interrupt("int-id-3"); Events.Entries has 2 entries (seq 1 the first line, seq 2 the interrupt), Last 2'
            - given: 'd after example 2; PlanLoad again; then d.Restart("demo", false); d.Restart("demo", true)'
              when: 'PlanLoad; Restart'
              then: 'ErrBusy (the loop is running); ErrBusy (the machine is busy); then nil: the first fake process Killed() true, Spawn called a second time with SessionID "id-4" and Resume false (the runner says fresh), the post "P17 started" again'
            - given: 'd after example 2; d.PhaseDone("demo", "wrong", "P17", "P18"); then with the token "id-2" and the fake runner re-scripted as Phase End Check example 1 (OK) and docs/MEASURE.md with a P17 row in <tmp>/projects/demo'
              when: PhaseDone
              then: 'ErrBadToken; then nil: the first process Killed(), Spawn called with SessionID "id-4" for P18 with BudgetUSD 12 and a new session token "id-5", posts "P18 started" with numbers "session id-4 · cap $12 · 3 h"; Status → Phase "P18", Queue.Index 1'
              ref: tests/fixtures/plan/queue-3.json
            - given: 'd after example 2; the runner re-scripted with HEAD "bbb222" for the end check; d.PhaseDone("demo", "id-2", "P17", "P18")'
              when: PhaseDone
              then: 'nil; no second Spawn; the process not killed; the post ("demo", "stop", "P17 not pushed", "not pushed: HEAD bbb222, origin/main aaa111"); Status.State "waiting", StopCheck → &Stop{Kind: "not_pushed", Phase: "P17", Reason: "not pushed: HEAD bbb222, origin/main aaa111"}; then with the runner scripted OK, d.Continue("demo") → nil, the process killed, P18 spawned'
            - given: 'd after example 2; d.WaitOperator("demo", "id-2", "smoke", "P17 smoke: run morphd status", ""); d.Milestone("demo", "id-2", control.Milestone{Kind: "gate", Headline: "P17 gate passed", Numbers: "10 cards · $0.12"}); d.Milestone("demo", "bad", …)'
              when: called
              then: 'nil with the post ("demo", "stop", "P17: wait_operator smoke", "P17 smoke: run morphd status") and Status.State "waiting"; nil with the post ("demo", "gate", "P17 gate passed", "10 cards · $0.12"); ErrBadToken and no post'
            - given: 'd of example 1 (idle) with the runner also scripting "git rev-parse --verify -q origin/main": {Code: 1} and "git push -q -u origin main": {Code: 0}; d.PutGithubToken(ctx, "demo", "ghp_abc") with GitHubDo answering 200 {"permissions":{"push":true}}; then with GitHubDo answering 401; d.PutGithubToken(ctx, "demo", ""); d.PutGithubToken(ctx, "nope", "x")'
              when: PutGithubToken
              then: 'TokenResult{Access: {Checked: true, Reachable: true, Push: true, CheckedAt: the clock}, Pushed: true}, nil; the secrets github-token "ghp_abc" and git-credentials "https://x-access-token:ghp_abc@github.com\n" exist with mode 0o600; Status.Repo equal to the Access; the runner saw the two git calls in <tmp>/projects/demo; then TokenResult{Access: {Reason: "401 bad credentials"}, Pushed: false} with no git call; ErrBadInput; ErrUnknownProject'
            - given: 'd of example 1 with a second project "beta" in the registry and MaxParallel 1; PlanLoad("demo", plan) then PlanLoad("beta", plan)'
              when: PlanLoad
              then: 'demo: QueueView.State "running" and one Spawn; beta: QueueView.State "queued", no second Spawn, Status("beta").State "idle" with Queue.State "queued"; then d.WaitOperator("demo", "id-2", "smoke", "stop", "") and d.Tick(ctx) → a second Spawn, for beta (its Dir), Status("beta").State "busy", Phase "P17"'
              ref: tests/fixtures/plan/queue-3.json
        - name: Pump
          description: The goroutine that reads the process, logs every line, feeds the machine and the loop, and executes what they return.
          behavior: >
            Declares in daemon/pump.go, over the Daemon of daemon/daemon.go: `func (d *Daemon) pump(ctx context.Context, project string, p claude.Process, l *eventlog.Log)`
            started by the spawn action, and the exported `func (d *Daemon) Wait(project string)` which returns when the
            project''s pump has finished (for tests; immediate when none runs).
            For every line from p.Lines(): l.Append("out", msg, now) where msg is the line when it is valid JSON, else
            json.Marshal(string(line)) (an append error is counted, never fatal); ev, err := stream.Parse(line) (err → the
            line is skipped after the append); under the project''s mutex: loop.Event(now); acts := machine.Apply(ev,
            now); then by ev.Type: "result" → loop.Turn(*ev.Result, now, cfg) appended; "rate_limit_event" → loop.Limits(*ev.Limits,
            now, cfg) appended; then the machine actions are executed: "write" → p.Write(Line) and l.Append("in", Line, now);
            "ask" → Post(project, "ask", Headline, Numbers); "turn" → Post(project, "idle", "<phase> turn ended: " + the first 200
            runes of Headline (or "(no text)" when empty), Numbers); "limit" → nothing; then the loop actions are executed
            (Execute). When Lines() closes: st := <-p.Exit(); under the mutex: if this process is still the project''s current one:
            the process cleared, loop.Exited(st.Code, now, cfg) executed; SaveState. A process replaced by a newer spawn (restart)
            is pumped to its end but its exit changes nothing.
          steps:
            - calls: Daemon Core
            - uses: session
            - uses: supervisor
            - uses: eventlog
            - uses: claude
            - uses: stream
            - produces: log entries
          preconditions:
            - "Daemon Core · a spawned project has a fake process reachable from the Spawn recorder · the tests emit on it"
          examples:
            - given: 'd after Daemon Core example 2 (P17 running, fake process fp, session id-1); fp.Emit of the msg bytes of lines 4, 5, 6, 7 of tests/fixtures/stream/probe.jsonl; d.Wait is not needed — poll Status until CostUSD > 0 (≤ 2 s)'
              when: Emit
              then: 'Status.State "ready" (the loop runs, the machine finished its turn), CostUSD 0.0021784900000000004, FiveHour 22, SevenDay 60, SessionID "967e8f4d-a2eb-4aa6-968b-b9054a1c3d7e"; Events("demo", 0, 10) has 5 entries: seq 1 dir in (the first line), seq 2..5 dir out with Msg equal to the four emitted lines; the posts after the start: ("demo", "info", "P17: weekly usage 60%", "resets 2026-10-13T01:00:00Z") then ("demo", "idle", "P17 turn ended: PONG", "success · turns 1 · $0.0022")'
              ref: tests/fixtures/stream/probe.jsonl
            - given: 'd after example 1; fp.Emit(line 27 of the probe) then poll Pending'
              when: Emit
              then: 'Pending → &Question{RequestID: "9f4ffa22-2676-4391-bfd9-bd7d16c3866c", Text: "Which option do you want: A or B?", Header: "A or B", Options: ["Option A", "Option B"]}, Status.State "question"; the post ("demo", "ask", "Which option do you want: A or B?", "1 Option A · 2 Option B"); then d.Answer("demo", 2) → nil, fp.Written() last element decodes equal to line 28, the log''s last entry dir in; Status.State "busy"'
              ref: tests/fixtures/stream/probe.jsonl
            - given: 'd after example 1 (ready); d.Order("demo", "next step") then fp.Emit(the Bash can_use_tool line of Parse Event example 7)'
              when: 'Order then Emit'
              then: 'Order → {Sent: true}; after the emit (poll Events until Last is 8): fp.Written() last == stream.Allow("r-7", {"command":"ls"}) bytes, Status.State "busy"'
            - given: 'd after example 1; fp.Emit([]byte("not json")); fp.Emit(line 10 of the probe, a thinking_tokens system line)'
              when: Emit
              then: 'Events grows by 2: the first logged as the JSON string of its text (Msg exactly "\"not json\""), the second as is; Status unchanged (State "ready"); no post'
              ref: tests/fixtures/stream/probe.jsonl
            - given: 'd after example 1; fp.Finish(4); d.Wait("demo")'
              when: Finish
              then: 'the post ("demo", "watchdog", "P17: session exited (code 4), resuming", "resume 1 of 3 this hour"); Spawn called a second time with Resume true and SessionID "id-1"; the state file <state>/demo/state.json decodes to a State whose loop has 1 resume; Status.State "busy"'
            - given: 'd after example 1; d.Restart("demo", true) (a second fake process fp2); then fp.Finish(0) (the old one); d.Wait("demo")'
              when: 'Restart then Finish'
              then: 'after the restart Spawn was called with a new SessionID "id-4"; the old process''s exit changes nothing: no watchdog post, Spawn not called a third time, Status.SessionID "id-4"'
            - given: 'd after example 1; fp.Emit(the msg bytes of line 6 with five_hour utilization edited to 1.0 — build it from the literal {"type":"rate_limit_event","rate_limit_info":{"unifiedWindows":{"five_hour":{"utilization":1.0,"resetsAt":1791469200},"seven_day":{"utilization":0.6,"resetsAt":1791853200}}}})'
              when: Emit
              then: 'Status.State "paused"; the post ("demo", "watchdog", "P17: usage limit, paused", "until 2026-10-08T14:20:00Z"); then d.Tick with the clock at 2026-10-08T14:20:00Z → fp.Written() last == stream.User("Continue by docs/AUTONOMY.md from where you stopped; the usage window has reset."), Status.State "busy"'
    - name: api
      description: >
        Package api in api/: the HTTP API of morphd over control.Control — JSON in and out, the bearer token, the
        routes under /projects/{project}/…; never a listener, never the clock. Imports morphstudio/control,
        morphstudio/queue, crypto/subtle, encoding/json, errors, io, mime, net/http, strconv, strings.
      language: go
      functions:
        - name: HTTP Handlers
          description: The handlers of every route, with the JSON reading rules and the error body.
          behavior: >
            Declares in api/handlers.go: `type Handlers struct { Control control.Control }` and methods with the signature
            `func (h Handlers) X(w http.ResponseWriter, r *http.Request)`: Projects, CreateProject, Status, Events, Messages,
            Pending, Answer, Interrupt, Usage, Restart, Plan, Continue, StopCheck, GithubToken; plus
            `func WriteJSON(w http.ResponseWriter, status int, v any)` (Content-Type application/json, then the status, then
            json.NewEncoder(w).Encode(v) — every body ends with "\n") and `func WriteError(w http.ResponseWriter, err error)`
            (status, code := control.Code(err); body {"error":{"code":<code>,"message":<err.Error()>}}; a 500 writes message
            "internal" instead of the error text). The project is r.PathValue("project"). Reading a body (CreateProject,
            Messages, Answer, Restart, Plan, GithubToken): Content-Type parsed with mime.ParseMediaType must be application/json
            else 415 {"error":{"code":"unsupported_media_type","message":"Content-Type must be application/json"}}; the body through
            http.MaxBytesReader(w, r.Body, 1<<20), a json.Decoder with DisallowUnknownFields into the request struct and a second
            Decode returning io.EOF, else 400 {"error":{"code":"bad_json","message":"bad json"}}.
            Projects: GET → 200 {"projects":[…]} (empty as []). CreateProject: {"name","language","repo_url"} → Control.CreateProject
            → 201 the view. Status → 200 the Status. Events: query since (int64, default 0) and max (int, default 0); a non-integer
            → 400 bad_input with message "since must be an integer" / "max must be an integer"; → 200 the Events. Messages: {"text"}
            → Control.Order → 200 the OrderResult. Pending → 200 {"question":<Question or null>}. Answer: {"option"} → 200 {"ok":true}.
            Interrupt → 200 {"ok":true}. Usage → 200 the Usage. Restart: {"force"} (an empty body allowed: force false — the
            body is read only when Content-Length is not 0) → 200 {"ok":true}. Plan: a queue.Plan → 200 the QueueView. Continue
            → 200 {"ok":true}. StopCheck → 200 {"stop":<Stop or null>}. GithubToken: {"token"} → 200 the TokenResult (the token never
            echoed). Every Control error → WriteError.
          steps:
            - uses: control
            - produces: http.Handler
          examples:
            - given: 'h := Handlers{Control: a fake Control (a struct of the test file) whose Status returns the Status of Control Contract example 1 for "demo" and control.ErrUnknownProject otherwise}; GET /projects/demo/status with path value project "demo" on httptest.NewRecorder'
              when: h.Status
              then: 'status 200, Content-Type exactly application/json, body exactly the JSON of Control Contract example 1 + "\n"; with project "nope": status 404, body exactly {"error":{"code":"unknown_project","message":"unknown project"}} + "\n"'
            - given: 'the fake Control recording Order calls and returning {Queued: 1}; POST /projects/demo/messages, Content-Type "application/json; charset=utf-8", body {"text":"smoke checked green. Resume with P12b"}'
              when: h.Messages
              then: 'status 200, body exactly {"queued":1} + "\n"; the fake saw Order("demo", "smoke checked green. Resume with P12b"); with the fake returning {Sent: true} the body is exactly {"sent":true} + "\n"'
            - given: 'POST /projects/demo/messages with in turn Content-Type "text/plain", no Content-Type, "application/xml", each with body {"text":"x"}'
              when: h.Messages
              then: 'each status 415, body exactly {"error":{"code":"unsupported_media_type","message":"Content-Type must be application/json"}} + "\n"; the fake saw no Order'
            - given: 'POST /projects/demo/answer, Content-Type application/json, bodies in turn {"option": (cut), {"option":1,"x":2}, {"option":1} {}, the empty body, then {"option":2}'
              when: h.Answer
              then: 'four times status 400 with body exactly {"error":{"code":"bad_json","message":"bad json"}} + "\n"; then 200 {"ok":true} + "\n" and the fake saw Answer("demo", 2); with the fake returning control.ErrBadOption wrapped as "option out of range: 3 of 1..2": status 400, body {"error":{"code":"bad_option","message":"option out of range: 3 of 1..2"}} + "\n"'
            - given: 'GET /projects/demo/events?since=2&max=5; then ?since=x; then no query, with the fake returning Events{Entries: [], Last: 7} and recording the arguments'
              when: h.Events
              then: '200 and the fake saw (demo, 2, 5), body exactly {"entries":[],"last":7} + "\n"; 400 {"error":{"code":"bad_input","message":"since must be an integer"}} + "\n"; the fake saw (demo, 0, 0)'
            - given: 'GET /projects/demo/pending with the fake returning nil; then returning the Question of Control Contract example 3'
              when: h.Pending
              then: '200 {"question":null} + "\n"; then 200 {"question":{"request_id":"9f4ffa22-2676-4391-bfd9-bd7d16c3866c","text":"Which option do you want: A or B?","header":"A or B","options":["Option A","Option B"],"asked_at":"2026-10-08T13:09:08Z"}} + "\n"'
            - given: 'POST /projects/demo/plan, application/json, body = the text of tests/fixtures/plan/queue-3.json; the fake records the plan and returns QueueView{State: "running", Approved: "7b31dfe", Index: 0, Phases: 3, Current: "P17"}'
              when: h.Plan
              then: '200, body exactly {"state":"running","approved":"7b31dfe","index":0,"phases":3,"current":"P17","reason":""} + "\n"; the recorded plan has 3 phases, Phases[1].StopAfter "smoke", Phases[1].Caps.ClaudeUSD 12'
              ref: tests/fixtures/plan/queue-3.json
            - given: 'PUT /projects/demo/github-token, application/json, body {"token":"ghp_abc"}; the fake returns control.TokenResult{Access: github.Access{Checked: true, Reachable: false, Push: false, Reason: "401 bad credentials", CheckedAt: 2026-10-08T15:00:00Z}}; then POST /projects/demo/restart with no body and Content-Length 0; then with body {"force":true}; then GET /projects with the fake returning no projects; then a fake whose Status returns errors.New("disk full")'
              when: 'h.GithubToken; h.Restart; h.Projects; h.Status'
              then: '200 {"access":{"checked":true,"reachable":false,"push":false,"reason":"401 bad credentials","checked_at":"2026-10-08T15:00:00Z"},"pushed":false} + "\n" and "ghp_abc" appears nowhere in the body, the fake saw PutGithubToken("demo", "ghp_abc"); 200 {"ok":true} with the fake seeing Restart("demo", false); then Restart("demo", true); 200 {"projects":[]} + "\n"; 500 {"error":{"code":"internal","message":"internal"}} + "\n"'
        - name: Router
          description: The routes on http.ServeMux, the bearer token in front of everything but /healthz, and the MCP mount.
          behavior: >
            Declares in api/router.go: `func Bearer(token string, next http.Handler) http.Handler` and
            `func NewRouter(h Handlers, token string, mcp http.Handler) http.Handler`.
            Bearer: the Authorization header must be "Bearer " + token (the scheme case-insensitive, the token compared with
            crypto/subtle.ConstantTimeCompare) else status 401, Content-Type application/json, body exactly
            {"error":{"code":"unauthorized","message":"bearer token required"}} + "\n"; an empty configured token refuses every
            request the same way. NewRouter: a new http.ServeMux with "GET /healthz" → 200 {"status":"ok"} + "\n" (no token);
            "GET /projects" → Projects; "POST /projects" → CreateProject; "GET /projects/{project}/status"; "GET /projects/{project}/events";
            "POST /projects/{project}/messages"; "GET /projects/{project}/pending"; "POST /projects/{project}/answer";
            "POST /projects/{project}/interrupt"; "GET /projects/{project}/usage"; "POST /projects/{project}/restart";
            "POST /projects/{project}/plan"; "POST /projects/{project}/continue"; "GET /projects/{project}/stop";
            "PUT /projects/{project}/github-token" — each wrapped in Bearer(token, …); and when mcp is not nil "/mcp" and
            "/mcp/" → mcp unwrapped (the MCP handler checks its own tokens). A wrong method on a known path is the mux''s 405,
            an unknown path its 404 (statuses only).
          steps:
            - calls: HTTP Handlers
            - produces: http.Handler
          examples:
            - given: 'r := NewRouter(Handlers{Control: the fake of HTTP Handlers example 1}, "tok-1", nil); GET /healthz with no header'
              when: served on httptest.NewRecorder
              then: 'status 200, Content-Type application/json, body exactly {"status":"ok"} + "\n"'
            - given: 'r of example 1; GET /projects/demo/status with no Authorization; with "Bearer wrong"; with "Basic dG9rLTE="; with "Bearer tok-1 " (trailing space)'
              when: served
              then: 'each status 401, body exactly {"error":{"code":"unauthorized","message":"bearer token required"}} + "\n"'
            - given: 'r of example 1; GET /projects/demo/status with Authorization "Bearer tok-1"; then "bearer tok-1"'
              when: served
              then: 'each status 200 with the Status JSON of Control Contract example 1 + "\n" (the router fills the project path value)'
            - given: 'r := NewRouter(h, "", nil); GET /projects with Authorization "Bearer "'
              when: served
              then: 'status 401 (an empty configured token never matches)'
            - given: 'r of example 1 with Authorization "Bearer tok-1" on every request; POST /projects/demo/messages {"text":"hi"} (application/json); GET /projects/demo/pending; POST /projects/demo/interrupt; GET /projects/demo/usage; POST /projects/demo/continue; GET /projects/demo/stop; PUT /projects/demo/github-token {"token":"t"}'
              when: served
              then: 'statuses 200, 200, 200, 200, 200, 200, 200 and the fake Control saw Order, Pending, Interrupt, Usage, Continue, StopCheck, PutGithubToken for "demo" in that order'
            - given: 'r of example 1, Authorization "Bearer tok-1"'
              when: 'DELETE /projects/demo/status; POST /projects/demo/status; GET /projects/demo/messages; GET /nowhere; POST /healthz'
              then: 'statuses 405, 405, 405, 404, 405'
            - given: 'r := NewRouter(h, "tok-1", an http.Handler answering 299 with body "mcp " + r.URL.Path); GET /mcp; POST /mcp/demo; POST /mcp/demo/session, each with no Authorization'
              when: served
              then: 'each status 299 with bodies "mcp /mcp", "mcp /mcp/demo", "mcp /mcp/demo/session" — the MCP mount is not behind Bearer; with mcp nil the same requests give 404'
    - name: mcpserver
      description: >
        Package mcpserver in mcpserver/: the remote MCP server of morphd on the official Go SDK — the user-level
        server (registry tools), the per-project PM server and the per-session server for the VPS session, each bound
        to its project by the URL and guarded by its token. Tests drive the servers over the SDK's in-memory
        transports and the HTTP mount with httptest.NewRecorder. Imports the SDK's mcp package, morphstudio/control,
        morphstudio/queue, context, crypto/subtle, encoding/json, fmt, net/http, strings.
      language: go
      uses:
        - github.com/modelcontextprotocol/go-sdk
      functions:
        - name: PM Tools
          description: The user-level and per-project MCP servers whose tools call the Control.
          behavior: >
            Declares in mcpserver/pm.go: `const ServerName = "morphd"`, `const ServerVersion = "0.1.0"`,
            `func UserServer(c control.Control) *mcp.Server` and `func PMServer(c control.Control, project string) *mcp.Server`,
            both mcp.NewServer(&mcp.Implementation{Name: ServerName, Version: ServerVersion}, nil) with tools added by mcp.AddTool
            with typed inputs (struct fields with json and jsonschema tags). Every tool returns the json.Marshal of its view
            as one mcp.TextContent (and nothing structured); a Control error → a result with IsError true and one TextContent
            "<code>: <err.Error()>" where code is control.Code''s (never a protocol error, so the model sees it).
            UserServer tools: projects_list (no input) → {"projects":[…]}; project_create {name, language, repo_url} → the
            ProjectView. PMServer tools, none with a project argument: status → Status; order {text} → OrderResult; pending →
            {"question": Question or null}; answer {option int} → {"ok":true}; interrupt → {"ok":true}; usage → Usage; restart
            {force bool} → {"ok":true}; plan_load {approved string, phases []{id, stop_after, caps{claude_usd, hours, executor_usd}}}
            → QueueView; continue → {"ok":true}; stop_check → {"stop": Stop or null}. Tool names are exactly these, tool
            descriptions one sentence each. `func ToolNames(s *mcp.Server) []string` is not needed: tests list tools through a
            client session.
          steps:
            - uses: control
            - produces: mcp.Server
          examples:
            - given: 'c := the fake Control of HTTP Handlers; s := PMServer(c, "demo"); ct, st := mcp.NewInMemoryTransports(); s.Connect(ctx, st, nil); cs := mcp.NewClient(&mcp.Implementation{Name: "t", Version: "0"}, nil).Connect(ctx, ct, nil)'
              when: 'cs.ListTools(ctx, nil)'
              then: 'the tool names, sorted, exactly ["answer", "continue", "interrupt", "order", "pending", "plan_load", "restart", "status", "stop_check", "usage"]'
            - given: 'the session of example 1; cs.CallTool(ctx, &mcp.CallToolParams{Name: "status"})'
              when: CallTool
              then: 'IsError false; Content has one *mcp.TextContent whose Text decodes equal to the Status of Control Contract example 1 (state "busy", phase "P18", minutes 37, cost_usd 1.92, five_hour 22, seven_day 60); the fake saw Status("demo")'
            - given: 'the session of example 1; CallTool "order" with Arguments {"text": "smoke checked green. Resume with P12b"} (the fake answers {Queued: 1}); then "answer" with {"option": 1}; then "plan_load" with Arguments = the object of tests/fixtures/plan/queue-3.json'
              when: CallTool
              then: 'Text exactly {"queued":1}; the fake saw Order("demo", "smoke checked green. Resume with P12b"); then Text exactly {"ok":true} and Answer("demo", 1); then Text = the QueueView JSON the fake returned and the fake''s recorded plan has 3 phases with Phases[1].Caps.ClaudeUSD 12'
              ref: tests/fixtures/plan/queue-3.json
            - given: 'the session of example 1 with the fake returning control.ErrNoQuestion from Answer; CallTool "answer" {"option": 1}; then "status" on a fake returning errors.New("disk full")'
              when: CallTool
              then: 'IsError true, one TextContent "no_question: no pending question"; then IsError true, "internal: disk full"'
            - given: 'the session of example 1; CallTool "pending" with the fake returning nil; "stop_check" with nil; "interrupt"; "continue"; "restart" {"force": true}; "usage"'
              when: CallTool
              then: 'Texts exactly {"question":null}; {"stop":null}; {"ok":true}; {"ok":true}; {"ok":true} with the fake seeing Restart("demo", true); the Usage JSON of Control Contract example 7 when the fake returns that Usage'
            - given: 'u := UserServer(c) connected the same way; ListTools; CallTool "projects_list"; CallTool "project_create" {"name": "demo", "language": "go", "repo_url": "https://github.com/o/demo"} with the fake returning ProjectView{Name: "demo", Language: "go", RepoURL: "https://github.com/o/demo", State: "idle", CreatedAt: 2026-10-08T15:00:00Z}'
              when: 'ListTools; CallTool'
              then: 'names exactly ["project_create", "projects_list"]; {"projects":[…the fake''s views…]}; Text exactly {"name":"demo","language":"go","repo_url":"https://github.com/o/demo","state":"idle","created_at":"2026-10-08T15:00:00Z"} and the fake saw CreateProject("demo", "go", "https://github.com/o/demo")'
            - given: 'the session of example 1; CallTool "answer" with Arguments {"option": "one"} (a string)'
              when: CallTool
              then: 'an error from CallTool or a result with IsError true — the SDK validates the input against the schema; the fake saw no Answer'
        - name: Session Tools
          description: The per-session MCP server the VPS session reports through — phase_done, wait_operator, milestone.
          behavior: >
            Declares in mcpserver/session.go: `func SessionServer(c control.Control, project, token string) *mcp.Server`, built as
            the servers of mcpserver/pm.go, with three tools that pass project and token to the Control: phase_done {phase, next}
            → Control.PhaseDone → {"ok":true}; wait_operator {kind, reason, issue_url} → Control.WaitOperator → {"ok":true};
            milestone {kind, headline, numbers} → Control.Milestone → {"ok":true}. Errors as in PM Tools (IsError true,
            "<code>: <message>"); kind of wait_operator must be one of "smoke", "gate", "emergency", "no-next" else the result
            IsError true with text "bad_input: kind must be one of smoke, gate, emergency, no-next" and the Control not called;
            kind of milestone must be a key of telegram.Icons — the server does not import telegram: the list is
            `var MilestoneKinds = []string{"start", "gate", "run", "fail", "merge", "smoke", "stop", "debt", "end", "info", "watchdog", "idle", "ask"}`
            and a kind outside it → IsError true "bad_input: unknown milestone kind \"<kind>\"".
          steps:
            - calls: PM Tools
            - uses: control
            - produces: mcp.Server
          examples:
            - given: 's := SessionServer(c, "demo", "id-2") connected over in-memory transports as PM Tools example 1'
              when: ListTools
              then: 'names sorted exactly ["milestone", "phase_done", "wait_operator"]'
            - given: 'CallTool "phase_done" {"phase": "P17", "next": "P18"}'
              when: CallTool
              then: 'Text {"ok":true}, IsError false; the fake saw PhaseDone("demo", "id-2", "P17", "P18")'
            - given: 'the fake returning control.ErrBadToken; CallTool "phase_done" {"phase": "P17", "next": "P18"}; then the fake returning fmt.Errorf("%w: phase_done \"P16\" while running \"P17\"", supervisor.ErrPhaseMismatch) — any non-sentinel error'
              when: CallTool
              then: 'IsError true "bad_session_token: session token mismatch"; then IsError true "internal: phase mismatch: phase_done \"P16\" while running \"P17\""'
            - given: 'CallTool "wait_operator" {"kind": "smoke", "reason": "P17 smoke: curl status", "issue_url": ""}; then {"kind": "pause", "reason": "x"}'
              when: CallTool
              then: '{"ok":true} and WaitOperator("demo", "id-2", "smoke", "P17 smoke: curl status", ""); then IsError true "bad_input: kind must be one of smoke, gate, emergency, no-next" and the fake not called'
            - given: 'CallTool "milestone" {"kind": "gate", "headline": "P17 gate passed", "numbers": "10 cards · $0.12"}; then {"kind": "party", "headline": "h", "numbers": ""}'
              when: CallTool
              then: '{"ok":true} and Milestone("demo", "id-2", {gate, "P17 gate passed", "10 cards · $0.12"}); then IsError true "bad_input: unknown milestone kind \"party\"" and the fake not called'
            - given: 'CallTool "milestone" {"kind": "info", "headline": "h"} (numbers omitted)'
              when: CallTool
              then: '{"ok":true} with Numbers ""'
        - name: MCP Mount
          description: The HTTP mount of the three MCP endpoints with their tokens, over the SDK's streamable HTTP handler.
          behavior: >
            Declares in mcpserver/mount.go: `type Tokens struct { API string; Session func(project string) (string, bool) }` and
            `func Handler(c control.Control, known func(project string) bool, t Tokens) http.Handler`. One http.ServeMux:
            "POST /mcp" → UserServer; "POST /mcp/{project}" → PMServer(c, project); "POST /mcp/{project}/session" →
            SessionServer(c, project, the session token); each served by mcp.NewStreamableHTTPHandler(getServer,
            &mcp.StreamableHTTPOptions{Stateless: true, JSONResponse: true}) where getServer builds the server for the
            request''s project. Before the SDK sees a request: the bearer token (scheme case-insensitive, constant-time
            compare) must equal t.API for /mcp and /mcp/{project}, and the project''s session token (t.Session; false → 401)
            for /mcp/{project}/session; a mismatch → 401 with Content-Type application/json and body exactly
            {"error":{"code":"unauthorized","message":"bearer token required"}} + "\n"; an unknown project (!known) → 404
            {"error":{"code":"unknown_project","message":"unknown project"}} + "\n". GET and DELETE on these paths → the
            mux''s 405. A JSON-RPC request is a POST with Content-Type application/json and Accept "application/json,
            text/event-stream"; the stateless server answers application/json.
          steps:
            - calls: PM Tools
            - calls: Session Tools
            - produces: http.Handler
          preconditions:
            - "PM Tools · a stateless POST needs Accept application/json, text/event-stream · else the SDK answers 400"
          examples:
            - given: 'h := Handler(fake, known = project == "demo", Tokens{API: "tok-1", Session: "demo" → ("id-2", true)}); POST /mcp/demo with Authorization "Bearer tok-1", Content-Type application/json, Accept "application/json, text/event-stream", body {"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}'
              when: served on httptest.NewRecorder
              then: 'status 200, Content-Type begins application/json; the body decodes to a JSON-RPC response with id 1 whose result.tools names, sorted, are ["answer", "continue", "interrupt", "order", "pending", "plan_load", "restart", "status", "stop_check", "usage"]'
            - given: 'h of example 1; POST /mcp/demo with the same headers and body {"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"status","arguments":{}}}'
              when: served
              then: 'status 200; result.content[0].type "text" and its text decodes equal to the Status of Control Contract example 1; result.isError absent or false'
            - given: 'h of example 1; POST /mcp/demo/session with Authorization "Bearer id-2" and the tools/call body for "milestone" with arguments {"kind":"gate","headline":"P17 gate passed","numbers":"10 cards · $0.12"}'
              when: served
              then: 'status 200; result.content[0].text exactly {"ok":true}; the fake saw Milestone("demo", "id-2", …)'
            - given: 'h of example 1; the tools/list body in turn: POST /mcp/demo with no Authorization; with "Bearer wrong"; POST /mcp/demo/session with "Bearer tok-1" (the API token, not the session''s); POST /mcp/other/session (no session token known) with "Bearer id-2"'
              when: served
              then: 'each status 401 with body exactly {"error":{"code":"unauthorized","message":"bearer token required"}} + "\n"'
            - given: 'h of example 1; POST /mcp/nope with "Bearer tok-1" and the tools/list body'
              when: served
              then: 'status 404, body exactly {"error":{"code":"unknown_project","message":"unknown project"}} + "\n"'
            - given: 'h of example 1; POST /mcp with "Bearer tok-1" and the tools/list body'
              when: served
              then: 'status 200; result.tools names sorted ["project_create", "projects_list"]'
            - given: 'h of example 1; GET /mcp/demo with "Bearer tok-1"; DELETE /mcp'
              when: served
              then: 'statuses 405, 405'
    - name: cmd
      description: >
        Package main in cmd/morphd/: the configuration from the environment and .env, and the wiring of the daemon,
        the router and the MCP mount into one listener on 127.0.0.1. Imports every package of the module, bufio,
        context, crypto/rand, encoding/hex, flag, fmt, log, net/http, os, path/filepath, strconv, strings, time.
      language: go
      functions:
        - name: Config And Main
          description: The configuration keys with their defaults, the .env parser, and main.
          behavior: >
            Declares in cmd/morphd/config.go: `type Config struct { Token string; Port int; StateDir string; ProjectsDir string; ClaudeBin string;
            MorphBin string; TGToken string; TGChatID string; Model string; ExtraArgs []string; Defaults queue.Caps; StretchUSD float64;
            MaxParallel int; ResumesPerHour int; StallMinutes int; UsageAlertPercent int }`, `func ParseDotenv(text string) map[string]string`
            and `func Load(getenv func(string) string, dotenv map[string]string) (Config, error)`.
            ParseDotenv: lines trimmed; empty lines and lines beginning "#" skipped; "export " prefix removed; the first "="
            splits key and value; the value trimmed and, when wrapped in matching single or double quotes, unquoted; a line
            without "=" skipped. Load reads each key as getenv(key), falling back to dotenv[key], then the default:
            MORPHD_TOKEN (required: "" → error "config: MORPHD_TOKEN is required"); MORPHD_PORT 7080; MORPHD_STATE_DIR
            getenv("HOME") + "/.local/state/morphd"; MORPHD_PROJECTS_DIR getenv("HOME") + "/projects"; MORPHD_CLAUDE_BIN "claude";
            MORPHD_MORPH_BIN "morph"; TG_BOT_TOKEN ""; TG_CHAT_ID ""; MORPHD_MODEL ""; MORPHD_CLAUDE_EXTRA_ARGS "" split on spaces
            (strings.Fields); MORPHD_CLAUDE_USD 30; MORPHD_HOURS 3; MORPHD_EXECUTOR_USD 5; MORPHD_STRETCH_USD 30; MORPHD_MAX_PARALLEL 1;
            MORPHD_RESUMES_PER_HOUR 3; MORPHD_STALL_MINUTES 30; MORPHD_USAGE_ALERT 50. A number that does not parse → error
            "config: <KEY>: not a number: <value>". cmd/morphd/main.go: main reads .env from the working directory when present
            (ParseDotenv), Load(os.Getenv, …), opens the registry at StateDir, builds daemon.Deps with runner.OS{}, a Spawn of
            claude.Start(ctx, l.Bin, claude.Args(l), l.Dir, claude.Env(l)),
            telegram.Client{TGToken, TGChatID, http.DefaultClient.Do}.Post, http.DefaultClient.Do, time.Now, a NewID of 16 random
            bytes in hex, MCPBaseURL "http://127.0.0.1:<port>"; `func Build(d control.Control, known func(string) bool, session func(string) (string, bool), token string) http.Handler`
            = api.NewRouter(api.Handlers{Control: d}, token, mcpserver.Handler(d, known, mcpserver.Tokens{API: token, Session: session}));
            a ticker calls daemon.Tick every 30 s; http.ListenAndServe("127.0.0.1:" + port, handler); a Load error prints it to
            stderr and exits 2. Nothing but the listener address and the port is printed at start ("morphd listening on
            127.0.0.1:7080"); the token is never printed.
          steps:
            - uses: daemon
            - uses: api
            - uses: mcpserver
            - uses: queue
            - produces: Config
          examples:
            - given: 'the text "# comment\n\nMORPHD_TOKEN=abc\nexport TG_BOT_TOKEN=\"123:ABC\"\nTG_CHAT_ID=''-100''\nBAD LINE\nMORPHD_PORT = 7181\n"'
              when: ParseDotenv
              then: 'exactly map[string]string{"MORPHD_TOKEN": "abc", "TG_BOT_TOKEN": "123:ABC", "TG_CHAT_ID": "-100", "MORPHD_PORT": "7181"}'
            - given: 'getenv := a func over map{"HOME": "/home/morph"} (everything else ""); dotenv := map{"MORPHD_TOKEN": "abc"}'
              when: Load
              then: 'Config{Token: "abc", Port: 7080, StateDir: "/home/morph/.local/state/morphd", ProjectsDir: "/home/morph/projects", ClaudeBin: "claude", MorphBin: "morph", TGToken: "", TGChatID: "", Model: "", ExtraArgs: nil, Defaults: {30, 3, 5}, StretchUSD: 30, MaxParallel: 1, ResumesPerHour: 3, StallMinutes: 30, UsageAlertPercent: 50}, nil'
            - given: 'getenv over map{"HOME": "/h", "MORPHD_TOKEN": "env-tok", "MORPHD_PORT": "7181", "MORPHD_CLAUDE_EXTRA_ARGS": "--effort high", "MORPHD_CLAUDE_USD": "12.5", "MORPHD_MAX_PARALLEL": "2"}; dotenv map{"MORPHD_TOKEN": "file-tok", "MORPHD_HOURS": "1"}'
              when: Load
              then: 'Token "env-tok" (the environment wins), Port 7181, ExtraArgs ["--effort", "high"], Defaults {12.5, 1, 5}, MaxParallel 2'
            - given: 'getenv with no MORPHD_TOKEN and an empty dotenv; then MORPHD_TOKEN "x" and MORPHD_PORT "80a"; then MORPHD_STALL_MINUTES "soon"'
              when: Load
              then: 'errors "config: MORPHD_TOKEN is required"; "config: MORPHD_PORT: not a number: 80a"; "config: MORPHD_STALL_MINUTES: not a number: soon"'
            - given: 'h := Build(the fake Control of HTTP Handlers, known = true, session = ("s", true), "tok-1"); GET /healthz; GET /projects/demo/status with "Bearer tok-1"; POST /mcp/demo with "Bearer tok-1" and the tools/list JSON-RPC body of MCP Mount example 1'
              when: served on httptest.NewRecorder
              then: '200 {"status":"ok"} + "\n"; 200 with the Status JSON; 200 with result.tools listing "status" among the names'
Guardrail:
  - name: Injected Clock And Ids
    description: >
      No package but cmd/morphd reads the clock or a random source: time comes in as a `now` argument or an injected
      Now func() time.Time, ids from an injected NewID func() string; time.Now, math/rand and crypto/rand appear only in
      cmd/morphd. Timers are the daemon's Tick, driven by main's ticker.
  - name: No Network In Tests
    description: >
      Tests never open a listener or dial: HTTP is tested with httptest.NewRecorder and httptest.NewRequest, Telegram and
      GitHub through an injected Do, the MCP server over in-memory transports; a test writes files only under
      t.TempDir(); no test runs claude or reaches github.com or api.telegram.org.
  - name: No Shell Outside Runner
    description: >
      os/exec is imported only by package runner (git, morph) and package claude (the claude process); every other package
      runs commands through runner.Runner and tests script them with runner.Fake.
  - name: Secrets Never Logged
    description: >
      The API token, the session tokens, the GitHub token and the Telegram token never appear in a response body, a log
      line, a milestone, an error text or the argv of a spawned process; secrets live in files of mode 0600 under the
      state directory; the git credentials reach git through a credential store file, never through a URL or an argument.
Requirement:
  - name: Claude Behind An Interface
    description: >
      The claude CLI is reached only through claude.Process (stdin lines in, stdout lines out, an exit status); the
      daemon's tests use claude.Fake fed with lines from tests/fixtures/stream/probe.jsonl, never a real claude.
  - name: Bearer Token On Every Route
    description: >
      Every HTTP route but GET /healthz and the MCP endpoints requires Authorization: Bearer <MORPHD_TOKEN>; /mcp and
      /mcp/{project} require the same token; /mcp/{project}/session requires that project's current session token.
      morphd listens on 127.0.0.1 only; TLS and the public name are Caddy's.
  - name: The Session Reports Only Itself
    description: >
      A VPS session can call phase_done, wait_operator and milestone only through its own endpoint
      /mcp/{project}/session with the token morphd minted for that spawn; the token changes on every spawn, so a past
      session or another project cannot report.
